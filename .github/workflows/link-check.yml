name: link-check
on:
  push:
    branches: [link-check]
permissions:
  contents: write
jobs:
  shorten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create short links
        run: |
          LONG="https://tsukustukatadotojo-bit.github.io/anrevy-house/"
          ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$LONG")
          : > short.txt
          for name in anrevy anrvy anrevyhouse; do
            r=$(curl -s --max-time 20 "https://is.gd/create.php?format=simple&url=$ENC&shorturl=$name" || true)
            printf 'isgd-%s\t%s\n' "$name" "$r" >> short.txt
            case "$r" in https://*) break;; esac
          done
          printf 'isgd-random\t%s\n' "$(curl -s --max-time 20 "https://is.gd/create.php?format=simple&url=$ENC" || true)" >> short.txt
          printf 'tinyurl\t%s\n' "$(curl -s --max-time 20 "https://tinyurl.com/api-create.php?url=$ENC" || true)" >> short.txt
          cp short.txt list.txt
          while IFS=$'\t' read -r k u; do
            case "$u" in https://*) printf 'check-%s\t%s\n' "$k" "$(curl -s -o /dev/null -w '%{http_code} %{url_effective}' -L --max-time 20 "$u" || true)" >> short.txt;; esac
          done < list.txt
          cat short.txt
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add short.txt
          git commit -m "Short link results"
          git push
