name: link-check
on:
  push:
    branches: [link-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Brokers and CDN
        run: |
          cd tools && npm init -y >/dev/null && npm i mqtt@5.10.1 >/dev/null 2>&1
          node brokers.mjs || true
          echo "::notice title=brokers::$(sed ':a;N;$!ba;s/\n/%0A/g' out.txt)"
          c1=$(curl -sS -o /dev/null -w '%{http_code} %{size_download}' https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js)
          c2=$(curl -sS -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0 Chrome/129' 'https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=VT323&display=swap')
          t1=$(timeout 8 bash -c 'echo > /dev/tcp/openrelay.metered.ca/443' && echo open || echo closed)
          t2=$(timeout 8 bash -c 'echo > /dev/tcp/openrelay.metered.ca/80' && echo open || echo closed)
          echo "::notice title=cdn::mqtt.min.js $c1 | fredoka css $c2 | openrelay 443 $t1, 80 $t2"
