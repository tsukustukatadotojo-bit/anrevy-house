name: link-check
on:
  push:
    branches: [link-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Real browser test
        run: |
          pip install --quiet playwright==1.48.0
          python -m playwright install --with-deps chromium > /dev/null 2>&1
          python3 tools/studio_sync.py --dry --all > out_gal.txt 2>&1 || true
          cp studio/data/music.json site/studio/data/music.json
          grep -E "Bandcamp|Hypem" out_gal.txt > o2.txt; mv o2.txt out_gal.txt
          (cd site && python3 -m http.server 8000 > /dev/null 2>&1 &)
          sleep 2
          python3 tools/realtest5.py || true
          python3 -c "
          s=open('out_gal.txt').read().replace(chr(10),' ¶ ')
          for i in range(0,min(len(s),32000),3800): print('::notice title=galup'+str(i//3800)+'::'+s[i:i+3800])
          "
      - name: Save shots to branch
        run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan shots-out && git rm -rqf --cached . && git add shots out_gal.txt && git commit -qm "shots [skip ci]" && git push -q origin HEAD:link-check-out --force
