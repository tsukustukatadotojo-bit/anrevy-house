name: link-check
on:
  push:
    branches: [link-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gallery test
        run: |
          pip install --quiet paho-mqtt==2.1.0 pillow
          python3 tools/frames4.py
          python3 -c "
          s=open('out_gal.txt').read().replace(chr(10),' ¶ ')
          for i in range(0,min(len(s),32000),3800): print('::notice title=galup'+str(i//3800)+'::'+s[i:i+3800])
          "
