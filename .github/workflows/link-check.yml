name: link-check
on:
  push:
    branches: [link-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check billiards sites
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36'
          for u in \
            https://poki.com/en/g/8-ball-billiards-classic \
            https://www.crazygames.com/game/8-ball-billiards-classic \
            https://www.247billiards.com/ \
            https://8ballpool.com/ \
            https://www.miniclip.com/games/8-ball-pool-multiplayer \
            https://www.coolmathgames.com/0-8-ball-pool \
            https://www.mathplayground.com/8_ball_pool.html ; do
            r=$(curl -s -L -A "$UA" -o p.html -w '%{http_code} %{url_effective}' --max-time 25 "$u" || echo "ERR")
            t=$(grep -o -i '<title>[^<]*' p.html | head -1 | cut -c8-90)
            echo "::notice title=$(echo $u | cut -d/ -f3)::$r | $t | $(wc -c < p.html) bytes"
          done
