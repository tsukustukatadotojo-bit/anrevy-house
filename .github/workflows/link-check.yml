name: link-check
on:
  push:
    branches: [link-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live voice test
        run: |
          cd tools && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          sleep 70
          node live.mjs > log.txt 2>&1 || true
          cat log.txt
          [ -s out.txt ] || tail -c 1500 log.txt > out.txt
          echo "::notice title=live::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' out.txt)"
