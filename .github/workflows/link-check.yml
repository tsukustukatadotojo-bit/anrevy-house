name: link-check
on:
  push:
    branches: [link-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download media
        run: |
          mkdir -p media && cd media
          UA='AnrevyHouseBot/1.0 (personal fan site; https://github.com/tsukustukatadotojo-bit/anrevy-house)'
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sS -L -A "$UA" -o "$name" "$url" -w "$name %{http_code} %{size_download}\n" || true
            sleep 1
          done < ../tools/media.txt > ../dl.txt
          cd ..
          echo "::notice title=dl::$(sed ':a;N;$!ba;s/\n/%0A/g' dl.txt)"
          git config user.name "Claude"; git config user.email "noreply@anthropic.com"
          git checkout -B media
          git add media && git commit -q -m "Media from Wikimedia Commons" && git push -q -f origin media
