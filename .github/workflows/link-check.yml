name: link-check
on:
  push:
    branches: [link-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check videos
        run: |
          python3 tools/ytfind.py tools/q.txt
          echo "::notice title=yt::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' out.txt)"
