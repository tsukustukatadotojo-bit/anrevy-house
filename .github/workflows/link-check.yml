name: link-check
on:
  push:
    branches: [link-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          python3 tools/probe8.py || true
          python3 -c "
          s=open('out_gal.txt').read().replace(chr(10),' ¶ ')
          for i in range(0,min(len(s),32000),3800): print('::notice title=galup'+str(i//3800)+'::'+s[i:i+3800])
          "
