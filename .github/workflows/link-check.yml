name: link-check
on:
  push:
    branches: [link-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check 0
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36'
          for u in https://minesweeper.online/ https://www.minesweeperonline.com/ https://tetris.com/play-tetris https://www.google.com/logos/2010/pacman10-i.html https://freepacman.org/ https://playsnake.org/ https://play2048.co/ https://chromedino.com/; do
            r=$(curl -s -L -A "$UA" -o p.html -w '%{http_code} %{url_effective}' --max-time 25 "$u" || echo "ERR")
            t=$(grep -o -i '<title[^>]*>[^<]*' p.html | head -1 | sed 's/<title[^>]*>//' | cut -c1-70)
            echo "::notice title=$(echo $u | cut -d/ -f3)::$u => $r | $t | $(wc -c < p.html)b"
          done
      - name: Check 8
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36'
          for u in https://freeinvaders.org/ https://slowroads.io/ https://basketball.frvr.com/ https://www.crazygames.com/game/basketball-stars-2019 https://cardgames.io/ https://www.solitr.com/ https://poki.com/en/g/basketball-stars; do
            r=$(curl -s -L -A "$UA" -o p.html -w '%{http_code} %{url_effective}' --max-time 25 "$u" || echo "ERR")
            t=$(grep -o -i '<title[^>]*>[^<]*' p.html | head -1 | sed 's/<title[^>]*>//' | cut -c1-70)
            echo "::notice title=$(echo $u | cut -d/ -f3)::$u => $r | $t | $(wc -c < p.html)b"
          done
