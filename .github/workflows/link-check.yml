name: link-check
on:
  push:
    branches: [link-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find media
        run: |
          python3 tools/ytfind.py tools/q.txt || true
          python3 tools/commons.py || true
          echo "::notice title=yt::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' out.txt)"
          split -l 18 out2.txt part_ || true
          for f in part_*; do echo "::notice title=commons::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' $f)"; done
