name: link-check
on:
  push:
    branches: [link-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Studio sync dry run
        run: |
          python3 tools/studio_sync.py --dry 2>&1 | tee out_gal.txt
          python3 -c "
          s=open('out_gal.txt').read().replace(chr(10),' ¶ ')
          for i in range(0,min(len(s),32000),3800): print('::notice title=galup'+str(i//3800)+'::'+s[i:i+3800])
          "
      - uses: actions/upload-artifact@v4
        with:
          name: studio-data
          path: studio/data/
