name: link-check
on:
  push:
    branches: [link-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gallery test
        run: |
          pip install --quiet paho-mqtt==2.1.0 pillow
          python3 tools/brk443.py
          echo "::notice title=galup::$(cat out_gal.txt | tr '\n' ' ')"
