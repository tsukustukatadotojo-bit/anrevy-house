name: link-check
on:
  push:
    branches: [link-check]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every URL
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          : > results.tsv
          while IFS=$'\t' read -r id url; do
            [ -z "$url" ] && continue
            rm -f body.html
            meta=$(curl -sSL -A "$UA" -H "Accept-Language: en" -o body.html -w '%{http_code}\t%{url_effective}' --max-time 30 --connect-timeout 12 "$url" 2>err.txt || true)
            err=$(tr '\n' ' ' < err.txt | cut -c1-80)
            size=$(wc -c < body.html 2>/dev/null || echo 0)
            title=$(python3 - <<'PY'
          import re, html
          try:
              t = open('body.html', 'rb').read().decode('utf-8', 'ignore')
          except Exception:
              t = ''
          m = re.search(r'<title[^>]*>(.*?)</title>', t, re.S | re.I)
          print(html.unescape(re.sub(r'\s+', ' ', m.group(1))).strip()[:90] if m else '')
          PY
          )
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$id" "$url" "$meta" "$size" "$title" "$err" >> results.tsv
          done < urls.tsv
          cat results.tsv
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results.tsv
          git commit -m "Link check results"
          git push
