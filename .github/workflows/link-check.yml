name: link-check
on:
  push:
    branches: [link-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Recheck movie sites
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Safari/537.36'
          for u in https://www.rophim.ink/phimhay https://rophim.ink/ https://thophim.xyz/ http://thophim.xyz/ https://chillphimm.net/ https://sofaflix.mom/ https://tizihay.com/ https://motphimz.ac/; do
            out=$(curl -sS -L -A "$UA" -o p.html -w '%{http_code} %{url_effective} n=%{num_redirects}' --max-time 40 "$u" 2>&1 | tr '\n' ' ' | cut -c1-160)
            t=$(grep -o -i '<title[^>]*>[^<]*' p.html 2>/dev/null | head -1 | sed 's/<title[^>]*>//' | cut -c1-60); rm -f p.html
            echo "::notice title=$(echo $u | cut -d/ -f3)::$u => $out | $t"
          done
