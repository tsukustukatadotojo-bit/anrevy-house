name: link-check
on:
  push:
    branches: [link-check]
permissions:
  contents: read
jobs:
  yt:
    runs-on: ubuntu-latest
    steps:
      - name: Check YouTube embed
        run: |
          for id in R0zVL1YePDY; do
            u="https://www.youtube.com/watch?v=$id"
            code=$(curl -s -o o.json -w '%{http_code}' --max-time 20 "https://www.youtube.com/oembed?format=json&url=$u")
            title=$(python3 -c "import json;d=json.load(open('o.json'));print(d.get('title','')+' | '+d.get('author_name',''))" 2>/dev/null || head -c 120 o.json)
            ecode=$(curl -s -o e.html -w '%{http_code}' --max-time 20 -A 'Mozilla/5.0' "https://www.youtube.com/embed/$id")
            flag=$(grep -o '"playableInEmbed":[a-z]*' e.html | head -1)
            status=$(grep -o '"status":"[A-Z_]*"' e.html | head -1)
            echo "::notice title=$id::oembed=$code $title || embed=$ecode $flag $status"
          done
