# Studio: Letterboxd (haanvie) mỗi lần chạy; Watchlist, tin nhạc mới, bảng xếp hạng khi lần trước đã quá ~2 giờ.
name: studio-sync
on:
  schedule:
    - cron: '11,41 * * * *'
  push:
    branches: [main]             # GitHub hay bỏ lỡ lịch chạy, nên mỗi lần có commit mới (bài đọc, tin nhắn…) cũng chạy kèm
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: studio-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Cập nhật Letterboxd, nhạc mới, bảng xếp hạng
        run: python3 .github/scripts/studio_sync.py
