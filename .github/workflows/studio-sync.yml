# Studio: cập nhật nhật ký phim Letterboxd (haanvie) và tin nhạc mới cho trang studio/ — 2 giờ một lần.
name: studio-sync
on:
  schedule:
    - cron: '41 */2 * * *'
  push:
    branches: [main]
    paths:
      - '.github/scripts/studio_sync.py'
      - '.github/workflows/studio-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: studio-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Cập nhật Letterboxd + nhạc mới
        run: python3 .github/scripts/studio_sync.py
