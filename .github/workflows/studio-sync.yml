# Studio: Letterboxd (haanvie) mỗi 30 phút; Watchlist, tin nhạc mới, bảng xếp hạng 2 giờ một lần.
name: studio-sync
on:
  schedule:
    - cron: '11,41 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/scripts/studio_sync.py'
      - '.github/workflows/studio-sync.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: studio-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Cập nhật Letterboxd, nhạc mới, bảng xếp hạng
        run: python3 .github/scripts/studio_sync.py
