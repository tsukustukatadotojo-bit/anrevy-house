# Lưu tranh khách gửi (nút "Update" trong An Vy's Gallery) vào gallery/uploads, ghi chép & note của Studio — chạy 5 phút một lần.
name: gallery-sync
on:
  schedule:
    - cron: '2-57/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gallery-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Cài thư viện
        run: pip install --quiet paho-mqtt==2.1.0 pillow cryptography
      - name: Lưu tranh khách gửi
        run: python3 .github/scripts/gallery_sync.py
      - name: Báo tin nhắn mới về điện thoại (Web Push)
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
        run: python3 .github/scripts/chat_push.py
