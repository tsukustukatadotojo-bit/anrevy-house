<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>⌈ＧＡＭＥ　ＲＯＯＭ⌋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff2a6d; --cyan:#05d9e8; --gold:#ffd23f; --violet:#9b5cff; --lime:#2bff88;
    --ink:#fff4fb; --dim:#d9b8d0;
    --sw:1440px; --sh:810px; --line:500px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;touch-action:manipulation}
  body{background:#07020d;color:var(--ink);font-family:'VT323',monospace;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit}

  /* ===== TƯỜNG + SÀN ===== */
  .wall{
    position:fixed;left:0;right:0;top:0;height:var(--line);z-index:0;
    background:
      radial-gradient(ellipse 38% 70% at 14% 75%, rgba(255,42,109,.20), transparent 70%),
      radial-gradient(ellipse 34% 60% at 88% 62%, rgba(5,217,232,.16), transparent 70%),
      radial-gradient(ellipse 30% 50% at 50% 30%, rgba(255,210,63,.08), transparent 70%),
      repeating-linear-gradient(45deg, rgba(255,210,120,.055) 0 1.5px, transparent 1.5px 26px),
      repeating-linear-gradient(-45deg, rgba(255,210,120,.055) 0 1.5px, transparent 1.5px 26px),
      linear-gradient(180deg,#12031a 0%,#270726 55%,#3a0b26 100%);
  }
  .wall::after{
    content:'';position:absolute;left:0;right:0;bottom:0;height:calc(var(--sh) * .065);
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 2px, transparent 2px 70px),
      linear-gradient(180deg,#5c2612,#2a0e05);
    border-top:3px solid #c9a24a;box-shadow:inset 0 8px 14px rgba(0,0,0,.45);
  }
  #floor{position:fixed;left:0;top:var(--line);width:100%;height:calc(100% - var(--line));z-index:0;display:block}
  .bulbs{
    position:fixed;left:0;right:0;top:calc(3px + env(safe-area-inset-top,0px));height:12px;z-index:1;pointer-events:none;
    background:
      radial-gradient(circle at 12px 7px, #ffd23f 0 2.6px, rgba(255,210,63,.35) 3.2px, transparent 5px) 0 0/48px 12px repeat-x,
      radial-gradient(circle at 36px 7px, #ff2a6d 0 2.6px, rgba(255,42,109,.35) 3.2px, transparent 5px) 0 0/48px 12px repeat-x,
      linear-gradient(#3a2a10,#3a2a10) 0 3px/100% 1px no-repeat;
    animation:bulbs 1.1s steps(1) infinite;
  }
  @keyframes bulbs{50%{background-position:24px 0,24px 0,0 3px}}

  /* ===== SÂN KHẤU: mọi đồ vật đặt theo % ===== */
  .stage{
    position:fixed;left:50%;top:50%;width:var(--sw);height:var(--sh);transform:translate(-50%,-50%);
    z-index:2;font-size:calc(var(--sw) * .01);pointer-events:none;
  }
  .o{position:absolute;left:var(--x);width:var(--w);bottom:calc(100% - var(--b));pointer-events:auto}
  .o svg{display:block;width:100%;height:auto;overflow:visible}
  .hit{cursor:pointer;outline:none}
  .hit:focus-visible{filter:drop-shadow(0 0 .5em var(--gold))}
  @media (hover:hover){
    .hit:hover{filter:drop-shadow(0 0 .7em rgba(255,210,63,.45))}
    .hit[data-tag]::after{
      content:attr(data-tag);position:absolute;left:50%;top:-1.9em;transform:translateX(-50%);
      font:700 .85em 'Silkscreen',monospace;letter-spacing:.08em;white-space:nowrap;color:#111;
      background:var(--gold);padding:.15em .6em;border-radius:3px;opacity:0;transition:opacity .2s;pointer-events:none;
      box-shadow:0 0 .8em rgba(255,210,63,.7);
    }
    .hit:hover::after{opacity:1}
  }

  /* vị trí — màn hình ngang */
  #shelf {--x:3%;   --w:22%;  --b:61%;  z-index:2}
  .slotm.a{--x:26.6%;--w:7%;  --b:57%;  z-index:2}
  .slotm.b{--x:65.4%;--w:7%;  --b:57%;  z-index:2}
  #claw  {--x:74.5%;--w:11%;  --b:62%;  z-index:2}
  #shoot {--x:86.3%;--w:11.6%;--b:62.4%;z-index:2}
  #bill  {--x:29%;  --w:42%;  --b:93%;  z-index:4}
  #board {--x:2.5%; --w:24%;  --b:97%;  z-index:5}
  .lamp  {position:absolute;left:40%;width:20%;top:0;z-index:6;pointer-events:none}
  .lamp svg{display:block;width:100%;height:auto;overflow:visible}

  /* biển neon */
  .neon{
    position:absolute;z-index:1;pointer-events:none;font-family:'Monoton',cursive;text-align:center;line-height:1.08;white-space:nowrap;
    color:#ffe9f6;text-shadow:0 0 .05em #fff,0 0 .18em var(--nc,#ff2a6d),0 0 .42em var(--nc,#ff2a6d),0 0 .9em var(--nc,#ff2a6d);
    animation:flick 7s infinite;
  }
  .neon.main{left:75.5%;top:4.2%;width:22%;font-size:3.3em}
  .neon.suits{--nc:#05d9e8;left:25.6%;top:21%;width:9%;font-family:'VT323',monospace;font-size:3.2em;letter-spacing:.06em;animation-delay:-2s}
  .neon.jack{--nc:#ffd23f;left:63.8%;top:20.5%;width:10%;font-size:1.7em;color:#fff7d1;animation-delay:-4.5s}
  @keyframes flick{0%,90%,100%{opacity:1}91%{opacity:.35}92%{opacity:1}94%{opacity:.5}95%{opacity:1}}

  /* màn hình dọc (điện thoại) */
  body.portrait #shelf{--x:3%;  --w:47%;  --b:42%}
  body.portrait #claw {--x:52.5%;--w:21.5%;--b:41%}
  body.portrait #shoot{--x:75.3%;--w:22%;  --b:41.6%}
  body.portrait #bill {--x:3%;  --w:94%;  --b:73.5%}
  body.portrait #board{--x:16%; --w:68%;  --b:99%}
  body.portrait .slotm,body.portrait .lamp,body.portrait .neon.suits,body.portrait .neon.jack{display:none}
  body.portrait .neon.main{left:0;width:100%;top:2%;font-size:6.6em}
  body.portrait .neon.main br{display:none}

  /* ===== KỆ BOARDGAME (nhỏ, trong phòng) ===== */
  .shelf{display:flex;flex-direction:column;aspect-ratio:.86;container-type:inline-size;user-select:none;-webkit-user-select:none}
  .sh-top{
    flex:none;height:9cqw;position:relative;border-radius:1.5cqw 1.5cqw 0 0;
    background:linear-gradient(180deg,#8a4520,#5a2a12);border-bottom:.8cqw solid #c9a24a;
    display:flex;align-items:center;justify-content:center;
  }
  .sh-top span{font:700 4.2cqw 'Silkscreen',monospace;letter-spacing:.12em;color:#2a1006;background:linear-gradient(#ffe58a,#c9a24a);padding:.2cqw 2cqw;border-radius:.6cqw}
  .sh-body{
    flex:1;display:flex;flex-direction:column;min-height:0;
    border-left:3.4cqw solid #6b3416;border-right:3.4cqw solid #6b3416;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,.02) 0 2px, transparent 2px 9cqw), linear-gradient(180deg,#1f0e07,#140804);
    box-shadow:inset 0 0 4cqw rgba(0,0,0,.7);
  }
  .sh-row{
    flex:1;min-height:0;display:flex;align-items:flex-end;gap:.34cqw;padding:0 2.2cqw;
    border-bottom:2.6cqw solid #8a4520;box-shadow:inset 0 -1cqw 1.2cqw rgba(0,0,0,.55);
  }
  .sh-row i{
    display:block;flex:none;width:calc(var(--w) * .12cqw);height:calc(var(--h) * .46%);
    background:var(--c);border-radius:.35cqw .35cqw 0 0;
    box-shadow:inset 0 .7cqw 0 var(--c2), inset 0 -.9cqw 0 var(--c2), inset .25cqw 0 0 rgba(255,255,255,.15), inset -.25cqw 0 0 rgba(0,0,0,.3);
  }
  .sh-row i.m-holo{background:linear-gradient(160deg,#ff71ce,#01cdfe,#05ffa1,#fffb96)}
  .sh-row i.m-gold{background:linear-gradient(90deg,#8a6414,#f6d77a,#b8862b)}
  .sh-row i.m-neon{background:#0d0618;box-shadow:inset 0 0 0 .3cqw var(--c), 0 0 1cqw var(--c)}
  .sh-row b{display:flex;flex-direction:column;justify-content:flex-end;gap:.25cqw;height:100%;flex:none}
  .sh-row b i{width:calc(var(--lw) * .12cqw);height:calc(var(--lh) * .46%);border-radius:.3cqw}
  .sh-row u{display:block;flex:none;width:1.4cqw;height:46%;background:linear-gradient(90deg,#8a6414,#ffe58a,#8a6414);border-radius:.4cqw .4cqw 0 0}
  .sh-base{flex:none;height:5cqw;background:linear-gradient(180deg,#6b3416,#2a1006);border-radius:0 0 .8cqw .8cqw}

  /* ===== HỘP THOẠI ===== */
  .dlg{
    position:fixed;z-index:40;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));
    width:min(620px,calc(100% - 28px));transform:translateX(-50%) translateY(14px);
    padding:14px 20px 18px;border-radius:12px;cursor:pointer;
    background:linear-gradient(180deg,rgba(26,6,34,.94),rgba(10,2,16,.94));
    border:2px solid var(--pink);
    box-shadow:0 0 0 1px rgba(255,255,255,.12) inset, 0 0 22px rgba(255,42,109,.55), 0 18px 50px rgba(0,0,0,.6);
    opacity:0;pointer-events:none;transition:opacity .35s, transform .35s;
  }
  .dlg.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
  .dlg-who{display:block;font:700 12px 'Silkscreen',monospace;letter-spacing:.16em;color:var(--gold);margin-bottom:6px;text-shadow:0 0 8px rgba(255,210,63,.6)}
  #dlgText{display:block;font-size:clamp(25px,3vw,32px);line-height:1.12;color:#fff;text-shadow:0 0 10px rgba(255,113,206,.55)}
  .dlg-sub{display:block;margin-top:8px;font-size:17px;letter-spacing:.06em;color:var(--cyan);opacity:0;transition:opacity .5s}
  .dlg.done .dlg-sub{opacity:1}
  .dlg-more{position:absolute;right:14px;bottom:8px;font-size:16px;color:var(--pink);opacity:0;animation:blink 1s steps(1) infinite}
  .dlg.done .dlg-more{opacity:1}
  @keyframes blink{50%{opacity:0}}

  /* ===== HUD ===== */
  .hud{position:fixed;z-index:30;font-size:18px;letter-spacing:.08em}
  .hud-tl{top:calc(22px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px))}
  .hud-tr{top:calc(22px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));text-align:right}
  .hud a,.cred{
    display:inline-block;color:var(--ink);text-decoration:none;padding:2px 12px;border-radius:999px;
    background:rgba(10,2,16,.72);border:1.5px solid var(--pink);box-shadow:0 0 12px rgba(255,42,109,.45);
  }
  .hud a:hover,.hud a:focus-visible{background:var(--pink);color:#12031a;outline:none}
  .cred{border-color:var(--gold);box-shadow:0 0 12px rgba(255,210,63,.4);font:700 12px 'Silkscreen',monospace;padding:5px 12px}
  .cred b{color:var(--gold)}
  .hint{
    position:fixed;z-index:30;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    font-size:18px;letter-spacing:.1em;color:var(--dim);white-space:nowrap;text-shadow:0 0 8px #000;
    opacity:0;transition:opacity 1s;pointer-events:none;
  }
  .hint.on{opacity:1}

  /* ===== BI-DA ===== */
  .cue{cursor:pointer}
  .cue-g{transition:transform .25s ease}
  .cue-hit{pointer-events:stroke}
  @media (hover:hover){
    .cue:hover .cue-g{transform:translate(-8px,-.5px);filter:drop-shadow(0 0 4px #9fe3ff)}
    .cue:hover .plate rect{fill:#ffe58a}
  }
  .cue:focus-visible{outline:none}
  .cue:focus-visible .plate rect{stroke:#fff;stroke-width:1.5}
  .chalk{animation:chalk 1.8s ease-in-out infinite}
  @keyframes chalk{50%{opacity:.25}}
  .plate rect{fill:#e2b84e;transition:fill .2s}

  /* ===== MÁY GẮP THÚ ===== */
  .rig{animation:sway 5.2s ease-in-out infinite alternate}
  @keyframes sway{from{transform:translateX(-38px)}to{transform:translateX(38px)}}
  .cable,.hook,.pl,.pr{transform-box:fill-box}
  .cable{transform-origin:50% 0}
  .pl{transform-origin:100% 0}
  .pr{transform-origin:0 0}
  .claw.go .rig{animation-play-state:paused}
  .claw.go .cable{animation:cable 2.6s ease-in-out}
  .claw.go .hook{animation:hook 2.6s ease-in-out}
  .claw.go .pl{animation:pl 2.6s ease-in-out}
  .claw.go .pr{animation:pr 2.6s ease-in-out}
  @keyframes cable{0%,100%{transform:scaleY(1)}36%,50%{transform:scaleY(3.35)}}
  @keyframes hook{0%,100%{transform:translateY(0)}36%,50%{transform:translateY(54px)}}
  @keyframes pl{0%,34%{transform:rotate(16deg)}44%,88%{transform:rotate(-12deg)}100%{transform:rotate(0)}}
  @keyframes pr{0%,34%{transform:rotate(-16deg)}44%,88%{transform:rotate(12deg)}100%{transform:rotate(0)}}
  #prize{opacity:0;transform-box:fill-box;transform-origin:50% 100%}
  .claw.won #prize{animation:prize 2s ease-out}
  @keyframes prize{0%{opacity:0;transform:translateY(12px) scale(.4)}22%{opacity:1;transform:translateY(-26px) scale(1.15)}80%{opacity:1;transform:translateY(-30px) scale(1)}100%{opacity:0;transform:translateY(-44px) scale(.9)}}
  .bulb{animation:bulb 1s steps(1) infinite}
  .bulb.b{animation-delay:-.5s}
  @keyframes bulb{50%{fill:#5a2a40}}

  /* ===== MÁY BẮN SÚNG ===== */
  .ducks{animation:ducks 3.6s linear infinite}
  @keyframes ducks{from{transform:translateX(-40px)}to{transform:translateX(0)}}
  .dk{transform-box:fill-box;transform-origin:50% 100%;transition:transform .22s ease-in}
  .dk.down{transform:scaleY(.12)}
  .xhair{animation:aim 6s ease-in-out infinite}
  @keyframes aim{0%,100%{transform:translate(0,0)}25%{transform:translate(-30px,8px)}50%{transform:translate(22px,-6px)}75%{transform:translate(-8px,12px)}}
  .flash{opacity:0}
  .shoot.fire .flash{animation:flash .28s ease-out}
  @keyframes flash{0%{opacity:.5}100%{opacity:0}}
  .bang{opacity:0;transform-box:fill-box;transform-origin:center}
  .shoot.fire .bang{animation:bang .8s ease-out}
  @keyframes bang{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.2)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
  .gun{transform-box:fill-box;transform-origin:20% 80%}
  .shoot.fire .gun{animation:recoil .3s ease-out}
  @keyframes recoil{30%{transform:rotate(-9deg) translateX(-3px)}}
  .coin{animation:blink 1.4s steps(1) infinite}

  /* ===== MÁY SLOT ===== */
  .slot-light{animation:bulb 1.3s steps(1) infinite}
  .slotm.win .slot-jack{animation:blink .25s steps(1) 6}

  /* ===== KỆ PHÓNG TO ===== */
  .zoom{position:fixed;inset:0;z-index:60;display:none}
  .zoom.open{display:block}
  .z-bg{position:absolute;inset:0;background:rgba(8,2,14,.8);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);opacity:0;transition:opacity .4s}
  .zoom.show .z-bg{opacity:1}
  .z-scroll{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;padding:calc(70px + env(safe-area-inset-top,0px)) 16px 40px}
  .z-close{
    position:fixed;z-index:3;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));
    width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:22px;line-height:1;
    background:#12031a;border:2px solid var(--gold);color:var(--gold);box-shadow:0 0 14px rgba(255,210,63,.5);
    opacity:0;transition:opacity .3s;
  }
  .zoom.show .z-close{opacity:1}
  .z-close:hover,.z-close:focus-visible{background:var(--gold);color:#12031a;outline:none}
  .bigshelf{
    --k:1;--rowh:calc(190px * var(--k));--board:calc(14px * var(--k));
    position:relative;margin:0 auto;width:min(1080px,100%);transform-origin:0 0;
    background:linear-gradient(180deg,#26120a,#140804);border-radius:4px;
    box-shadow:0 0 0 14px #6b3416, 0 0 0 17px #2a1006, 0 0 0 19px #c9a24a, 0 40px 90px rgba(0,0,0,.75);
  }
  .bs-head{
    position:relative;padding:18px 18px 14px;text-align:center;
    background:linear-gradient(180deg,#8a4520,#5a2a12);border-bottom:4px solid #c9a24a;
  }
  .bs-head h2{
    font:400 clamp(26px,4.4vw,44px) 'Monoton',cursive;letter-spacing:.04em;color:#fff6d6;
    text-shadow:0 0 .06em #fff,0 0 .25em #ffd23f,0 0 .6em #ff8a00;
  }
  .bs-head p{font-size:18px;letter-spacing:.1em;color:#ffe9c2;margin-top:4px}
  .bs-read{
    margin:12px auto 0;max-width:640px;min-height:44px;padding:6px 14px;border-radius:6px;
    background:linear-gradient(180deg,#ffe58a,#c9a24a);color:#2a1006;
    font-size:20px;line-height:1.05;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);
    display:flex;align-items:center;justify-content:center;text-align:center;gap:8px;
  }
  .bs-read b{font:700 13px 'Silkscreen',monospace;letter-spacing:.04em}
  .cmp{padding:16px 16px 0;box-shadow:inset 0 14px 18px -10px rgba(0,0,0,.7)}
  .cmp-row{
    display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:calc(4px * var(--k));
    background:repeating-linear-gradient(180deg, transparent 0 var(--rowh), #a0552a var(--rowh), #7a3b1a calc(var(--rowh) + 4px), #4a200c calc(var(--rowh) + var(--board)));
  }
  .slot{height:var(--rowh);margin-bottom:var(--board);display:flex;align-items:flex-end}
  .slot.stack{flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:calc(2px * var(--k));padding-left:calc(4px * var(--k))}
  .bookend{
    height:calc(var(--rowh) * .78);width:calc(30px * var(--k));border-radius:4px 4px 0 0;
    background:linear-gradient(90deg,#7a5a12,#ffe58a 45%,#b8862b);box-shadow:inset 0 0 0 1px rgba(0,0,0,.35), 2px 0 6px rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;margin-right:calc(6px * var(--k));
  }
  .bookend span{writing-mode:vertical-rl;transform:rotate(180deg);font:700 calc(11px * var(--k)) 'Silkscreen',monospace;letter-spacing:.14em;color:#2a1006;white-space:nowrap}

  .bx{
    --t:#fff;--t2:#fff;
    position:relative;display:flex;flex-direction:column;align-items:center;gap:calc(5px * var(--k));
    width:calc(var(--w) * var(--k) * 1px);height:calc(var(--h) * var(--k) * 1px);
    padding:calc(12px * var(--k)) 0 calc(16px * var(--k));
    color:var(--t);text-decoration:none;border-radius:3px 3px 2px 2px;overflow:hidden;
    background:linear-gradient(90deg, rgba(0,0,0,.32), transparent 18%, rgba(255,255,255,.14) 48%, transparent 80%, rgba(0,0,0,.36)), var(--c);
    box-shadow:inset 0 calc(8px * var(--k)) 0 var(--c2), inset 0 calc(-11px * var(--k)) 0 var(--c2), inset 0 0 0 1px rgba(0,0,0,.45);
    transition:transform .18s ease, filter .18s ease;
  }
  .bx::before,.bx::after{content:'';position:absolute;pointer-events:none}
  .bx-ico{position:relative;z-index:1;flex:none;width:calc(24px * var(--k));height:calc(24px * var(--k));border-radius:5px;overflow:hidden;box-shadow:0 0 0 1.5px rgba(0,0,0,.55)}
  .bx-ico svg{display:block;width:100%;height:100%}
  .bx-t{
    position:relative;z-index:1;flex:1;min-height:0;writing-mode:vertical-rl;
    font-size:calc(var(--fs,17) * var(--k) * 1px);line-height:.95;letter-spacing:.05em;text-align:center;overflow:hidden;
  }
  .bx-no{position:absolute;z-index:1;bottom:calc(1px * var(--k));left:0;right:0;text-align:center;font:700 calc(8px * var(--k)) 'Silkscreen',monospace;color:var(--t2)}
  .bx.lay{
    flex-direction:row;gap:calc(7px * var(--k));width:calc(var(--lw) * var(--k) * 1px);height:calc(var(--lh) * var(--k) * 1px);
    padding:0 calc(14px * var(--k));
    background:linear-gradient(180deg, rgba(255,255,255,.16), transparent 40%, rgba(0,0,0,.3)), var(--c);
    box-shadow:inset calc(9px * var(--k)) 0 0 var(--c2), inset calc(-9px * var(--k)) 0 0 var(--c2), inset 0 0 0 1px rgba(0,0,0,.45);
    transform:translateX(var(--dx,0));
  }
  .bx.lay .bx-ico{width:calc(17px * var(--k));height:calc(17px * var(--k));border-radius:3px}
  .bx.lay .bx-t{writing-mode:horizontal-tb;flex:1;white-space:nowrap;text-overflow:ellipsis;text-align:left;font-size:calc(16px * var(--k))}
  .bx.lay .bx-no{display:none}
  .bx:hover,.bx:focus-visible{transform:translateY(calc(-14px * var(--k))) rotate(-2.5deg);filter:brightness(1.12) drop-shadow(0 10px 10px rgba(0,0,0,.6));z-index:4;outline:none}

  .fx-shine::after{left:0;right:0;top:-60%;height:220%;background:linear-gradient(172deg, transparent 42%, rgba(255,255,255,.5) 50%, transparent 58%);animation:sweep 4.2s ease-in-out infinite;animation-delay:var(--dl,0s)}

  let line = 0;
  function layout(){

  /* ================= SÀN NHẢY MÀU ================= */
  const fc = $('#floor'), fx = fc.getContext('2d');
  const COLORS = ['#ff2a6d', '#05d9e8', '#ffd23f', '#9b5cff', '#2bff88', '#ff8a00'];
  const RGB = COLORS.map(c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)));
  let FW = 0, FH = 0, tiles = [];
  function sizeFloor(){
    const dpr = Math.min(devicePixelRatio || 1, 1.5);
    FW = innerWidth; FH = Math.max(1, innerHeight - line);
    fc.width = Math.round(FW * dpr); fc.height = Math.round(FH * dpr);
    fx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // phối cảnh: đường chân trời ở trên mép tường
    const horizon = -FH * 0.62, f = FW * 0.7, ZW = 9;
    const fh = -horizon * ZW;
    const zNear = fh / (FH - horizon);

    const old = tiles; tiles = [];
    let r = 0;
    for (let z = ZW; z - tw > zNear - tw; z -= tw, r++){
      const z2 = z - tw;
      const y1 = horizon + fh / z, y2 = horizon + fh / Math.max(z2, 0.05);
      const half = (FW / 2) * z2 / f + tw;
      for (let X = -Math.ceil(half / tw) * tw, c = 0; X < half; X += tw, c++){
        const q = [[FW / 2 + f * X / z, y1], [FW / 2 + f * (X + tw) / z, y1], [FW / 2 + f * (X + tw) / z2, y2], [FW / 2 + f * X / z2, y2]];
        const prev = old[tiles.length];
        tiles.push({ q, r, c, x: X / tw, v: prev ? prev.v : 0, col: prev ? prev.col : (r + c) % COLORS.length });
      }

  const hash = (a, b, c) => { const s = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return s - Math.floor(s); };
  let lastBeat = -1;
  function drawFloor(now){
    const BEAT = 560, beat = reduce ? 0 : Math.floor(now / BEAT), pat = Math.floor(beat / 8) % 4;
    const newBeat = beat !== lastBeat; lastBeat = beat;
    fx.fillStyle = '#07020d'; fx.fillRect(0, 0, FW, FH);
    for (const t of tiles){

        let on;
        if (pat === 0) on = (t.r + Math.round(t.x) + beat) % 2 === 0;
        else if (pat === 1) on = hash(t.r, t.x, beat) > 0.45;
        else if (pat === 2) on = ((t.r + Math.round(t.x) - beat) % 3 + 3) % 3 === 0 || hash(t.r, t.x, beat) > .8;

        if (on) t.col = (Math.abs(Math.round(t.x) * 3 + t.r * 5) + Math.floor(beat / 2)) % COLORS.length;

      fx.lineTo(cx + (p1[0] - cx) * k, cy + (p1[1] - cy) * k);
      fx.lineTo(cx + (p2[0] - cx) * k, cy + (p2[1] - cy) * k);
      fx.lineTo(cx + (p3[0] - cx) * k, cy + (p3[1] - cy) * k);
      fx.closePath();
      fx.fillStyle = `rgba(${R},${G},${B},${(0.14 + a * 0.7).toFixed(3)})`;

      rabbit: `<ellipse cx="-3" cy="-16" rx="2.4" ry="7" fill="#fff" transform="rotate(-12 -3 -16)"/><ellipse cx="3.4" cy="-16" rx="2.4" ry="7" fill="#fff" transform="rotate(14 3.4 -16)"/><ellipse cx="-3" cy="-16" rx="1.1" ry="4.6" fill="#ffc2d6" transform="rotate(-12 -3 -16)"/><ellipse cy="4" rx="9" ry="7" fill="#eeeeee"/><circle cy="-6" r="7" fill="#fff"/><circle cx="-2.4" cy="-7" r=".9" fill="#222"/><circle cx="2.4" cy="-7" r=".9" fill="#222"/><circle cy="-4.6" r=".8" fill="#ff8fb1"/>`,
      pink: `<ellipse cx="-3" cy="-15" rx="2.4" ry="6.4" fill="#ffb3d1" transform="rotate(-12 -3 -15)"/><ellipse cx="3.4" cy="-15" rx="2.4" ry="6.4" fill="#ffb3d1" transform="rotate(14 3.4 -15)"/><ellipse cy="4" rx="9" ry="7" fill="#ff9cc4"/><circle cy="-5" r="7" fill="#ffb3d1"/><circle cx="-2.4" cy="-6" r=".9" fill="#222"/><circle cx="2.4" cy="-6" r=".9" fill="#222"/>`,
      bear: `<circle cx="-5.6" cy="-11" r="3" fill="#8a5427"/><circle cx="5.6" cy="-11" r="3" fill="#8a5427"/><ellipse cy="4" rx="9.5" ry="7.5" fill="#8a5427"/><circle cy="-5" r="7.6" fill="#a0662f"/><ellipse cy="-2.6" rx="3.4" ry="2.6" fill="#e3c39a"/><circle cx="-2.6" cy="-6.6" r=".9" fill="#222"/><circle cx="2.6" cy="-6.6" r=".9" fill="#222"/><circle cy="-3.4" r=".9" fill="#222"/>`,
      chick: `<circle cy="0" r="9" fill="#ffd23f"/><path d="M6 -2l5 1.6-5 1.6z" fill="#ff8a00"/><circle cx="3" cy="-3.6" r=".9" fill="#222"/><path d="M-6 1c2 3 5 3 7 1" stroke="#e0a800" fill="none"/>`,
      cat: `<path d="M-7 -8l1.6-7 4.4 4.4zM7 -8l-1.6-7-4.4 4.4z" fill="#5aa9ff"/><ellipse cy="4" rx="9" ry="7" fill="#4a90e2"/><circle cy="-5" r="7.4" fill="#5aa9ff"/><circle cx="-2.6" cy="-6" r=".9" fill="#111"/><circle cx="2.6" cy="-6" r=".9" fill="#111"/><path d="M-1 -3.4h2" stroke="#111" stroke-width=".7"/>`,
      wolf: `<path d="M-7 -8l1-8 5 5zM7 -8l-1-8-5 5z" fill="#2b2b33"/><ellipse cy="4" rx="9.5" ry="7.5" fill="#222229"/><circle cy="-5" r="7.6" fill="#2b2b33"/><ellipse cy="-2.4" rx="3.2" ry="2.4" fill="#45454f"/><circle cx="-2.6" cy="-6.6" r="1" fill="#ff1a2e"/><circle cx="2.6" cy="-6.6" r=".8" fill="#ddd"/>`,
    };
    return `<g transform="translate(${x} ${y}) scale(${s})">${P[t]}</g>`;
  }
  $('#pile').innerHTML = [
    ['bear', 30, 176, .9], ['cat', 58, 173, .85], ['rabbit', 84, 175, .9], ['chick', 106, 176, .8], ['wolf', 128, 175, .9],
    ['chick', 40, 186, 1], ['rabbit', 64, 187, 1], ['pink', 92, 188, 1], ['bear', 116, 187, 1], ['cat', 136, 189, .9],
  ].map(p => plush(...p)).join('');
  (function bulbs(){
    let s = '';
    for (let x = 20, i = 0; x <= 140; x += 12, i++) s += `<circle class="bulb${i % 2 ? ' b' : ''}" cx="${x}" cy="22" r="2.2" fill="#ffd23f"/><circle class="bulb${i % 2 ? '' : ' b'}" cx="${x}" cy="58" r="2.2" fill="#ffd23f"/>`;
    $('#clawBulbs').innerHTML = s;
    let s2 = '';
    for (let x = 22, i = 0; x <= 148; x += 14, i++) s2 += `<circle class="bulb${i % 2 ? ' b' : ''}" cx="${x}" cy="18" r="2" fill="#fff6c8"/>`;
    $('#shootBulbs').innerHTML = s2;
  })();
  const claw = $('#claw'), clawTitle = $('#clawTitle'), prize = $('#prize');
  let clawBusy = false;
  onActivate(claw, () => {
    if (clawBusy) return;
    clawBusy = true; spend(); hideHint();
    claw.classList.remove('won'); claw.classList.add('go');
    const win = Math.random() < 0.4;
    const kinds = ['rabbit', 'bear', 'chick', 'cat', 'wolf', 'pink'];
    setTimeout(() => {
      claw.classList.remove('go');
      if (win){
        prize.innerHTML = plush(kinds[(Math.random() * kinds.length) | 0], 116, 262, 1.1) +
          '<g fill="#ffd23f"><path d="M100 240l1.4 3 3 .4-2.2 2 .6 3-2.8-1.5-2.8 1.5.6-3-2.2-2 3-.4z"/><path d="M134 246l1 2.2 2.4.3-1.8 1.6.5 2.4-2.1-1.2-2.1 1.2.5-2.4-1.8-1.6 2.4-.3z"/></g>';
        void claw.getBoundingClientRect(); claw.classList.add('won');
      }
      clawTitle.textContent = win ? 'WIN ♥' : 'MISS';
      setTimeout(() => { clawTitle.textContent = 'CLAW'; claw.classList.remove('won'); clawBusy = false; }, 2000);
    }, reduce ? 50 : 2600);
  });

  /* ================= MÁY BẮN SÚNG ================= */
  const duckSVG = `<rect x="-1" y="0" width="2" height="12" fill="#8a5a2b"/><ellipse cx="0" cy="-4" rx="9" ry="6" fill="#ffd23f"/><circle cx="6" cy="-11" r="4.6" fill="#ffd23f"/><path d="M10 -11.4l5 1.6-5 1.6z" fill="#ff8a00"/><circle cx="7.3" cy="-12" r="1" fill="#111"/><path d="M-6 -5c3 2 6 2 8 0" stroke="#d9a400" fill="none"/>`;
  $('#ducks').innerHTML = [0, 1, 2, 3, 4].map(i => `<g transform="translate(${22 + i * 40} 134)"><g class="dk">${duckSVG}</g></g>`).join('');
  const shoot = $('#shoot'), scoreEl = $('#score');
  let score = 0, fireT = null;
  onActivate(shoot, () => {
    spend(); hideHint();
    shoot.classList.remove('fire'); void shoot.getBoundingClientRect(); shoot.classList.add('fire');
    clearTimeout(fireT); fireT = setTimeout(() => shoot.classList.remove('fire'), 820);
    const live = [...shoot.querySelectorAll('.dk:not(.down)')];
    if (live.length && Math.random() < 0.8){
      const d = live[(Math.random() * live.length) | 0];
      d.classList.add('down'); score += 100;
      setTimeout(() => d.classList.remove('down'), 1600);
    }
    scoreEl.textContent = 'SCORE ' + String(score).padStart(6, '0');
  });

  /* ================= MÁY SLOT ================= */
  const SYM = ['7', '♥', '★', '♦', '♠'];
  document.querySelectorAll('.slotm').forEach((m, k) => {
    m.innerHTML = `<svg viewBox="0 0 90 172" aria-hidden="true">
      <ellipse cx="45" cy="168" rx="42" ry="4" fill="rgba(0,0,0,.55)"/>
      <path d="M10 42Q10 22 45 20Q80 22 80 42V166H10Z" fill="${k ? '#5b1a8f' : '#b3122e'}" stroke="#ffd23f" stroke-width="2"/>
      <circle class="slot-light" cx="45" cy="13" r="6" fill="#ffd23f" style="animation-delay:${k * -.6}s"/>
      <rect x="16" y="32" width="58" height="14" rx="2" fill="#1a0510"/>
      <text class="slot-jack" x="45" y="42.6" text-anchor="middle" font-family="Silkscreen, monospace" font-weight="700" font-size="8" fill="#ffd23f">JACKPOT</text>
      <rect x="15" y="52" width="60" height="32" rx="3" fill="#fff" stroke="#ffd23f" stroke-width="2"/>
      <path d="M35 53v30M55 53v30" stroke="#ccc"/>
      <text class="reel" x="25" y="75" text-anchor="middle" font-family="VT323, monospace" font-size="22" fill="#d7263d">7</text>
      <text class="reel" x="45" y="75" text-anchor="middle" font-family="VT323, monospace" font-size="22" fill="#d7263d">7</text>
      <text class="reel" x="65" y="75" text-anchor="middle" font-family="VT323, monospace" font-size="22" fill="#d7263d">7</text>
      <path d="M80 70l7-26" stroke="#c9c9c9" stroke-width="2.4"/><circle cx="87.5" cy="42" r="4.5" fill="#e01e37"/>
      <rect x="20" y="92" width="14" height="7" rx="2" fill="#2bff88"/><rect x="38" y="92" width="14" height="7" rx="2" fill="#ffd23f"/><rect x="56" y="92" width="14" height="7" rx="2" fill="#ff2a6d"/>
      <rect x="18" y="122" width="54" height="14" rx="3" fill="#1a0510"/>
      <g fill="#ffd23f"><ellipse cx="32" cy="132" rx="5" ry="2"/><ellipse cx="44" cy="133" rx="5" ry="2"/><ellipse cx="57" cy="131.5" rx="5" ry="2"/></g>
    </svg>`;
    const reels = m.querySelectorAll('.reel');
    let busy = false;
    onActivate(m, () => {
      if (busy) return;
      busy = true; spend(); hideHint(); m.classList.remove('win');
      let n = 0;
      const t = setInterval(() => {
        reels.forEach(r => { r.textContent = SYM[(Math.random() * SYM.length) | 0]; });
        if (++n > (reduce ? 1 : 16)){
          clearInterval(t);
          const lucky = Math.random() < 0.18;
          if (lucky){ const s = SYM[(Math.random() * SYM.length) | 0]; reels.forEach(r => { r.textContent = s; }); m.classList.add('win'); }
          busy = false;
        }
      }, 70);
    });
  });

  /* ================= KỆ BOARDGAME ================= */
  const PAIRS = [
    ['#ff2a6d', '#ffd23f'], ['#05d9e8', '#1b1033'], ['#ffd23f', '#d7263d'], ['#9b5cff', '#f5f5f5'], ['#2bff88', '#0d3b2e'],
    ['#ff8a00', '#2b1a4a'], ['#ff71ce', '#01cdfe'], ['#f4f1e8', '#c0392b'], ['#1b1b2f', '#ff2a6d'], ['#0f5c4a', '#f4d35e'],
    ['#c0392b', '#f4f1e8'], ['#3a86ff', '#ffbe0b'], ['#e0aaff', '#5a189a'], ['#00b4d8', '#03045e'], ['#ff595e', '#1982c4'], ['#2d6a4f', '#f1faee']
  ];
  const FX = ['shine', 'holo', 'stripe', 'neon', 'dots', 'gold', 'glitter', 'check', 'glitch', 'pulse'];
  const lum = hex => { const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255); return .2126 * r + .7152 * g + .0722 * b; };
  const ink = hex => lum(hex) > .55 ? '#160a1e' : '#ffffff';
  let total = 0, no = 0;
  const big = [], mini = [];
  SHELF.forEach((sec, si) => {
    const n = sec.items.length, lie = n >= 12 ? 3 : n >= 7 ? 2 : 0;
    let bigRow = `<div class="slot"><div class="bookend"><span>${esc(sec.label)}</span></div></div>`;
    let miniRow = '<u></u>';
    let stackBig = '', stackMini = '';
    sec.items.forEach((it, i) => {
      no++; total++;
      let [c, c2] = PAIRS[(no * 5 + si * 3) % PAIRS.length];
      const fxn = FX[(no * 7 + si * 3) % FX.length];
      if (fxn === 'neon' && lum(c) < lum(c2)) [c, c2] = [c2, c];   // chữ neon dùng màu sáng hơn
      const longest = Math.max(...it.n.split(/\s+/).map(s => s.length)), fs = longest > 11 ? 14 : longest > 8 ? 15.5 : 17;
      const w = 40 + Math.round(hash(no, si, 1) * 16), h = Math.min(176, 136 + Math.round(hash(no, si, 2) * 40) + (it.n.length > 16 ? 10 : 0));
      const t = fxn === 'neon' ? c : (fxn === 'holo' || fxn === 'gold') ? '#1b0b2a' : ink(c);
      const style = `--c:${c};--c2:${c2};--t:${t};--t2:${ink(c2)};--fs:${fs};--dl:${(-hash(no, 3, 3) * 4).toFixed(2)}s`;
      const label = `${esc(it.n)} — ${esc(it.d)} (mở thẻ mới)`;
      const inner = `<span class="bx-ico">${it.i}</span><span class="bx-t">${esc(it.n)}</span><span class="bx-no">${String(no).padStart(2, '0')}</span>`;
      const mcls = fxn === 'holo' ? 'm-holo' : fxn === 'gold' ? 'm-gold' : fxn === 'neon' ? 'm-neon' : '';
      if (i >= n - lie){
        const lw = 128 + Math.round(hash(no, si, 4) * 34), lh = 26 + Math.round(hash(no, si, 5) * 6), dx = Math.round((hash(no, si, 6) - .5) * 10);
        stackBig += `<a class="bx lay fx-${fxn}" href="${esc(it.u)}" target="_blank" rel="noopener" style="${style};--lw:${lw};--lh:${lh};--dx:${dx}px" data-n="${esc(it.n)}" data-d="${esc(it.d)}" aria-label="${label}">${inner}</a>`;
        stackMini += `<i class="${mcls}" style="--c:${c};--c2:${c2};--lw:${lw};--lh:${lh};margin-left:${(dx * .12).toFixed(2)}cqw"></i>`;
      } else {
        bigRow += `<div class="slot"><a class="bx fx-${fxn}" href="${esc(it.u)}" target="_blank" rel="noopener" style="${style};--w:${w};--h:${h}" data-n="${esc(it.n)}" data-d="${esc(it.d)}" aria-label="${label}">${inner}</a></div>`;
        miniRow += `<i class="${mcls}" style="--c:${c};--c2:${c2};--w:${w};--h:${h}"></i>`;
      }
    });
    if (stackBig){ bigRow += `<div class="slot stack">${stackBig}</div>`; miniRow += `<b>${stackMini}</b>`; }
    big.push(`<section class="cmp" aria-label="${esc(sec.label)}"><div class="cmp-row">${bigRow}</div></section>`);
    mini.push(`<div class="sh-row">${miniRow}</div>`);
  });
  $('#bsBody').innerHTML = big.join('');
  $('#miniShelf').innerHTML = mini.join('');
  $('#bsCount').textContent = `${total} boxes · ${SHELF.length} shelves · pick one`;

  const bsRead = $('#bsRead'), bsDefault = bsRead.innerHTML;
  const showSpine = a => { bsRead.innerHTML = `<b>${esc(a.dataset.n)}</b> ${esc(a.dataset.d)} ↗`; };
  $('#bsBody').addEventListener('pointerover', e => { const a = e.target.closest('.bx'); if (a) showSpine(a); });
  $('#bsBody').addEventListener('focusin', e => { const a = e.target.closest('.bx'); if (a) showSpine(a); });
  $('#bsBody').addEventListener('pointerleave', () => { bsRead.innerHTML = bsDefault; });

  // nhấn 1 lần: câu thoại · nhấn đúp: phóng to kệ
  const shelf = $('#shelf'), zoom = $('#zoom'), bs = $('#bigshelf'), zScroll = $('#zScroll'), zClose = $('#zClose');
  let lastTap = 0, sayT = null;
  shelf.addEventListener('click', () => {
    const now = performance.now();
    if (now - lastTap < 420){ lastTap = 0; clearTimeout(sayT); openShelf(); return; }
    lastTap = now;
    say('shelf', touch ? '✦ double-tap the shelf to open it' : '✦ double-click the shelf to open it');
  });
  shelf.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openShelf(); } });

  let isOpen = false;
  function flipFrom(){
    const from = shelf.getBoundingClientRect(), to = bs.getBoundingClientRect();
    return `translate(${from.left - to.left}px, ${from.top - to.top}px) scale(${from.width / to.width})`;
  }
  function openShelf(){
    if (isOpen) return;
    isOpen = true; hush(); hideHint();
    zoom.classList.add('open'); zScroll.scrollTop = 0;
    bs.style.transition = 'none'; bs.style.opacity = '.3'; bs.style.transform = flipFrom();
    requestAnimationFrame(() => requestAnimationFrame(() => {
      zoom.classList.add('show');
      bs.style.transition = reduce ? 'none' : 'transform .6s cubic-bezier(.2,.8,.2,1), opacity .35s';
      bs.style.transform = ''; bs.style.opacity = '';
    }));
    zClose.focus({ preventScroll: true });
  }
  function closeShelf(){
    if (!isOpen) return;
    isOpen = false;
    zoom.classList.remove('show');
    bs.style.transition = reduce ? 'none' : 'transform .45s cubic-bezier(.5,0,.8,.4), opacity .45s';
    bs.style.transform = flipFrom(); bs.style.opacity = '0';
    setTimeout(() => { zoom.classList.remove('open'); bs.style.transform = ''; bs.style.opacity = ''; shelf.focus({ preventScroll: true }); }, reduce ? 0 : 460);
  }
  zClose.addEventListener('click', closeShelf);
  zScroll.addEventListener('click', e => { if (!e.target.closest('.bigshelf')) closeShelf(); });
  addEventListener('keydown', e => { if (e.key === 'Escape'){ if (isOpen) closeShelf(); else hush(); } });

  window.__game = { openShelf, closeShelf, say };
})();
</script>
</body>
</html>
