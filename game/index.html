<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>⌈ＧＡＭＥ　ＲＯＯＭ⌋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap" rel="stylesheet">
<link rel="preload" as="image" href="media/ship.jpg">
<style>
  :root{--pink:#ff2a6d;--cyan:#05d9e8;--gold:#ffd23f;--ink:#f4f6ff;--dim:#b9c0e8}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:'VT323',monospace;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  button{font:inherit;color:inherit}
  [hidden]{display:none!important}

  /* ===== ĐOẠN MỞ ĐẦU ===== */
  .stage{position:fixed;inset:0;z-index:1;overflow:hidden;background:#000;cursor:pointer}
  .layer{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
  .layer.on{opacity:1}
  .ship{background:#05030c url(media/ship.jpg) center/cover no-repeat;transform-origin:50% 45%}
  .ship.drift{animation:drift 26s ease-in-out infinite alternate}
  @keyframes drift{from{transform:scale(1.04) translate(0,0)}to{transform:scale(1.1) translate(-1.2%,.8%)}}
  /* mí mắt: lớp đen khoét một lỗ bầu dục mép mềm, mở dần ra */
  .lids{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse var(--rx,0%) var(--ry,0%) at 50% 50%, transparent 0, transparent calc(var(--ry,0%) * .55), rgba(40,6,18,.75) calc(var(--ry,0%) * .86), #000 var(--ry,0%), #000 100%)}
  .city-bg{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);filter:blur(26px) brightness(.55) saturate(1.3)}
  .city{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:transparent}
  body.portrait .city{object-fit:cover}
  .mall{background:#120818 url(media/mall.jpg) center 46%/cover no-repeat}
  .mall.on{animation:kb 18s ease-out forwards}
  @keyframes kb{from{transform:scale(1.12)}to{transform:scale(1.0)}}
  body.portrait .mall.on{animation:pan 16s ease-in-out infinite alternate}
  @keyframes pan{from{background-position:0% 46%}to{background-position:100% 46%}}
  .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,#fff,#ffb3e6 40%,#ff2a6d 75%,#2a0614);opacity:0;pointer-events:none}
  .flash.go{animation:flash 1.6s ease forwards}
  @keyframes flash{0%{opacity:0}45%{opacity:1}100%{opacity:1}}
  .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55))}
  .sound{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;display:none;cursor:pointer;
    font:700 13px 'Silkscreen',monospace;letter-spacing:.1em;padding:9px 16px;border-radius:999px;background:rgba(10,4,20,.8);border:1.5px solid var(--cyan);color:var(--ink);box-shadow:0 0 16px rgba(5,217,232,.5)}
  .sound.on{display:block}

  /* hộp thoại */
  .dlg{position:fixed;z-index:20;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));width:min(760px,calc(100% - 28px));transform:translate(-50%,16px);
    padding:16px 22px 20px;border-radius:14px;background:linear-gradient(180deg,rgba(12,10,32,.86),rgba(6,4,18,.92));
    border:1.5px solid rgba(5,217,232,.7);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 0 26px rgba(5,217,232,.35),0 20px 50px rgba(0,0,0,.6);
    opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .dlg.on{opacity:1;transform:translate(-50%,0)}
  .dlg-who{display:block;font:700 11px 'Silkscreen',monospace;letter-spacing:.2em;color:var(--cyan);margin-bottom:8px;text-shadow:0 0 8px rgba(5,217,232,.7)}
  #dlgText{display:block;font-size:clamp(25px,3.2vw,34px);line-height:1.15;color:#fff;text-shadow:0 0 12px rgba(160,140,255,.5);min-height:1.15em}
  .dlg-more{position:absolute;right:16px;bottom:10px;color:var(--pink);font-size:18px;opacity:0}
  .dlg.done .dlg-more{opacity:1;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .tap{position:fixed;z-index:19;left:50%;bottom:calc(34px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:20px;letter-spacing:.14em;color:var(--dim);
    text-shadow:0 0 10px #000;opacity:0;transition:opacity .8s;pointer-events:none;white-space:nowrap}
  .tap.on{opacity:1;animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.45}}
  .skip{position:fixed;z-index:30;right:max(14px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));cursor:pointer;
    font:700 11px 'Silkscreen',monospace;letter-spacing:.12em;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35);color:rgba(255,255,255,.75)}
  .skip:hover,.skip:focus-visible{background:#fff;color:#000;outline:none}

  /* ===== SẢNH 6 CỬA ===== */
  .hub{position:fixed;inset:0;z-index:2;opacity:0;transition:opacity 1.4s ease;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-x}
  .hub::-webkit-scrollbar{display:none}
  .hub-in{position:relative;height:100%;width:max(100%,110vh)}
  .hub.on{opacity:1}
  #hubCv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .door-btn{position:absolute;left:0;top:0;border:0;background:transparent;cursor:pointer;border-radius:6px}
  .door-btn:focus-visible{outline:2px dashed #fff;outline-offset:4px}
  .hub-title{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:3;pointer-events:none;white-space:nowrap;
    font:700 clamp(15px,2vw,22px) 'Orbitron',sans-serif;letter-spacing:.32em;color:#ffe9f2;text-shadow:0 0 8px var(--pink),0 0 20px var(--pink)}
  .hub-sub{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:3;pointer-events:none;white-space:nowrap;
    font-size:19px;letter-spacing:.12em;color:var(--dim);text-shadow:0 0 8px #000}
  .fade{position:fixed;inset:0;z-index:40;pointer-events:none;opacity:0;transition:opacity .7s ease;background:#000}
  .fade.on{opacity:1}

  /* HUD + màn hình nhạc */
  .hud{position:fixed;z-index:31;top:calc(16px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));display:flex;gap:8px;flex-wrap:wrap;font-size:18px;letter-spacing:.08em}
  .hud a,.hud button{display:inline-block;color:var(--ink);text-decoration:none;padding:2px 12px;border-radius:999px;cursor:pointer;background:rgba(6,4,18,.72);border:1.5px solid var(--pink);box-shadow:0 0 12px rgba(255,42,109,.4)}
  .hud a:hover,.hud a:focus-visible,.hud button:hover,.hud button:focus-visible{background:var(--pink);color:#12031a;outline:none}
  .tv{--tvw:clamp(170px,17vw,250px);position:fixed;z-index:35;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:var(--tvw);overflow:hidden;border-radius:8px;
    background:rgba(6,4,18,.88);border:1.5px solid var(--cyan);box-shadow:0 0 14px rgba(5,217,232,.45)}
  body.portrait .tv{--tvw:156px;bottom:auto;top:calc(56px + env(safe-area-inset-top,0px))}
  .tv-bar{display:flex;align-items:center;gap:4px;padding:3px 4px 3px 9px;font-size:15px;line-height:1;letter-spacing:.08em}
  .tv-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tv-t i{font-style:normal;display:inline-block;width:1.1em;color:var(--cyan)}
  .tv-bar button{font-size:14px;line-height:1.1;padding:1px 8px;border-radius:999px;cursor:pointer;background:rgba(255,255,255,.08);border:1px solid rgba(5,217,232,.55)}
  .tv-bar button:hover,.tv-bar button:focus-visible{background:var(--cyan);color:#12031a;outline:none}
  .tv-scr{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
  .tv-scr iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .tv-msg{position:absolute;z-index:1;left:0;right:0;bottom:0;padding:3px 6px;text-align:center;font-size:14px;letter-spacing:.06em;background:rgba(6,4,18,.78)}
  .tv-msg small{display:block;font-size:12px;color:var(--dim)}
  .tv.on .tv-msg{display:none}
  .tv.dead .tv-msg{display:flex;flex-direction:column;justify-content:center;top:0;background:rgba(6,4,18,.9)}
  .tv.min{width:auto}
  .tv.min .tv-scr{position:absolute;top:100%;left:0;width:var(--tvw);opacity:0;pointer-events:none}
  body.in-video .tv{opacity:0;pointer-events:none}
  @media (max-width:640px){ .hud{font-size:15px} .hub-sub{font-size:16px} }
  body.portrait .hub-sub{white-space:normal;width:88%;text-align:center}
  body.portrait .hub-title{top:calc(100px + env(safe-area-inset-top,0px));font-size:15px;letter-spacing:.3em}
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition-duration:.01s!important} }
</style>
</head>
<body>
  <!-- ĐOẠN MỞ ĐẦU -->
  <div class="stage" id="stage" aria-label="Đoạn mở đầu. Bấm vào màn hình để tiếp tục.">
    <div class="layer ship on" id="ship"></div>
    <div class="layer" id="cityL"><canvas class="city-bg" id="cityBg" aria-hidden="true"></canvas><video class="city" id="city" src="media/city.mp4" poster="media/city-poster.jpg" playsinline preload="auto"></video></div>
    <div class="layer mall" id="mall"></div>
    <div class="vignette"></div>
    <div class="lids" id="lids"></div>
    <div class="flash" id="flash"></div>
    <button class="sound" id="soundBtn">🔊 BẬT TIẾNG VIDEO</button>
  </div>
  <div class="dlg" id="dlg" role="status" aria-live="polite"><span class="dlg-who">◌ ＴＨＥ　ＷＩＲＥＤ</span><span id="dlgText"></span><span class="dlg-more" aria-hidden="true">▼</span></div>
  <div class="tap" id="tap">chạm vào màn hình ▼</div>
  <button class="skip" id="skip" aria-label="Bỏ qua đoạn mở đầu">BỎ QUA ›</button>

  <!-- SẢNH 6 CỬA -->
  <main class="hub" id="hub" hidden aria-label="Sảnh trò chơi với 6 cánh cửa">
    <div class="hub-in" id="hubIn">
      <canvas id="hubCv" aria-hidden="true"></canvas>
      <div id="doors"></div>
    </div>
    <div class="hub-title" aria-hidden="true">THE WIRED · ARCADE</div>
    <div class="hub-sub" id="hubSub">chọn một cánh cửa</div>
  </main>
  <div class="fade" id="fade"></div>

  <nav class="hud" aria-label="Điều hướng">
    <a href="../home.html">← ANREVY HOUSE</a>
    <button id="replay" hidden>↺ XEM LẠI MỞ ĐẦU</button>
  </nav>

  <!-- MÀN HÌNH NHẠC: phát ngay trong trang, ẩn được -->
  <div class="tv" id="tv">
    <div class="tv-bar">
      <span class="tv-t"><i aria-hidden="true">♪</i>wired.fm</span>
      <button id="snd" aria-pressed="false" aria-label="Bật hoặc tắt tiếng nhạc">off</button>
      <button id="tvMin" aria-expanded="true" aria-controls="tvScr" aria-label="Ẩn video">–</button>
    </div>
    <div class="tv-scr" id="tvScr"><div id="yt"></div><span class="tv-msg" id="tvMsg">tap anywhere for sound</span></div>
  </div>

<script>
(() => {
  /* ======= CÀI ĐẶT ======= */
  const MUSIC = 'aTfDtUFiquY';    // nhạc nền (mã video YouTube) — thay mã này để đổi nhạc
  const LINES_SHIP = [
    'Bạn đang trên tàu tới thành phố Cyberpunk.',
    'Khu giải trí này tách biệt khỏi Anrevy House nhưng vẫn nằm trong The Wired',
    'Vy đã rất tâm huyết tạo ra chúng.',
    'Chợp mắt chút đi, còn lâu mới đến'
  ];
  const LINE_ARRIVE = 'Đến nơi rồi, tự do trải nghiệm nhé';
  // 6 cánh cửa (không ghi tên, chỉ khác màu) → 6 phòng game
  const DOORS = [
    { href: 'cyber/',  col: '#ff2a6d' },
    { href: 'space/',  col: '#18e0ff' },
    { href: 'arcade/', col: '#ffd23f' },
    { href: 'vapor/',  col: '#ff9ce6' },
    { href: 'solar/',  col: '#4fe08a' },
    { href: 'dark/',   col: '#9a5cff' },
  ];
  /* ======================= */

  const $ = s => document.querySelector(s);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touch = matchMedia('(hover: none)').matches;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const sleep = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 200) : ms));
  const portraitCheck = () => document.body.classList.toggle('portrait', innerWidth / innerHeight < 1);
  portraitCheck(); addEventListener('resize', portraitCheck);

  /* ================= NHẠC (YouTube) ================= */
  const tv = $('#tv'), tvMsg = $('#tvMsg'), snd = $('#snd'), tvMin = $('#tvMin');
  let yt = null, ytReady = false, ytDead = false, soundOn = false, userMuted = false, gestured = false, ducked = false;
  function sndUI(){ snd.textContent = soundOn ? 'on' : 'off'; snd.setAttribute('aria-pressed', soundOn); tv.classList.toggle('on', soundOn); }
  function noSignal(txt){ ytDead = true; soundOn = false; tv.classList.add('dead'); tvMsg.innerHTML = 'no signal<small>' + txt + '</small>'; sndUI(); }
  function soundUp(){ if (!ytReady || ytDead || ducked) return; yt.unMute(); yt.setVolume(60); yt.playVideo(); soundOn = true; sndUI(); }
  function soundDown(){ if (ytReady) yt.mute(); soundOn = false; sndUI(); }
  function duck(on){ ducked = on; if (on){ if (ytReady) yt.mute(); } else if (gestured && !userMuted) soundUp(); }
  if (location.protocol === 'file:') noSignal('chỉ chạy khi mở qua web');
  else {
    window.onYouTubeIframeAPIReady = () => {
      yt = new YT.Player('yt', {
        videoId: MUSIC,
        playerVars: { autoplay: 1, mute: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, modestbranding: 1, playsinline: 1, rel: 0, loop: 1, playlist: MUSIC, origin: location.origin },
        events: {
          onReady: e => { ytReady = true; e.target.getIframe().setAttribute('title', 'Nhạc nền Game Room'); e.target.mute(); e.target.playVideo(); if (gestured && !userMuted && !ducked) soundUp(); },
          onStateChange: e => { if (e.data === YT.PlayerState.ENDED){ e.target.seekTo(0); e.target.playVideo(); } },
          onError: () => noSignal('video không phát được')
        }
      });
    };
    const tag = document.createElement('script'); tag.src = 'https://www.youtube.com/iframe_api'; tag.onerror = () => noSignal('không tải được YouTube'); document.head.appendChild(tag);
    setTimeout(() => { if (!ytReady && !ytDead) noSignal('không tải được YouTube'); }, 15000);
  }
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, e => { if (e.target.closest && e.target.closest('#snd')) return; gestured = true; if (!userMuted && !soundOn) soundUp(); }, true));
  snd.addEventListener('click', () => { gestured = true; if (soundOn){ userMuted = true; soundDown(); } else { userMuted = false; soundUp(); } });
  function setMin(m){ tv.classList.toggle('min', m); tvMin.textContent = m ? '▢' : '–'; tvMin.setAttribute('aria-expanded', !m); tvMin.setAttribute('aria-label', m ? 'Hiện video' : 'Ẩn video'); try { localStorage.setItem('game-tv-min', m ? '1' : '0'); } catch (e) {} }
  let startMin = innerWidth < 640; try { const v = localStorage.getItem('game-tv-min'); if (v) startMin = v === '1'; } catch (e) {}
  setMin(startMin);
  tvMin.addEventListener('click', () => setMin(!tv.classList.contains('min')));

  /* ================= HỘP THOẠI ================= */
  const dlg = $('#dlg'), dlgText = $('#dlgText'), tapEl = $('#tap');
  let typing = null, typingDone = null;
  function say(text){
    clearInterval(typing); dlg.classList.remove('done'); dlg.classList.add('on'); dlgText.textContent = '';
    return new Promise(res => {
      let i = 0; typingDone = () => { clearInterval(typing); dlgText.textContent = text; dlg.classList.add('done'); typingDone = null; res(); };
      typing = setInterval(() => { i++; dlgText.textContent = text.slice(0, i); if (i >= text.length) typingDone(); }, reduce ? 1 : 40);
    });
  }
  const hush = () => { clearInterval(typing); dlg.classList.remove('on', 'done'); };
  // chờ một lần bấm vào màn hình (bấm lúc chữ đang chạy thì hiện hết câu)
  let tapWaiter = null;
  const waitTap = () => new Promise(res => { tapWaiter = res; });
  document.addEventListener('pointerdown', e => {
    if (e.button > 0 || (e.target.closest && e.target.closest('.hud, .tv, .skip, .sound, .hub'))) return;
    if (typingDone){ typingDone(); return; }
    if (tapWaiter){ const r = tapWaiter; tapWaiter = null; r(); }
  });
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && !(e.target.closest && e.target.closest('button,a'))){ e.preventDefault(); if (typingDone){ typingDone(); return; } if (tapWaiter){ const r = tapWaiter; tapWaiter = null; r(); } }
  });

  /* ================= MÍ MẮT: mở / chớp / nhắm ================= */
  const lids = $('#lids'), ship = $('#ship');
  let eye = { rx: 0, ry: 0, blur: 14 };
  function setEye(e){ lids.style.setProperty('--rx', e.rx + '%'); lids.style.setProperty('--ry', e.ry + '%'); ship.style.filter = `blur(${e.blur.toFixed(1)}px) brightness(${(.6 + .4 * clamp(e.ry / 90, 0, 1)).toFixed(2)})`; }
  function tweenEye(to, ms){
    const from = Object.assign({}, eye), t0 = performance.now(); ms = reduce ? 1 : ms;
    return new Promise(res => { const step = now => { const k = clamp((now - t0) / ms, 0, 1), s = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; for (const p in to) eye[p] = from[p] + (to[p] - from[p]) * s; setEye(eye); if (k < 1) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); });
  }
  async function openEyes(){
    eye = { rx: 0, ry: 0, blur: 14 }; setEye(eye);
    await sleep(500);
    await tweenEye({ rx: 70, ry: 16, blur: 10 }, 1300);
    await tweenEye({ rx: 66, ry: 1, blur: 10 }, 260);            // chớp
    await sleep(160);
    await tweenEye({ rx: 85, ry: 38, blur: 6 }, 1000);
    await tweenEye({ rx: 82, ry: 6, blur: 5 }, 220);             // chớp lần nữa
    await tweenEye({ rx: 120, ry: 70, blur: 2.5 }, 900);
    await tweenEye({ rx: 115, ry: 55, blur: 2 }, 300);
    await tweenEye({ rx: 220, ry: 220, blur: 0 }, 1500);
    ship.classList.add('drift');
  }
  async function closeEyes(){
    await tweenEye({ rx: 110, ry: 60, blur: 2 }, 1400);
    await tweenEye({ rx: 90, ry: 30, blur: 4 }, 900);
    await tweenEye({ rx: 95, ry: 40, blur: 4 }, 500);           // cố mở thêm chút
    await tweenEye({ rx: 70, ry: 6, blur: 9 }, 1200);
    await tweenEye({ rx: 60, ry: 0, blur: 14 }, 600);
  }

  /* ================= VIDEO THÀNH PHỐ ================= */
  const cityL = $('#cityL'), city = $('#city'), cityBg = $('#cityBg'), bgx = cityBg.getContext('2d'), soundBtn = $('#soundBtn');
  cityBg.width = 72; cityBg.height = 128;
  let bgLoop = 0;
  function drawBg(){ if (!city.paused && !city.ended){ try { bgx.drawImage(city, 0, 0, 72, 128); } catch (e) {} } bgLoop = requestAnimationFrame(drawBg); }
  function playCity(){
    return new Promise(res => {
      document.body.classList.add('in-video'); duck(true);
      cityL.classList.add('on'); city.currentTime = 0; city.muted = false;
      const done = () => { cancelAnimationFrame(bgLoop); city.removeEventListener('ended', done); soundBtn.classList.remove('on'); document.body.classList.remove('in-video'); res(); };
      city.addEventListener('ended', done);
      city.addEventListener('error', done, { once: true });
      drawBg();
      city.play().catch(() => { city.muted = true; soundBtn.classList.add('on'); city.play().catch(done); });
      skipVideo = done;
    });
  }
  let skipVideo = null;
  soundBtn.addEventListener('click', e => { e.stopPropagation(); city.muted = false; soundBtn.classList.remove('on'); city.play().catch(() => {}); });

  /* ================= TRÌNH TỰ MỞ ĐẦU ================= */
  const mall = $('#mall'), flash = $('#flash'), stage = $('#stage'), hubEl = $('#hub'), skipBtn = $('#skip'), replay = $('#replay');
  let skipping = false, running = false;
  const tapHint = (on, txt) => { if (txt) tapEl.textContent = txt; tapEl.classList.toggle('on', on); };
  async function intro(){
    running = true; skipping = false; hubOn = false;
    stage.hidden = false; hubEl.hidden = true; hubEl.classList.remove('on'); replay.hidden = true; skipBtn.hidden = false;
    ship.classList.add('on'); cityL.classList.remove('on'); mall.classList.remove('on'); flash.classList.remove('go'); ship.classList.remove('drift');
    await openEyes(); if (skipping) return;
    tapHint(true, touch ? 'chạm vào màn hình ▼' : 'bấm vào bất kỳ đâu ▼');
    for (let i = 0; i < LINES_SHIP.length; i++){
      await waitTap(); if (skipping) return;
      tapHint(false);
      await say(LINES_SHIP[i]); if (skipping) return;
    }
    // hết 4 câu: nhắm mắt ngủ → màn hình tối → video
    await sleep(1600); if (skipping) return;
    hush(); ship.classList.remove('drift');
    await closeEyes(); if (skipping) return;
    await sleep(900); if (skipping) return;
    ship.classList.remove('on');
    eye = { rx: 220, ry: 220, blur: 0 }; setEye(eye); lids.style.opacity = '0';
    await playCity(); if (skipping) return;
    cityL.classList.remove('on'); duck(false);
    await sleep(500);
    mall.classList.add('on');
    await sleep(1800); if (skipping) return;
    tapHint(true);
    await waitTap(); if (skipping) return;
    tapHint(false);
    await say(LINE_ARRIVE); if (skipping) return;
    await sleep(1500); if (skipping) return;
    hush(); flash.classList.add('go');
    await sleep(1300); if (skipping) return;
    showHub();
  }
  function stopIntro(){
    skipping = true; hush(); tapHint(false); tapWaiter = null;
    if (skipVideo){ city.pause(); skipVideo(); skipVideo = null; }
    duck(false); lids.style.opacity = '0';
  }
  skipBtn.addEventListener('click', e => { e.stopPropagation(); stopIntro(); showHub(); });
  replay.addEventListener('click', () => { lids.style.opacity = '1'; history.replaceState(null, '', location.pathname); intro(); });

  /* ================= SẢNH 6 CỬA (vẽ phối cảnh, thảm đỏ, tường đèn nháy) ================= */
  const hc = $('#hubCv'), hx = hc.getContext('2d'), doorsEl = $('#doors');
  let HW = 0, HH = 0, HF = 1, HCY = 0, hubOn = false, opening = null, hoverDoor = -1;
  const CAM = { x: 0, y: 1.6, z: 2.6 };
  const RW = 3.1, RH = 3.6, ZB = -12;   // nửa bề ngang hành lang, trần, tường cuối
  // cửa: 2 bên trái, 2 bên phải, 2 ở tường cuối
  const DPOS = [
    { side: -1, z: -3.2 }, { side: 1, z: -3.2 },
    { side: -1, z: -7.4 }, { side: 1, z: -7.4 },
    { back: true, x: -1.15 }, { back: true, x: 1.15 },
  ];
  const DW = 1.25, DH = 2.5;
  function P(x, y, z){ const dz = CAM.z - z; if (dz < .05) return null; return [HW / 2 + HF * (x - CAM.x) / dz, HCY - HF * (y - CAM.y) / dz, dz]; }
  function hubResize(){
    const dpr = Math.min(devicePixelRatio || 1, 1.5);
    const hin = $('#hubIn'); HW = hin.clientWidth || innerWidth; HH = hin.clientHeight || innerHeight; hc.width = Math.round(HW * dpr); hc.height = Math.round(HH * dpr); hx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // điện thoại dọc: sảnh rộng hơn màn hình, vuốt ngang để nhìn quanh
    HF = Math.min(HH * 1.05, HW * .7);
    HCY = HH * (innerWidth / innerHeight < 1 ? .5 : .48);
    hubEl.scrollLeft = (hubEl.scrollWidth - hubEl.clientWidth) / 2;
    placeDoors();
  }
  function doorQuad(i, open){
    const d = DPOS[i];
    if (d.back){ const x0 = d.x - DW / 2, x1 = d.x + DW / 2; return [[x0, 0, ZB], [x1, 0, ZB], [x1, DH, ZB], [x0, DH, ZB]]; }
    const x = d.side * RW, z0 = d.z + DW / 2, z1 = d.z - DW / 2;
    return [[x, 0, z0], [x, 0, z1], [x, DH, z1], [x, DH, z0]];
  }
  function placeDoors(){
    doorsEl.querySelectorAll('.door-btn').forEach((b, i) => {
      const q = doorQuad(i).map(p => P(...p)); if (q.some(p => !p)) return;
      const xs = q.map(p => p[0]), ys = q.map(p => p[1]);
      const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
      Object.assign(b.style, { transform: `translate(${x0}px,${y0}px)`, width: (x1 - x0) + 'px', height: (y1 - y0) + 'px' });
    });
  }
  DOORS.forEach((d, i) => {
    const b = document.createElement('button'); b.className = 'door-btn'; b.setAttribute('aria-label', 'Cánh cửa số ' + (i + 1));
    b.addEventListener('pointerenter', () => { hoverDoor = i; });
    b.addEventListener('pointerleave', () => { if (hoverDoor === i) hoverDoor = -1; });
    b.addEventListener('focus', () => { hoverDoor = i; }); b.addEventListener('blur', () => { if (hoverDoor === i) hoverDoor = -1; });
    b.addEventListener('click', () => openDoor(i));
    doorsEl.appendChild(b);
  });
  function poly(pts){ hx.beginPath(); pts.forEach((p, i) => i ? hx.lineTo(p[0], p[1]) : hx.moveTo(p[0], p[1])); hx.closePath(); }
  const Q = pts => { const r = pts.map(p => P(...p)); return r.some(p => !p) ? null : r; };
  const hex2 = (h, a) => `rgba(${parseInt(h.slice(1, 3), 16)},${parseInt(h.slice(3, 5), 16)},${parseInt(h.slice(5, 7), 16)},${a})`;
  const LED = ['#ff2a6d', '#05d9e8', '#ffd23f', '#9b5cff', '#2bff88', '#ff8a00', '#ff9ce6'];
  const hashf = (a, b, c) => { const s = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return s - Math.floor(s); };
  function drawHub(now){
    if (!hubOn) return;
    requestAnimationFrame(drawHub);
    const t = now / 1000, beat = reduce ? 0 : Math.floor(now / 380);
    if (opening){ const k = clamp((now - opening.t0) / 1400, 0, 1); CAM.z = 2.6 + (opening.tz - 2.6) * k * k; CAM.x = opening.tx * k * k * .9; }
    hx.fillStyle = '#05010a'; hx.fillRect(0, 0, HW, HH);
    const NZ = Math.min(2.4, CAM.z - .25);   // mặt phẳng gần: cắt sàn/tường trước camera khi zoom vào cửa
    // trần
    let q = Q([[-RW, RH, NZ], [RW, RH, NZ], [RW, RH, ZB], [-RW, RH, ZB]]); if (q){ poly(q); hx.fillStyle = '#0a0414'; hx.fill(); }
    for (let z = 1; z > ZB; z -= 2.2){ const a = Q([[-RW + .4, RH - .01, z], [RW - .4, RH - .01, z]]); if (a){ hx.strokeStyle = 'rgba(255,240,255,.55)'; hx.lineWidth = 3; hx.beginPath(); hx.moveTo(a[0][0], a[0][1]); hx.lineTo(a[1][0], a[1][1]); hx.stroke(); } }
    // tường hai bên: lưới ô đèn LED nhấp nháy liên tục
    [-1, 1].forEach(sd => {
      const x = sd * RW;
      const w = Q([[x, 0, NZ], [x, RH, NZ], [x, RH, ZB], [x, 0, ZB]]); if (w){ poly(w); hx.fillStyle = '#0d0618'; hx.fill(); }
      for (let zi = 0; zi < 30; zi++) for (let yi = 0; yi < 7; yi++){
        const z0 = 2.2 - zi * .48, y0 = .35 + yi * .46;
        if (z0 - .42 < ZB || z0 > NZ) continue;
        const di = DPOS.findIndex(d => !d.back && d.side === sd && Math.abs(d.z - (z0 - .21)) < DW / 2 + .25 && y0 < DH + .2);
        if (di >= 0) continue;
        const c = Q([[x, y0, z0], [x, y0 + .4, z0], [x, y0 + .4, z0 - .42], [x, y0, z0 - .42]]); if (!c) continue;
        const h = hashf(zi, yi + sd * 9, Math.floor(beat / 2)), wave = Math.sin(t * 3 - zi * .5 + yi * .3 + sd);
        const col = LED[Math.floor(hashf(zi, yi, sd + Math.floor(beat / 6)) * LED.length)];
        const a = (h > .55 ? .85 : .12) * (.6 + .4 * wave);
        poly(c); hx.fillStyle = hex2(col, Math.max(.06, a)); hx.fill();
      }
      // dải neon chạy dọc mép tường
      [[.06, '#ff2a6d'], [RH - .06, '#05d9e8']].forEach(([y, col]) => { const l = Q([[x, y, NZ], [x, y, ZB]]); if (!l) return; hx.lineCap = 'round'; [[14, .15], [5, .45], [2, 1]].forEach(([lw, al]) => { hx.strokeStyle = al === 1 ? '#fff' : hex2(col, al); hx.lineWidth = lw; hx.beginPath(); hx.moveTo(l[0][0], l[0][1]); hx.lineTo(l[1][0], l[1][1]); hx.stroke(); }); });
    });
    // tường cuối
    q = Q([[-RW, 0, ZB], [RW, 0, ZB], [RW, RH, ZB], [-RW, RH, ZB]]);
    if (q){ poly(q); const g = hx.createLinearGradient(0, q[2][1], 0, q[0][1]); g.addColorStop(0, '#140726'); g.addColorStop(1, '#2a0a2e'); hx.fillStyle = g; hx.fill();
      for (let xi = 0; xi < 12; xi++) for (let yi = 0; yi < 7; yi++){ const x0 = -RW + .1 + xi * .5, y0 = .35 + yi * .46; if (Math.abs(x0 + .2) < 2.0 && y0 < DH + .25) continue; const c = Q([[x0, y0, ZB + .01], [x0 + .44, y0, ZB + .01], [x0 + .44, y0 + .4, ZB + .01], [x0, y0 + .4, ZB + .01]]); if (!c) continue; const col = LED[(xi + yi + Math.floor(beat / 3)) % LED.length]; poly(c); hx.fillStyle = hex2(col, hashf(xi, yi, beat) > .5 ? .75 : .1); hx.fill(); } }
    // sàn tối + thảm đỏ chạy giữa
    q = Q([[-RW, 0, NZ], [RW, 0, NZ], [RW, 0, ZB], [-RW, 0, ZB]]); if (q){ poly(q); hx.fillStyle = '#120a10'; hx.fill(); }
    q = Q([[-RW + .15, 0, NZ], [RW - .15, 0, NZ], [RW - .15, 0, ZB], [-RW + .15, 0, ZB]]);
    if (q){ poly(q); const g = hx.createLinearGradient(0, q[2][1], 0, HH); g.addColorStop(0, '#4a0610'); g.addColorStop(1, '#9a0f22'); hx.fillStyle = g; hx.fill(); }
    for (let z = 2.2; z > ZB; z -= .55){ const a = Q([[-RW + .2, 0, z], [RW - .2, 0, z]]); if (a){ hx.strokeStyle = 'rgba(0,0,0,.18)'; hx.lineWidth = 1; hx.beginPath(); hx.moveTo(a[0][0], a[0][1]); hx.lineTo(a[1][0], a[1][1]); hx.stroke(); } }
    for (let z = 1.6; z > ZB + .5; z -= 1.1) [-1, 1].forEach(s => { const c = Q([[s * 1.6 - .12, 0, z], [s * 1.6, 0, z - .14], [s * 1.6 + .12, 0, z], [s * 1.6, 0, z + .14]]); if (c){ poly(c); hx.fillStyle = 'rgba(255,200,90,.35)'; hx.fill(); } });
    [-1, 1].forEach(s => { const a = Q([[s * (RW - .3), 0, NZ], [s * (RW - .3), 0, ZB]]); if (a){ hx.strokeStyle = '#d9a441'; hx.lineWidth = 3; hx.beginPath(); hx.moveTo(a[0][0], a[0][1]); hx.lineTo(a[1][0], a[1][1]); hx.stroke(); } });
    // cửa: xa vẽ trước, gần vẽ sau
    const order = DOORS.map((d, i) => i).sort((a, b) => (DPOS[a].back ? ZB : DPOS[a].z) - (DPOS[b].back ? ZB : DPOS[b].z));
    order.forEach(i => drawDoor(i, t));
  }
  function drawDoor(i, t){
    const d = DOORS[i], pos = DPOS[i], c = Q(doorQuad(i)); if (!c) return;
    const hov = hoverDoor === i, open = opening && opening.i === i ? clamp((performance.now() - opening.t0) / 700, 0, 1) : 0;
    // khung phát sáng màu cửa
    const pulse = .55 + .45 * Math.sin(t * 2.4 + i);
    hx.save();
    hx.shadowColor = d.col; hx.shadowBlur = (hov ? 34 : 18) * (1 + pulse * .4);
    poly(c); hx.strokeStyle = d.col; hx.lineWidth = Math.max(3, (c[0][2] ? 40 / c[0][2] : 4)); hx.stroke();
    hx.restore();
    // lòng cửa: phía sau là ánh sáng của phòng
    poly(c); hx.fillStyle = hex2(d.col, .9); hx.fill();
    // cánh cửa (hé ra khi rê chuột, mở toang khi bấm)
    const swing = Math.max(hov ? .12 : 0, open);
    const [bl, br, tr, tl] = c;
    const k = 1 - swing * .85;
    const lerp = (a, b, s) => [a[0] + (b[0] - a[0]) * s, a[1] + (b[1] - a[1]) * s];
    const fbr = lerp(bl, br, k), ftr = lerp(tl, tr, k);
    hx.beginPath(); hx.moveTo(bl[0], bl[1]); hx.lineTo(fbr[0], fbr[1] + swing * 6); hx.lineTo(ftr[0], ftr[1] - swing * 6); hx.lineTo(tl[0], tl[1]); hx.closePath();
    const g = hx.createLinearGradient(bl[0], 0, fbr[0], 0); g.addColorStop(0, shade(d.col, -.45)); g.addColorStop(.5, shade(d.col, -.2)); g.addColorStop(1, shade(d.col, -.55));
    hx.fillStyle = g; hx.fill();
    // ô trang trí trên cánh (không chữ, không ký hiệu)
    const inset = (u0, v0, u1, v1) => { const p = (u, v) => { const a = lerp(bl, fbr, u), b = lerp(tl, ftr, u); return [a[0] + (b[0] - a[0]) * v, a[1] + (b[1] - a[1]) * v]; }; const pts = [p(u0, v0), p(u1, v0), p(u1, v1), p(u0, v1)]; hx.beginPath(); pts.forEach((q, j) => j ? hx.lineTo(q[0], q[1]) : hx.moveTo(q[0], q[1])); hx.closePath(); };
    inset(.16, .1, .84, .44); hx.strokeStyle = hex2('#ffffff', .25); hx.lineWidth = 2; hx.stroke();
    inset(.16, .54, .84, .9); hx.stroke();
    inset(.08, .04, .2, .96); hx.fillStyle = 'rgba(255,255,255,.08)'; hx.fill();
    // tay nắm
    const hp = (() => { const a = lerp(bl, fbr, .84), b = lerp(tl, ftr, .84); return [a[0] + (b[0] - a[0]) * .46, a[1] + (b[1] - a[1]) * .46]; })();
    hx.fillStyle = '#ffe58a'; hx.beginPath(); hx.arc(hp[0], hp[1], Math.max(2, 26 / c[0][2]), 0, 7); hx.fill();
    // vệt sáng lọt dưới khe cửa xuống thảm
    const gR = 220 / c[0][2] * 4;
    hx.save(); hx.translate((bl[0] + br[0]) / 2, (bl[1] + br[1]) / 2); hx.scale(1, .42);
    const glow = hx.createRadialGradient(0, 0, 2, 0, 0, gR);
    glow.addColorStop(0, hex2(d.col, .55 + .3 * pulse)); glow.addColorStop(1, hex2(d.col, 0));
    hx.fillStyle = glow; hx.beginPath(); hx.arc(0, 0, gR, 0, 7); hx.fill(); hx.restore();
  }
  function shade(hex, k){ const n = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)); return '#' + n.map(v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k).toString(16).padStart(2, '0')).join(''); }
  function openDoor(i){
    if (opening) return;
    const pos = DPOS[i];
    const tz = pos.back ? ZB + 1.3 : pos.z + 1.1, tx = pos.back ? pos.x : pos.side * RW * .55;
    opening = { i, t0: performance.now(), tz, tx };
    hubEl.scrollTo({ left: (hubEl.scrollWidth - hubEl.clientWidth) / 2, behavior: reduce ? 'auto' : 'smooth' });
    $('#hubSub').textContent = '…';
    setTimeout(() => { const f = $('#fade'); f.style.background = DOORS[i].col; f.classList.add('on'); }, 900);
    setTimeout(() => { location.href = DOORS[i].href; }, 1600);
  }
  function showHub(){
    running = false;
    stage.hidden = true; tapHint(false); hush(); skipBtn.hidden = true; replay.hidden = false; duck(false);
    hubEl.hidden = false; requestAnimationFrame(() => hubEl.classList.add('on'));
    if (!hubOn){ hubOn = true; hubResize(); requestAnimationFrame(drawHub); }
    $('#hubSub').textContent = hubEl.scrollWidth > innerWidth + 4 ? 'vuốt ngang để nhìn quanh · chạm vào một cánh cửa' : touch ? 'chạm vào một cánh cửa' : 'chọn một cánh cửa';
  }
  addEventListener('resize', () => { if (hubOn) hubResize(); });
  // quay lại từ trong phòng: vào thẳng sảnh
  addEventListener('pageshow', e => { if (e.persisted){ opening = null; CAM.z = 2.6; CAM.x = 0; $('#fade').classList.remove('on'); } });

  window.__wired = { intro, showHub, stopIntro, openDoor, get running(){ return running; } };
  if (/[?&]hub\b/.test(location.search)){ lids.style.opacity = '0'; showHub(); }
  else intro();
})();
</script>
</body>
