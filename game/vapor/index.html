<script>
(() => {
  /* ======= LINK TRONG PHÒNG (thứ tự = data-i của đồ vật) ======= */
  const LINKS = [

    { n: 'Falling Falling', d: 'Rơi mãi rơi mãi trong âm thanh và màu sắc', u: 'https://fallingfalling.com/' },

  ];
  /* ============================================================= */

  let seed = 23; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const L = (i, x, y, s, inner) => `<g transform="translate(${x} ${y}) scale(${s})"><a class="lk" data-i="${i}"><g>${inner}</g></a></g>`;
  const HZ = 520; // đường chân trời
  // cửa sổ kiểu Windows 95
  const win = (w, h, title, body) => `<rect x="${-w / 2 + 6}" y="${-h + 6}" width="${w}" height="${h}" fill="#ff71ce" opacity=".7"/><rect x="${-w / 2}" y="${-h}" width="${w}" height="${h}" fill="#c0c0c0"/><path d="M${-w / 2} 0V${-h}H${w / 2}" stroke="#fff" stroke-width="2" fill="none"/><path d="M${-w / 2} 0H${w / 2}V${-h}" stroke="#404040" stroke-width="2" fill="none"/><rect x="${-w / 2 + 4}" y="${-h + 4}" width="${w - 8}" height="20" fill="url(#tbar)"/><text x="${-w / 2 + 10}" y="${-h + 19}" font-family="Tahoma,Verdana,sans-serif" font-weight="700" font-size="13" fill="#fff">${title}</text>${[0, 1, 2].map(k => `<rect x="${w / 2 - 22 - k * 19}" y="${-h + 7}" width="16" height="14" fill="#c0c0c0" stroke="#404040"/>`).join('')}<path d="M${w / 2 - 18} ${-h + 11}l8 7m0 -7l-8 7" stroke="#000" stroke-width="2"/><g transform="translate(${-w / 2 + 6} ${-h + 28})">${body}</g>`;

  let svg = `<defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12002e"/><stop offset=".45" stop-color="#5a1a8a"/><stop offset=".8" stop-color="#ff5fb0"/><stop offset="1" stop-color="#ffb86b"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffb96"/><stop offset=".5" stop-color="#ffb347"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
    <linearGradient id="grd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a0050"/><stop offset="1" stop-color="#0c0018"/></linearGradient>
    <linearGradient id="tbar" x1="0" x2="1"><stop offset="0" stop-color="#000080"/><stop offset="1" stop-color="#1084d0"/></linearGradient>
    <linearGradient id="marble" x1="0" x2="1"><stop offset="0" stop-color="#d9c8e8"/><stop offset=".45" stop-color="#fff"/><stop offset="1" stop-color="#bba6d6"/></linearGradient>
    <linearGradient id="dol" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#01cdfe"/><stop offset="1" stop-color="#b967ff"/></linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5"><stop offset=".5" stop-color="#ff71ce" stop-opacity=".55"/><stop offset="1" stop-color="#ff71ce" stop-opacity="0"/></radialGradient>
    <mask id="sunMask"><rect x="560" y="160" width="480" height="${HZ - 160}" fill="#fff"/>${[[400, 5], [430, 8], [456, 11], [480, 14], [502, 17]].map(([y, h]) => `<rect x="560" y="${y}" width="480" height="${h}" fill="#000"/>`).join('')}</mask>
    <pattern id="chk" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#fff"/><rect width="8" height="8" fill="#000"/><rect x="8" y="8" width="8" height="8" fill="#000"/></pattern>
    <clipPath id="crt"><rect x="-56" y="-118" width="112" height="84" rx="12"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>`;
  for (let k = 0; k < 90; k++) svg += `<circle cx="${(rnd() * 1600).toFixed(0)}" cy="${(rnd() * 300).toFixed(0)}" r="${(.6 + rnd() * 1.2).toFixed(1)}" fill="#fff" opacity="${(.3 + rnd() * .6).toFixed(2)}"/>`;
  // mặt trời sọc
  svg += `<circle cx="800" cy="380" r="300" fill="url(#sunGlow)"/><circle cx="800" cy="380" r="220" fill="url(#sun)" mask="url(#sunMask)"/>`;
  // núi lưới hai bên chân trời
  const mtn = pts => { let d = `M${pts[0][0]} ${HZ}`; pts.forEach(([x, y]) => d += `L${x} ${y}`); d += `L${pts[pts.length - 1][0]} ${HZ}Z`; return d; };
  [[[0, 410], [90, 360], [180, 420], [280, 330], [380, 430], [470, 390], [580, HZ]], [[1020, HZ], [1120, 400], [1220, 440], [1330, 340], [1420, 410], [1510, 370], [1600, 420]]].forEach(pts => {
    svg += `<path d="${mtn(pts)}" fill="#2a0a5a" stroke="#ff71ce" stroke-width="2"/>`;
    for (let k = 1; k < 4; k++) svg += `<path d="M${pts[0][0]} ${HZ - k * 22}${pts.map(([x, y]) => `L${x} ${Math.max(y, HZ - k * 22) + (HZ - Math.max(y, HZ - k * 22)) * 0}`).join('')}" stroke="#ff71ce" stroke-opacity=".0" fill="none"/>`;
    pts.forEach(([x, y]) => { svg += `<path d="M${x} ${y}L${x + (800 - x) * .08} ${HZ}" stroke="#ff71ce" stroke-opacity=".45"/>`; });
  });
  // sàn lưới neon (đường dọc; đường ngang chạy trong canvas)
  svg += `<rect x="0" y="${HZ}" width="1600" height="${900 - HZ}" fill="url(#grd)"/><path d="M0 ${HZ}H1600" stroke="#ff71ce" stroke-width="3"/>`;
  for (let k = -14; k <= 14; k++) svg += `<path d="M${800 + k * 30} ${HZ}L${800 + k * 210} 900" stroke="#ff2bd6" stroke-width="2" stroke-opacity=".7"/>`;
  svg += `<path d="M560 ${HZ + 2}H1040" stroke="#fffb96" stroke-width="2" opacity=".5"/><ellipse cx="800" cy="${HZ + 30}" rx="230" ry="18" fill="#ffb347" opacity=".18"/>`;
  // cây cọ (trang trí)
  const palm = (x, y, h, flip) => { const f = flip ? -1 : 1; let s = `<path d="M${x} ${y}Q${x + f * 30} ${y - h * .5} ${x + f * 10} ${y - h}" stroke="#14002a" stroke-width="16" fill="none" stroke-linecap="round"/><path d="M${x} ${y}Q${x + f * 30} ${y - h * .5} ${x + f * 10} ${y - h}" stroke="#ff71ce" stroke-width="2" fill="none" stroke-dasharray="3 14" opacity=".7"/>`; const tx = x + f * 10, ty = y - h; [-160, -120, -70, -30, 10, 50].forEach(a => { const r = a * Math.PI / 180, ex = tx + Math.cos(r) * 120, ey = ty + Math.sin(r) * 60 + 40; s += `<path d="M${tx} ${ty}Q${(tx + ex) / 2 + Math.cos(r - 1) * 20} ${ty + Math.sin(r) * 60 - 26} ${ex.toFixed(0)} ${ey.toFixed(0)}" stroke="#14002a" stroke-width="12" fill="none" stroke-linecap="round"/>`; }); return s; };
  svg += palm(230, 640, 340, false) + palm(1380, 640, 330, true);
  // cột Hy Lạp hai bên
  const column = x => `<g><rect x="${x - 38}" y="270" width="76" height="630" fill="url(#marble)"/>${[-24, -8, 8, 24].map(d => `<path d="M${x + d} 300V880" stroke="#bba6d6" stroke-width="3"/>`).join('')}<rect x="${x - 54}" y="248" width="108" height="24" fill="url(#marble)"/><circle cx="${x - 46}" cy="262" r="14" fill="#efe4f6" stroke="#bba6d6" stroke-width="2"/><circle cx="${x + 46}" cy="262" r="14" fill="#efe4f6" stroke="#bba6d6" stroke-width="2"/><rect x="${x - 50}" y="232" width="100" height="16" fill="#fff"/><rect x="${x - 54}" y="870" width="108" height="30" fill="#bba6d6"/></g>`;
  svg += column(40) + column(1560);

  /* ---------- ĐỒ VẬT CÓ LINK ---------- */
  // 7 — tượng bán thân cẩm thạch đeo kính
  svg += L(7, 40, 232, 1, `<path d="M-60 0Q-60 -46 -24 -54H24Q60 -46 60 0Z" fill="url(#marble)"/><rect x="-14" y="-74" width="28" height="24" fill="#e8dcf2"/><ellipse cy="-110" rx="34" ry="42" fill="url(#marble)"/>${[[-30, -130], [-18, -146], [0, -152], [18, -146], [30, -130], [-34, -110], [34, -110]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="11" fill="#efe4f6" stroke="#bba6d6"/>`).join('')}<rect x="-30" y="-118" width="26" height="12" fill="#000"/><rect x="4" y="-118" width="26" height="12" fill="#000"/><path d="M-4 -114H4" stroke="#000" stroke-width="3"/><rect x="-26" y="-116" width="8" height="3" fill="#01cdfe"/><rect x="8" y="-116" width="8" height="3" fill="#01cdfe"/><path d="M-8 -84Q0 -80 8 -84" stroke="#bba6d6" stroke-width="2" fill="none"/>`);
  // 25 — cú mèo trên đỉnh cột phải
  svg += L(25, 1560, 232, 1, `<ellipse cy="-46" rx="38" ry="46" fill="#b967ff"/><ellipse cy="-36" rx="24" ry="30" fill="#e3c6ff"/><path d="M-30 -80-36 -104-14 -88ZM30 -80 36 -104 14 -88Z" fill="#b967ff"/><circle cx="-14" cy="-66" r="13" fill="#fffb96"/><circle cx="14" cy="-66" r="13" fill="#fffb96"/><circle class="blink" cx="-14" cy="-66" r="6" fill="#000"/><circle class="blink" cx="14" cy="-66" r="6" fill="#000"/><path d="M-5 -54 0 -46 5 -54Z" fill="#ffb347"/><text x="-96" y="-84" font-family="VT323" font-size="26" fill="#fffb96" transform="rotate(-10)" text-anchor="end">hoooo</text>`);
  // 4 — đĩa chấm tròn (koala)
  svg += L(4, 200, 400, 1, `<g class="bob c">${(() => { let s = ''; const cols = ['#ff71ce', '#01cdfe', '#05ffa1', '#b967ff', '#fffb96']; [[-34, -34], [34, -34], [-34, 34], [34, 34]].forEach(([qx, qy], q) => { if (q === 3){ [[-17, -17], [17, -17], [-17, 17], [17, 17]].forEach(([a, b], k) => s += `<circle cx="${qx + a}" cy="${qy + b - 70}" r="16" fill="${cols[(q + k) % 5]}"/>`); } else s += `<circle cx="${qx}" cy="${qy - 70}" r="33" fill="${cols[q]}"/>`; }); return s; })()}</g>`);
  // 9 — cửa sổ windows93
  svg += L(9, 330, 230, 1, `<g class="bob">${win(250, 160, 'windows93.exe', `<rect width="238" height="126" fill="#008080"/>${[[16, 12], [16, 62], [76, 12], [76, 62]].map(([x, y], k) => `<rect x="${x}" y="${y}" width="28" height="24" fill="${['#fffb96', '#ff71ce', '#fff', '#05ffa1'][k]}" stroke="#000"/><rect x="${x - 6}" y="${y + 28}" width="40" height="8" fill="#000080"/>`).join('')}<circle cx="180" cy="60" r="30" fill="#ff71ce"/><path d="M168 52h6m12 0h6M166 70q14 12 28 0" stroke="#000" stroke-width="3" fill="none"/>`)}</g>`);
  // 2 — con trỏ chuột khổng lồ
  svg += L(2, 600, 330, 1, `<g class="bob b" transform="rotate(-12)"><path d="M0 -120V-6L28 -32 46 8 64 0 46 -40H84Z" fill="#fff" stroke="#000" stroke-width="5" stroke-linejoin="round"/></g>`);
