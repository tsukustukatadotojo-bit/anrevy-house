<script>
(() => {
  /* ======= LINK TRONG PHÒNG (thứ tự = data-i của đồ vật) ======= */
  const LINKS = [
    { n: 'Hacker Typer', d: 'Gõ bừa phím nào cũng thành hacker như trong phim', u: 'https://hackertyper.net/' },
    { n: 'GeekTyper', d: 'Giả lập màn hình hacker đủ kiểu', u: 'https://geektyper.com/' },
    { n: 'Bitburner', d: 'Game lập trình: làm hacker trong thành phố cyberpunk', u: 'https://bitburner-official.github.io/' },
    { n: 'Untrusted', d: 'Sửa code JavaScript để thoát khỏi mê cung', u: 'https://untrustedgame.com/' },
    { n: 'Flexbox Froggy', d: 'Đưa ếch về lá sen bằng CSS', u: 'https://flexboxfroggy.com/' },
    { n: 'CSS Diner', d: 'Gọi món bằng CSS selector', u: 'https://flukeout.github.io/' },
    { n: 'Grid Garden', d: 'Tưới vườn cà rốt bằng CSS Grid', u: 'https://cssgridgarden.com/' },
    { n: 'Monkeytype', d: 'Đo tốc độ gõ phím, giao diện tối giản', u: 'https://monkeytype.com/' },
    { n: 'TypeRacer', d: 'Đua xe bằng tốc độ gõ phím với người khắp nơi', u: 'https://play.typeracer.com/' },
    { n: 'TETR.IO', d: 'Xếp gạch online phong cách neon', u: 'https://tetr.io/' },
    { n: 'slither.io', d: 'Rắn neon săn mồi cùng cả thế giới', u: 'https://slither.io/' },
    { n: 'powerline.io', d: 'Rắn ánh sáng kiểu Tron, cắt đường đối thủ', u: 'https://powerline.io/' },
    { n: 'Neonflames', d: 'Vẽ lửa neon rực rỡ bằng chuột', u: 'https://29a.ch/sandbox/2011/neonflames/' },
    { n: 'Silk', d: 'Vẽ những dải lụa phát sáng đối xứng', u: 'http://weavesilk.com/' },
    { n: 'Nightride FM', d: 'Radio synthwave phát 24/7', u: 'https://nightride.fm/' },
    { n: 'Rainy Mood', d: 'Tiếng mưa đêm để thư giãn', u: 'https://rainymood.com/' },
    { n: 'This Person Does Not Exist', d: 'Gương mặt do AI vẽ, người này không có thật', u: 'https://thispersondoesnotexist.com/' },
    { n: 'Quick, Draw!', d: 'Vẽ thật nhanh, AI đoán xem bạn vẽ gì', u: 'https://quickdraw.withgoogle.com/' },
    { n: 'Neural Network Playground', d: 'Nghịch một mạng nơ-ron ngay trên web', u: 'https://playground.tensorflow.org/' },
    { n: 'Wired Sound for Wired People', d: 'Trang fan Serial Experiments Lain — The Wired', u: 'https://fauux.neocities.org/' },
    { n: 'Neocities', d: 'Tự làm trang web cá nhân kiểu Internet ngày xưa', u: 'https://neocities.org/' },
    { n: 'Human Benchmark', d: 'Đo phản xạ, trí nhớ, độ nhanh tay', u: 'https://humanbenchmark.com/' },
    { n: 'Incredibox', d: 'Kéo thả biểu tượng để làm ban nhạc beatbox', u: 'https://www.incredibox.com/' },
    { n: 'Bruno Simon', d: 'Lái chiếc xe nhỏ đi khắp thế giới 3D', u: 'https://bruno-simon.com/' },
  ];
  /* ============================================================= */

  // số ngẫu nhiên cố định để thành phố lần nào cũng giống nhau
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const neon = (d, c, w = 4) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w * 4}" stroke-opacity=".15" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="${w * 1.8}" stroke-opacity=".45" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#fff" stroke-width="${w * .7}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const ntext = (t, x, y, size, c, cls = 'jp', extra = '') => `<g class="${extra}"><text x="${x}" y="${y}" font-size="${size}" class="${cls}" fill="${c}" opacity=".35" stroke="${c}" stroke-width="${size * .16}" text-anchor="middle">${t}</text><text x="${x}" y="${y}" font-size="${size}" class="${cls}" fill="#fff" stroke="${c}" stroke-width="${size * .04}" text-anchor="middle">${t}</text></g>`;
  const L = (i, x, y, s, inner) => `<g transform="translate(${x} ${y}) scale(${s})"><a class="lk" data-i="${i}"><g class="pv">${inner}</g></a></g>`;

  let svg = `<defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05010d"/><stop offset=".55" stop-color="#1a0630"/><stop offset="1" stop-color="#4a0c4a"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0a26"/><stop offset="1" stop-color="#05020a"/></linearGradient>
    <linearGradient id="wallL" x1="0" x2="1"><stop offset="0" stop-color="#0d0618"/><stop offset="1" stop-color="#1c0b2c"/></linearGradient>
    <linearGradient id="wallR" x1="1" x2="0"><stop offset="0" stop-color="#0d0618"/><stop offset="1" stop-color="#1c0b2c"/></linearGradient>
    <radialGradient id="haze" cx=".5" cy=".62" r=".5"><stop offset="0" stop-color="#ff2a6d" stop-opacity=".45"/><stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/></radialGradient>
    <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="winClip"><rect x="-58" y="-150" width="116" height="140" rx="4"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="560" rx="760" ry="300" fill="url(#haze)"/>`;
  // nhà chọc trời phía xa (2 lớp) có cửa sổ sáng + đèn đỏ trên nóc
  [[.55, '#140828', 300, 470], [.8, '#1d0c36', 360, 520]].forEach(([k, col, top, base]) => {
    let x = 380;
    while (x < 1240){
      const w = 34 + rnd() * 70, h = (base - top) * (.45 + rnd() * .75); const y = base - h;
      svg += `<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="${w.toFixed(0)}" height="${(h + 80).toFixed(0)}" fill="${col}"/>`;
      for (let wy = y + 8; wy < base; wy += 9) for (let wx = x + 5; wx < x + w - 5; wx += 8) if (rnd() < .22 * k) svg += `<rect x="${wx.toFixed(0)}" y="${wy.toFixed(0)}" width="3" height="4" fill="${['#05d9e8', '#ff71ce', '#ffd23f', '#9b5cff'][Math.floor(rnd() * 4)]}" opacity="${(.4 + rnd() * .5).toFixed(2)}"/>`;
      if (rnd() < .5) svg += `<path d="M${(x + w / 2).toFixed(0)} ${y.toFixed(0)}v-${(10 + rnd() * 30).toFixed(0)}" stroke="${col}" stroke-width="3"/><circle class="led ${rnd() < .5 ? 'b' : ''}" cx="${(x + w / 2).toFixed(0)}" cy="${(y - 6).toFixed(0)}" r="3" fill="#ff3040"/>`;
      x += w + 4 + rnd() * 10;
    }
  });
  // mặt đường ướt phản chiếu đèn
  svg += `<path d="M0 900L640 520H960L1600 900Z" fill="url(#road)"/>
  <g opacity=".5">${[[-1, 590], [1, 1010]].map(([d, x]) => `<path d="M${x} 520 ${x + d * 260} 900" stroke="#ffd23f" stroke-width="3" stroke-dasharray="26 30" opacity=".5"/>`).join('')}<path d="M800 520V900" stroke="#fff" stroke-width="4" stroke-dasharray="30 40" opacity=".35"/></g>
  <g opacity=".55" filter="url(#soft)">${[[250, '#ff2a6d'], [430, '#05d9e8'], [690, '#ffd23f'], [1160, '#9b5cff'], [1330, '#05d9e8'], [1470, '#ff71ce']].map(([x, c]) => `<rect x="${x - 18}" y="640" width="36" height="260" fill="${c}"/>`).join('')}</g>`;
  // 2 dãy nhà hai bên hẻm
  svg += `<path d="M0 0H560V560L640 520V900H0Z" fill="url(#wallL)"/><path d="M1600 0H1040V560L960 520V900H1600Z" fill="url(#wallR)"/>
  <path d="M560 0V560" stroke="#2a1440" stroke-width="6"/><path d="M1040 0V560" stroke="#2a1440" stroke-width="6"/>`;
  for (let y = 40; y < 520; y += 70) for (let x = 30; x < 540; x += 90) if (rnd() < .55) svg += `<rect x="${x}" y="${y}" width="56" height="40" fill="#120822" stroke="#24123a"/><rect x="${x + 4}" y="${y + 4}" width="48" height="32" fill="${rnd() < .4 ? '#2a1a40' : '#0a0512'}"/>`;
  for (let y = 40; y < 520; y += 70) for (let x = 1070; x < 1580; x += 90) if (rnd() < .55) svg += `<rect x="${x}" y="${y}" width="56" height="40" fill="#120822" stroke="#24123a"/><rect x="${x + 4}" y="${y + 4}" width="48" height="32" fill="${rnd() < .4 ? '#2a1a40' : '#0a0512'}"/>`;
  // cục nóng điều hoà + ống + cầu thang thoát hiểm
  [[40, 470], [470, 120], [1500, 470], [1080, 120], [1450, 120]].forEach(([x, y]) => { svg += `<rect x="${x}" y="${y}" width="58" height="40" rx="3" fill="#2a2238"/><circle class="spin" cx="${x + 20}" cy="${y + 20}" r="13" fill="none" stroke="#5a4a70" stroke-width="3" stroke-dasharray="6 5"/><rect x="${x + 40}" y="${y + 8}" width="12" height="24" fill="#1a1426"/>`; });
  svg += `<g stroke="#3a2a50" stroke-width="3" fill="none"><path d="M1060 300H1240M1060 380H1240M1080 300V380M1220 300V380"/>${[0, 1, 2, 3, 4, 5].map(k => `<path d="M${1080 + k * 28} 300v80"/>`).join('')}</g>`;
  // dây điện + đèn lồng giăng ngang hẻm
  svg += `<g fill="none" stroke="#120a1c" stroke-width="2.5"><path d="M560 120Q800 200 1040 110"/><path d="M560 230Q800 300 1040 220"/><path d="M560 60Q820 130 1040 40"/></g>`;
  [[620, 150, '#ff2a6d'], [690, 170, '#ffd23f'], [760, 181, '#ff2a6d'], [840, 180, '#ffd23f'], [910, 168, '#ff2a6d'], [980, 140, '#ffd23f'], [640, 262, '#05d9e8'], [740, 280, '#ff71ce'], [860, 280, '#05d9e8'], [960, 258, '#ff71ce']].forEach(([x, y, c], i) => {
    svg += `<path d="M${x} ${y - 14}v8" stroke="#120a1c" stroke-width="2"/><ellipse class="flk ${'abc'[i % 3]}" cx="${x}" cy="${y + 6}" rx="13" ry="16" fill="${c}" opacity=".9"/><ellipse cx="${x}" cy="${y + 6}" rx="26" ry="28" fill="${c}" opacity=".12"/><rect x="${x - 6}" y="${y - 12}" width="12" height="4" fill="#2a1a10"/>`;
  });

  /* ---------- ĐỒ VẬT CÓ LINK ---------- */
  // 19 — biển neon dọc "電脳"
  svg += L(19, 110, 380, 1, `<rect x="-38" y="-250" width="76" height="250" rx="6" fill="#12051e" stroke="#ff2a6d" stroke-width="3"/>${ntext('電', 0, -170, 58, '#ff2a6d', 'jp', 'flk')}${ntext('脳', 0, -95, 58, '#ff2a6d', 'jp', 'flk b')}<circle class="led" cx="0" cy="-30" r="6" fill="#05d9e8"/>`);
  // 15 — ô cửa sổ có mưa
  svg += L(15, 300, 300, 1, `<rect x="-62" y="-154" width="124" height="148" rx="6" fill="#1a1028" stroke="#3a2a50" stroke-width="4"/><g clip-path="url(#winClip)"><rect x="-58" y="-150" width="116" height="140" fill="#0c1430"/><circle cx="20" cy="-110" r="26" fill="#ffd23f" opacity=".25"/>${Array.from({ length: 14 }, (_, k) => `<path class="scroll" d="M${-54 + k * 8.5} ${-150 + (k * 37) % 60}l-6 22" stroke="#9ad7ff" stroke-width="1.6" opacity=".6"/>`).join('')}<path d="M-58 -80H58M0 -150V-10" stroke="#3a2a50" stroke-width="4"/></g><rect x="-66" y="-10" width="132" height="10" fill="#2a1a3a"/>`);
  // 4 — biển con ếch neon hồng
  svg += L(4, 440, 250, 1, `<rect x="-70" y="-120" width="140" height="120" rx="12" fill="#0e0418" stroke="#2bff88" stroke-width="2" stroke-opacity=".5"/><g class="flk c">${neon('M-40 -40Q-40 -78 0 -80Q40 -78 40 -40Q40 -20 0 -20Q-40 -20 -40 -40Z', '#2bff88', 3)}${neon('M-22 -78a9 9 0 1 1 0 .1M22 -78a9 9 0 1 1 0 .1', '#2bff88', 2.5)}${neon('M-16 -42Q0 -32 16 -42', '#ff71ce', 2.5)}</g>${ntext('蛙', 0, -2, 26, '#2bff88')}`);
  // 7 — bàn phím neon trên tường
  svg += L(7, 330, 470, 1, `<rect x="-90" y="-60" width="180" height="60" rx="8" fill="#0e0418" stroke="#05d9e8" stroke-width="3"/>${[0, 1, 2].map(r => Array.from({ length: 8 - r }, (_, k) => `<rect class="${(k + r) % 3 === 0 ? 'led' : ''} ${(k * r) % 2 ? 'b' : ''}" x="${-80 + r * 7 + k * 21}" y="${-52 + r * 17}" width="17" height="13" rx="2" fill="${(k + r) % 4 === 0 ? '#ff2a6d' : '#05d9e8'}" opacity=".85"/>`).join('')).join('')}`);
  // 5 — quầy mì ramen + bảng menu
  svg += L(5, 175, 760, 1, `<rect x="-120" y="-200" width="240" height="20" fill="#ff2a6d"/><path d="M-130 -180H130L118 -150H-118Z" fill="#c2185b"/>${[-90, -45, 0, 45, 90].map(x => `<rect x="${x - 18}" y="-150" width="36" height="46" fill="#f3e2c8" opacity=".85"/><path d="M${x - 18} -150h36" stroke="#c2185b" stroke-width="3"/>`).join('')}${ntext('ラーメン', 0, -158, 22, '#ffd23f')}<rect x="-120" y="-104" width="240" height="104" fill="#2a1420"/><rect x="-120" y="-104" width="240" height="10" fill="#5a2a30"/><g transform="translate(0 -54)"><ellipse rx="40" ry="12" fill="#fff"/><ellipse ry="9" rx="32" fill="#e8a040"/><path d="M-20 -2q10 6 20 0t20 0" stroke="#fff3c8" stroke-width="3" fill="none"/><path d="M14 -8 34 -40M20 -8 42 -36" stroke="#c9a070" stroke-width="3"/><path class="scroll" d="M-10 -14q-6 -10 0 -20t0 -20M6 -14q-6 -10 0 -20t0 -20" stroke="#fff" stroke-width="2" fill="none" opacity=".4"/></g>`);
  // 0 — laptop trên thùng gỗ
  svg += L(0, 370, 820, 1, `<rect x="-70" y="-80" width="140" height="80" fill="#3a2a1a" stroke="#1a1006" stroke-width="3"/><path d="M-70 -40H70M-70 -60H70" stroke="#2a1a0a" stroke-width="2"/><path d="M-50 -80 -60 -150H60L50 -80Z" fill="#1a1a24"/><rect x="-48" y="-146" width="96" height="60" fill="#021a08"/>${[0, 1, 2, 3, 4, 5].map(k => `<rect class="${k % 2 ? 'led' : ''}" x="-42" y="${-140 + k * 9}" width="${30 + ((k * 23) % 50)}" height="4" fill="#2bff88" opacity=".85"/>`).join('')}<rect x="-62" y="-86" width="124" height="8" rx="2" fill="#2a2a36"/>`);
  // 1 — chồng màn hình CRT chạy chữ xanh
  svg += L(1, 525, 700, 1, `${[[-40, 0, 80], [40, 0, 70], [0, -66, 74]].map(([x, y, w], k) => `<g transform="translate(${x} ${y})"><rect x="${-w / 2}" y="-66" width="${w}" height="64" rx="6" fill="#2a2a36" stroke="#141420" stroke-width="3"/><rect x="${-w / 2 + 7}" y="-58" width="${w - 14}" height="46" rx="3" fill="#031208"/>${[0, 1, 2, 3].map(r => `<rect class="${(r + k) % 2 ? 'led b' : ''}" x="${-w / 2 + 11}" y="${-53 + r * 10}" width="${(w - 26) * (.4 + ((r * 7 + k) % 5) / 8)}" height="4" fill="${k === 2 ? '#ff71ce' : '#2bff88'}"/>`).join('')}</g>`).join('')}`);
  // 6 — chậu cây neon (cà rốt phát sáng)
