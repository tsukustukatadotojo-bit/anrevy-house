<link rel="stylesheet" href="../room.css">
<style>
  :root{--bg:#cdeeff;--ink:#183a2c;--accent:#2f8f5b;--accent-soft:rgba(47,143,91,.35);--hud-bg:rgba(255,252,240,.88);--hud-ink:#1f4a36;--hud-ink-on:#fffdf2;
    --hud-font:800 14px 'Nunito',system-ui,sans-serif;--btn-r:999px;--tip-bg:#fffdf2;--tip-ink:#183a2c;--tip-font:'Fraunces',Georgia,serif;--tip-size:19px;--tip-r:16px 16px 16px 4px;
    --box-bg:linear-gradient(180deg,#fffdf2,#eef8e6);--box-ink:#183a2c;--box-r:22px;--title-font:800 26px 'Fraunces',Georgia,serif;--hint-font:800 15px 'Nunito',system-ui,sans-serif;--hint-ink:#1f4a36;--enter:#fff7d6;
    --hover-filter:drop-shadow(0 0 10px #fff7b0) drop-shadow(0 4px 10px rgba(47,143,91,.45)) brightness(1.08)}
  .hint{text-shadow:0 0 8px #fffdf2,0 0 2px #fffdf2}
  .tip{box-shadow:0 8px 24px rgba(24,58,44,.25)}
  .list-bg{background:rgba(24,58,44,.45)}
  .tv-bar button{background:rgba(47,143,91,.12)}
  .room-title{font:800 clamp(18px,2.4vw,28px) 'Fraunces',Georgia,serif;color:#1f4a36;letter-spacing:.04em;text-shadow:0 2px 0 #fffdf2,0 0 18px #fff7b0}
  .room-title span{display:block;font:800 12px 'Nunito',sans-serif;letter-spacing:.42em;color:#c9862a;text-align:center;text-transform:uppercase;text-shadow:0 0 6px #fffdf2}
  .spin{transform-box:fill-box;transform-origin:center;animation:spin 5s linear infinite}.spin.s{animation-duration:9s}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 5s ease-in-out infinite alternate}.sway.b{animation-delay:-2.5s;animation-duration:6.4s}
  @keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
  .leaf{transform-box:fill-box;transform-origin:50% 100%;animation:leaf 4s ease-in-out infinite alternate}.leaf.b{animation-delay:-2s}
  @keyframes leaf{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
  .flap{transform-box:fill-box;transform-origin:50% 50%;animation:flap .35s ease-in-out infinite alternate}
  @keyframes flap{to{transform:scaleX(.25)}}
  .flyA{animation:flyA 16s ease-in-out infinite}
  @keyframes flyA{0%,100%{transform:translate(0,0)}25%{transform:translate(70px,-40px)}50%{transform:translate(130px,10px)}75%{transform:translate(50px,30px)}}
  .ripple{transform-box:fill-box;transform-origin:center;animation:ripple 3s ease-out infinite}.ripple.b{animation-delay:-1s}.ripple.c{animation-delay:-2s}
  @keyframes ripple{from{transform:scale(.2);opacity:.9}to{transform:scale(1);opacity:0}}
  .drip{animation:drip 1.2s linear infinite}.drip.b{animation-delay:-.4s}.drip.c{animation-delay:-.8s}
  @keyframes drip{from{transform:translateY(0);opacity:1}to{transform:translateY(40px);opacity:0}}
  .jet{animation:jet 1.6s ease-in-out infinite alternate}
  @keyframes jet{to{transform:scaleY(.85)}}
  .note{animation:note 3s ease-out infinite}.note.b{animation-delay:-1.5s}
  @keyframes note{from{transform:translate(0,0);opacity:0}20%{opacity:1}to{transform:translate(26px,-40px);opacity:0}}
  .bee{animation:bee 4s ease-in-out infinite}.bee.b{animation-delay:-1.3s;animation-duration:5s}.bee.c{animation-delay:-2.6s;animation-duration:3.4s}
  @keyframes bee{0%,100%{transform:translate(0,0)}33%{transform:translate(-26px,-18px)}66%{transform:translate(20px,-30px)}}
  .tick{transform-box:fill-box;transform-origin:50% 100%;animation:tick 2.2s ease-in-out infinite alternate}
  @keyframes tick{from{transform:rotate(-14deg)}to{transform:rotate(18deg)}}
  .blink{animation:blink 1.4s steps(1) infinite}
  @keyframes blink{50%{opacity:.2}}
</style>
</head>
<body>
<div class="enter"></div>
<div class="wrap" id="wrap"><svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Nhà kính trên cao kiểu solarpunk, nhiều cây xanh, nhìn ra thành phố xanh có tua-bin gió"></svg></div>

<nav class="hud" aria-label="Điều hướng"><a href="../?hub">← SẢNH</a><a href="../../home.html" aria-label="Về Anrevy House">⌂<span class="wide"> ANREVY HOUSE</span></a><button id="listBtn" aria-haspopup="dialog" aria-label="Danh sách trò chơi">☰<span class="wide"> DANH SÁCH</span></button></nav>

<div class="list" id="list" role="dialog" aria-modal="true" aria-labelledby="listTitle"><div class="list-bg" data-close></div><div class="list-box" id="listBox"><div class="list-head"><h2 id="listTitle">Sky Garden</h2><p id="listCount"></p></div><ol></ol><button class="list-x" data-close aria-label="Đóng">✕</button></div></div>

<script>
(() => {
  /* ======= LINK TRONG PHÒNG (thứ tự = data-i của đồ vật) ======= */
  const LINKS = [
    { n: 'Sandspiel', d: 'Hộp cát: nước, lửa, cây, cát tự tương tác', u: 'https://sandspiel.club/' },
    { n: 'WebGL Water', d: 'Khuấy mặt nước 3D bằng chuột', u: 'https://madebyevan.com/webgl-water/' },
    { n: 'Orb.Farm', d: 'Nuôi một hệ sinh thái nhỏ trong quả cầu kính', u: 'https://orb.farm/' },
    { n: 'Townscaper', d: 'Bấm để xây thị trấn nhỏ xinh trên mặt biển', u: 'https://oskarstalberg.com/Townscaper/' },
    { n: 'Hidden Folks', d: 'Tìm người tí hon trốn trong tranh vẽ tay', u: 'https://hiddenfolks.com/' },
    { n: 'Supercook', d: 'Có gì trong bếp thì gợi ý món nấu được', u: 'https://supercook.com/' },
    { n: 'Planet', d: 'Tự tạo một hành tinh nhỏ có biển, núi, rừng', u: 'https://www.oskarstalberg.com/game/planet/planet.html' },
    { n: 'EZ-Tree', d: 'Tạo cây 3D theo ý mình', u: 'https://www.eztree.dev/' },
    { n: 'Explore Live Cams', d: 'Camera trực tiếp ngắm thú hoang dã khắp thế giới', u: 'https://explore.org/livecams' },
    { n: 'iNaturalist', d: 'Chụp cây, con gì cũng được nhận diện giúp', u: 'https://www.inaturalist.org/' },
    { n: 'xeno-canto', d: 'Thư viện tiếng chim hót khắp thế giới', u: 'https://xeno-canto.org/' },
    { n: 'Noisli', d: 'Trộn tiếng mưa, gió, lửa để tập trung', u: 'https://www.noisli.com/' },
    { n: 'Google Earth', d: 'Bay vòng quanh Trái Đất 3D', u: 'https://earth.google.com/web/' },
    { n: 'Electricity Maps', d: 'Điện ở mỗi nước đang sạch hay bẩn ngay lúc này', u: 'https://app.electricitymaps.com/' },
    { n: 'En-ROADS', d: 'Thử làm chính sách để cứu khí hậu', u: 'https://en-roads.climateinteractive.org/' },
    { n: 'Global Forest Watch', d: 'Bản đồ rừng thế giới đang mất đi', u: 'https://www.globalforestwatch.org/map/' },
    { n: 'WindowSwap', d: 'Nhìn qua cửa sổ nhà ai đó ở một nơi khác', u: 'https://www.window-swap.com/' },
    { n: 'OneZoom', d: 'Cây sự sống: phóng to tìm mọi loài', u: 'https://www.onezoom.org/' },
    { n: 'Earth.fm', d: 'Âm thanh thiên nhiên thu từ khắp nơi', u: 'https://earth.fm/' },
    { n: 'Windy', d: 'Bản đồ gió, mưa, bão chuyển động', u: 'https://www.windy.com/' },
    { n: 'Our World in Data', d: 'Thế giới qua những biểu đồ dễ hiểu', u: 'https://ourworldindata.org/' },
    { n: 'A Soft Murmur', d: 'Tiếng mưa rì rào giúp dễ ngủ', u: 'https://asoftmurmur.com/' },
    { n: 'The Evolution of Trust', d: 'Trò chơi nhỏ về lòng tin và hợp tác', u: 'https://ncase.me/trust/' },
  ];
  /* ============================================================= */

  let seed = 31; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const L = (i, x, y, s, inner) => `<g transform="translate(${x} ${y}) scale(${s})"><a class="lk" data-i="${i}"><g>${inner}</g></a></g>`;
  const leafy = (x, y, r, c1, c2, n = 7) => { let s = ''; for (let k = 0; k < n; k++){ const a = -Math.PI * (.1 + .8 * k / (n - 1)); const ex = x + Math.cos(a) * r, ey = y + Math.sin(a) * r * .9; s += `<path class="leaf ${k % 2 ? 'b' : ''}" d="M${x} ${y}Q${(x + ex) / 2 - 12} ${(y + ey) / 2 - 10} ${ex.toFixed(0)} ${ey.toFixed(0)}Q${(x + ex) / 2 + 12} ${(y + ey) / 2 + 10} ${x} ${y}Z" fill="${k % 2 ? c1 : c2}"/>`; } return s; };

  let svg = `<defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3ff"/><stop offset=".6" stop-color="#d4f1ff"/><stop offset="1" stop-color="#fff4d6"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".2"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9c99a"/><stop offset="1" stop-color="#c9925a"/></linearGradient>
    <linearGradient id="tower" x1="0" x2="1"><stop offset="0" stop-color="#f4f1e6"/><stop offset="1" stop-color="#cfd8d0"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b4f9a"/><stop offset=".5" stop-color="#4a7fd8"/><stop offset="1" stop-color="#22407a"/></linearGradient>
    <radialGradient id="sunG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffbe0"/><stop offset=".3" stop-color="#fff2a8" stop-opacity=".9"/><stop offset="1" stop-color="#fff2a8" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".25" stop-color="#c8f4ff" stop-opacity=".35"/><stop offset="1" stop-color="#7ad0e8" stop-opacity=".45"/></radialGradient>
    <radialGradient id="pond" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#7fe0f0"/><stop offset="1" stop-color="#2a9ab8"/></radialGradient>
    <clipPath id="orbC"><circle r="74" cy="-90"/></clipPath>
    <clipPath id="mirC"><circle r="62"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/><circle cx="1260" cy="150" r="190" fill="url(#sunG)"/>`;
  // mây
  [[220, 120, 1], [760, 190, .8], [1480, 230, .7], [1050, 90, .6]].forEach(([x, y, s]) => { svg += `<g transform="translate(${x} ${y}) scale(${s})" opacity=".9"><ellipse rx="90" ry="26" fill="#fff"/><ellipse cx="-30" cy="-18" rx="44" ry="30" fill="#fff"/><ellipse cx="26" cy="-24" rx="50" ry="36" fill="#fff"/></g>`; });
  // đồi + thành phố xanh phía xa
  svg += `<path d="M0 560Q200 470 420 530T880 500T1300 520T1600 490V640H0Z" fill="#a9d89a"/><path d="M0 600Q260 540 520 580T1060 560T1600 570V640H0Z" fill="#7fc283"/>`;
  [[520, 300, 60], [600, 360, 46], [700, 270, 70], [820, 330, 54], [900, 250, 40], [1140, 320, 66], [1240, 380, 44], [1340, 300, 58], [1450, 360, 50]].forEach(([x, top, w], k) => {
    svg += `<path d="M${x - w / 2} 600V${top + 30}Q${x - w / 2} ${top} ${x} ${top}Q${x + w / 2} ${top} ${x + w / 2} ${top + 30}V600Z" fill="url(#tower)" opacity=".92"/>`;
    for (let y = top + 34; y < 590; y += 34) svg += `<path d="M${x - w / 2 - 4} ${y}H${x + w / 2 + 4}" stroke="#6ab06a" stroke-width="7" stroke-linecap="round"/><circle cx="${x - w / 2 + 6}" cy="${y - 4}" r="6" fill="#4f9a5a"/><circle cx="${x + w / 2 - 8}" cy="${y - 3}" r="5" fill="#5fae66"/>`;
    if (k % 3 === 0) svg += `<ellipse cx="${x}" cy="${top + 2}" rx="${w * .6}" ry="12" fill="#5fae66"/>`;
  });
  // khinh khí cầu xa xa
  svg += `<g opacity=".85"><ellipse cx="1000" cy="200" rx="22" ry="26" fill="#f0a35a"/><path d="M984 214 994 236H1006L1016 214" fill="#d9822a"/><rect x="994" y="236" width="12" height="9" fill="#8a5a3a"/></g>`;

  /* ---------- NGOÀI KÍNH ---------- */
  // 14 — tua-bin gió lớn
  svg += L(14, 330, 610, 1, `<path d="M-10 0-4 -380H4L10 0Z" fill="#f4f1e6" stroke="#cfd8d0"/><g transform="translate(0 -380)"><g class="spin s">${[0, 120, 240].map(a => `<path transform="rotate(${a})" d="M0 0C10 -30 8 -90 0 -128C-6 -90 -8 -30 0 0Z" fill="#fff" stroke="#cfd8d0" stroke-width="2"/>`).join('')}<circle r="128" fill="none"/></g><circle r="9" fill="#e0dccd"/></g>`);
  // 13 — dàn pin mặt trời trên đồi
  svg += L(13, 1010, 625, 1, `${[-110, -40, 30, 100].map((x, k) => `<g transform="translate(${x} 0)"><path d="M0 0V-34" stroke="#8a8f99" stroke-width="5"/><path d="M-34 -36 30 -36 40 -78-24 -78Z" fill="url(#panel)" stroke="#e8eef8" stroke-width="2"/><path d="M-12 -36-2 -78M10 -36 20 -78M-29 -57H35" stroke="#e8eef8" stroke-width="1.2"/></g>`).join('')}<rect x="-140" y="-8" width="270" height="10" rx="4" fill="#6ab06a"/><circle class="blink" cx="140" cy="-14" r="5" fill="#ffd23f"/>`);

  // kính + khung nhà kính kiểu art nouveau
  const bays = [0, 400, 800, 1200];
  svg += `<rect width="1600" height="640" fill="url(#glass)"/>`;
  bays.forEach(x0 => {
    svg += `<path d="M${x0} 640V190Q${x0 + 200} 30 ${x0 + 400} 190V640" fill="none" stroke="#fbf8ee" stroke-width="16"/><path d="M${x0} 640V190Q${x0 + 200} 30 ${x0 + 400} 190" fill="none" stroke="#c9a24a" stroke-width="3"/>`;
    [100, 200, 300].forEach(dx => { const t = dx / 400, y = 190 - 4 * 160 * t * (1 - t) * .82; svg += `<path d="M${x0 + dx} 640V${y.toFixed(0)}" stroke="#fbf8ee" stroke-width="5"/>`; });
    svg += `<path d="M${x0} 380H${x0 + 400}" stroke="#fbf8ee" stroke-width="7"/><path d="M${x0 + 150} 380q50 -40 100 0" fill="none" stroke="#c9a24a" stroke-width="3"/>`;
  });
  svg += `<path d="M0 22H1600" stroke="#fbf8ee" stroke-width="30"/><path d="M0 36H1600" stroke="#c9a24a" stroke-width="3"/>`;
  bays.concat([1600]).forEach(x => { svg += `<rect x="${x - 12}" y="20" width="24" height="640" fill="#fbf8ee"/><path d="M${x - 12} 640V20" stroke="#e0dccd" stroke-width="2"/><circle cx="${x}" cy="200" r="16" fill="none" stroke="#c9a24a" stroke-width="4"/><path d="M${x - 10} 220q10 30 0 60" stroke="#c9a24a" stroke-width="3" fill="none"/>`; });
  // bờ tường thấp + bồn cây chạy dọc
  svg += `<rect x="0" y="600" width="1600" height="50" fill="#fbf8ee"/><rect x="0" y="600" width="1600" height="6" fill="#c9a24a"/>`;
  for (let x = 20; x < 1600; x += 46) svg += `<g>${leafy(x, 606, 36 + (x * 7 % 20), '#4f9a5a', '#6ab06a', 5)}</g>`;
  svg += `<path d="M0 650H1600V900H0Z" fill="url(#floor)"/>`;
  for (let k = -10; k <= 10; k++) svg += `<path d="M${800 + k * 80} 650L${800 + k * 170} 900" stroke="#b5804a" stroke-opacity=".35" stroke-width="2"/>`;
  [690, 740, 805, 880].forEach(y => { svg += `<path d="M0 ${y}H1600" stroke="#b5804a" stroke-opacity=".3" stroke-width="2"/>`; });
  // dây leo treo từ trần
  [140, 960, 1450].forEach((x, k) => { svg += `<g class="sway ${k % 2 ? 'b' : ''}"><path d="M${x} 36Q${x + 10} 120 ${x - 6} 220" stroke="#4f9a5a" stroke-width="3" fill="none"/>${[60, 100, 140, 180, 214].map((y, j) => `<ellipse cx="${x + (j % 2 ? 10 : -8)}" cy="${36 + y}" rx="10" ry="6" fill="${j % 2 ? '#6ab06a' : '#4f9a5a'}" transform="rotate(${j % 2 ? 30 : -30} ${x} ${36 + y})"/>`).join('')}</g>`; });

  /* ---------- ĐỒ VẬT CÓ LINK ---------- */
  // 19 — chong chóng chỉ hướng gió trên nóc
  svg += L(19, 480, 604, 1, `<path d="M0 0V-126" stroke="#c9a24a" stroke-width="4"/><g transform="translate(0 -100)"><g class="tick" style="transform-origin:50% 50%"><path d="M-40 -30H40" stroke="#c9a24a" stroke-width="4"/><path d="M40 -30 26 -40V-20Z" fill="#c9a24a"/><path d="M-40 -30-54 -42-46 -30-54 -18Z" fill="#c9a24a"/><path d="M-20 -40Q-8 -48 0 -40Q8 -48 20 -40L12 -30H-12Z" fill="#c9a24a"/></g><circle cy="-30" r="6" fill="#fbf8ee" stroke="#c9a24a" stroke-width="2"/><path d="M-8 -4H8M0 -12V4" stroke="#c9a24a" stroke-width="3"/><text x="-16" y="-6" font-size="12" font-family="Nunito" font-weight="800" fill="#8a5a3a">W</text><text x="10" y="-6" font-size="12" font-family="Nunito" font-weight="800" fill="#8a5a3a">E</text></g>`);
  // 11 — chuông gió
  svg += L(11, 540, 36, 1, `<g class="sway"><path d="M0 0V40" stroke="#8a5a3a" stroke-width="2"/><ellipse cy="46" rx="40" ry="8" fill="#c9a24a"/>${[-30, -14, 2, 18, 32].map((x, k) => `<path d="M${x} 50V${70 + k * 10}" stroke="#8a5a3a"/><rect x="${x - 4}" y="${70 + k * 10}" width="8" height="${50 - k * 4}" rx="4" fill="${k % 2 ? '#e8eef8' : '#cfe8f8'}" stroke="#9ab8c8"/>`).join('')}<path d="M0 54V150" stroke="#8a5a3a"/><path d="M-12 150H12L0 176Z" fill="#7fc283"/></g>`);
  // 6 — hành tinh tí hon treo
  svg += L(6, 690, 36, 1, `<g class="sway b"><path d="M0 0V96" stroke="#8a5a3a" stroke-width="2"/><g transform="translate(0 150)"><circle r="54" fill="#4aa8e0"/><path d="M-46 -24Q-30 -40 -10 -30T20 -40 46 -20L40 0Q20 -6 6 6T-30 10-50 0Z" fill="#7fc283"/><path d="M-20 20Q0 10 14 24T40 26Q30 44 4 50-30 40-20 20Z" fill="#7fc283"/><path d="M-10 -30-2 -42 6 -30Z" fill="#fff"/><path d="M14 24 22 12 30 24Z" fill="#a98a6a"/><circle r="54" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><ellipse cx="-20" cy="-26" rx="14" ry="7" fill="#fff" opacity=".35"/></g></g>`);
  // 22 — tổ ong treo (ong hợp tác)
