<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&amp;family=IM+Fell+English:ital@0;1&amp;family=Cinzel:wght@600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../room.css">
<style>
  :root{--bg:#0d0a14;--ink:#f1e2c0;--accent:#c9a24a;--accent-soft:rgba(201,162,74,.38);--hud-bg:rgba(20,12,22,.85);--hud-ink:#f1e2c0;--hud-ink-on:#1a0f08;
    --hud-font:600 14px 'Cinzel',Georgia,serif;--btn-r:3px;--tip-bg:#f1e2c0;--tip-ink:#3a2010;--tip-font:'IM Fell English',Georgia,serif;--tip-size:21px;--tip-r:3px;
    --box-bg:#efe0bd;--box-ink:#3a2010;--box-r:4px;--title-font:700 22px 'Cinzel Decorative',Georgia,serif;--hint-font:italic 400 17px 'IM Fell English',Georgia,serif;--hint-ink:#f1e2c0;--enter:#000;
    --hover-filter:drop-shadow(0 0 6px #ffb347) drop-shadow(0 0 16px rgba(154,92,255,.85)) brightness(1.18)}
  .tip{border:2px solid #6a4a2a;box-shadow:0 0 0 4px rgba(241,226,192,.25),0 10px 30px rgba(0,0,0,.6)}
  .tip small{font-family:'IM Fell English',Georgia,serif;font-style:italic;font-size:15px}
  .list-box{border-color:#6a4a2a}
  .list-head{border-color:rgba(106,74,42,.4)}
  .list li a,.list-head p{font-family:'IM Fell English',Georgia,serif}
  .list li a:hover,.list li a:focus-visible{background:rgba(106,74,42,.18)}
  .room-title{font:700 clamp(16px,2.2vw,26px) 'Cinzel Decorative',Georgia,serif;color:#f1e2c0;letter-spacing:.06em;text-shadow:0 0 14px rgba(255,160,60,.7),0 2px 0 #000}
  .room-title span{display:block;font:italic 400 15px 'IM Fell English',Georgia,serif;letter-spacing:.2em;color:#b99cff;text-align:center;text-shadow:0 0 8px #000}
  .flick{animation:flick .18s steps(2) infinite alternate}.flick.b{animation-duration:.23s}.flick.c{animation-duration:.13s}
  @keyframes flick{from{opacity:1;transform:scaleY(1)}to{opacity:.82;transform:scaleY(.92)}}
  .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flame .5s ease-in-out infinite alternate}.flame.b{animation-delay:-.25s;animation-duration:.4s}
  @keyframes flame{from{transform:scale(1,1) skewX(-3deg)}to{transform:scale(.9,1.1) skewX(4deg)}}
  .bat{animation:bat 9s linear infinite}.bat.b{animation-delay:-3s;animation-duration:12s}.bat.c{animation-delay:-6s;animation-duration:7s}
  @keyframes bat{from{transform:translate(-140px,30px)}50%{transform:translate(0,-20px)}to{transform:translate(140px,20px)}}
  .wing{transform-box:fill-box;transform-origin:50% 100%;animation:wing .25s ease-in-out infinite alternate}
  @keyframes wing{to{transform:scaleY(-.6)}}
  .bub{animation:bub 2s ease-in infinite}.bub.b{animation-delay:-.7s}.bub.c{animation-delay:-1.4s}
  @keyframes bub{from{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}to{transform:translateY(-70px) scale(1.2);opacity:0}}
  .swirl{transform-box:fill-box;transform-origin:center;animation:sw 6s linear infinite}.swirl.r{animation-direction:reverse;animation-duration:9s}
  @keyframes sw{to{transform:rotate(360deg)}}
  .glow{animation:glow 3s ease-in-out infinite}
  @keyframes glow{50%{opacity:.45}}
  .eyes{animation:eyes 5s steps(1) infinite}
  @keyframes eyes{0%,46%,50%,100%{opacity:1}47%,49%{opacity:0}}
  .sing{transform-box:fill-box;transform-origin:50% 100%;animation:sing 1.4s ease-in-out infinite alternate}.sing.b{animation-delay:-.5s;animation-duration:1.1s}.sing.c{animation-delay:-.9s;animation-duration:1.7s}
  @keyframes sing{to{transform:scaleY(1.14)}}
  .note{animation:note 2.6s ease-out infinite}.note.b{animation-delay:-1.3s}
  @keyframes note{from{transform:translate(0,0);opacity:0}20%{opacity:1}to{transform:translate(18px,-46px);opacity:0}}
  .breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
  @keyframes breathe{50%{transform:scaleY(1.05)}}
  .sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 4s ease-in-out infinite alternate}
  @keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
  .rune{animation:rune 18s linear infinite;transform-box:fill-box;transform-origin:center}
  @keyframes rune{to{transform:rotate(360deg)}}
  .wob{transform-box:fill-box;transform-origin:50% 100%;animation:wob 4s ease-in-out infinite}
  @keyframes wob{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-6deg)}88%{transform:rotate(6deg)}92%{transform:rotate(-3deg)}}
  .ear{transform-box:fill-box;transform-origin:50% 100%;animation:ear 3s ease-in-out infinite}
  @keyframes ear{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-12deg)}}
  .dust{animation:dust 2s ease-in-out infinite alternate}
  @keyframes dust{to{opacity:.3}}
</style>
</head>
<body>
<div class="enter"></div>
<div class="wrap" id="wrap"><svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Phòng giả kim trong tòa tháp đá: lò sưởi, vạc thuốc, giá sách, cửa sổ nhìn ra trăng"></svg></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="room-title" aria-hidden="true">The Alchemist's Tower<span>~ chớ đánh thức con rồng ~</span></div>
<nav class="hud" aria-label="Điều hướng"><a href="../?hub">← SẢNH</a><a href="../../home.html" aria-label="Về Anrevy House">⌂<span class="wide"> ANREVY HOUSE</span></a><button id="listBtn" aria-haspopup="dialog" aria-label="Danh sách trò chơi">☰<span class="wide"> DANH SÁCH</span></button></nav>

<div class="list" id="list" role="dialog" aria-modal="true" aria-labelledby="listTitle"><div class="list-bg" data-close></div><div class="list-box" id="listBox"><div class="list-head"><h2 id="listTitle">Grimoire</h2><p id="listCount"></p></div><ol></ol><button class="list-x" data-close aria-label="Đóng">✕</button></div></div>
<div class="tv" id="tv"><div class="tv-bar"><span class="tv-t">♪ tower ambience</span><button id="snd" aria-pressed="false" aria-label="Bật hoặc tắt nhạc">off</button><button id="tvMin" aria-expanded="true" aria-controls="tvScr" aria-label="Ẩn video">–</button></div><div class="tv-scr" id="tvScr"><div id="yt"></div><span class="tv-msg" id="tvMsg">tap anywhere for sound</span></div></div>
<script>
(() => {
  /* ======= LINK TRONG PHÒNG (thứ tự = data-i của đồ vật) ======= */
  const LINKS = [
    { n: 'A Dark Room', d: 'Bắt đầu bằng việc nhóm lửa trong căn phòng tối', u: 'https://adarkroom.doublespeakgames.com/' },
    { n: 'Man in the Dark', d: 'Có ai đó đang đứng trong bóng tối…', u: 'https://www.maninthedark.com/' },
    { n: 'Random Rabbit Hole', d: 'Theo chân thỏ trắng tới một trang ngẫu nhiên', u: 'https://www.bored.com/category/random-rabbit-hole' },
    { n: 'Touch Pianist', d: 'Gõ phím nào cũng thành bản nhạc cổ điển', u: 'https://touchpianist.com/' },
    { n: 'Blob Opera', d: 'Kéo 4 cục bông hát opera', u: 'https://artsandculture.google.com/experiment/blob-opera/AAHWrq360NcGbw' },
    { n: 'Little Alchemy 2', d: 'Pha trộn nguyên tố để tạo ra cả thế giới', u: 'https://littlealchemy2.com/' },
    { n: 'Candy Box 2', d: 'Game chữ: nhặt kẹo, mua kiếm, đi phiêu lưu', u: 'https://candybox2.github.io/' },
    { n: 'Fantasy Name Generators', d: 'Đặt tên cho tiên, rồng, thành phố, thần chú…', u: 'https://www.fantasynamegenerators.com/' },
    { n: 'Azgaar Fantasy Map', d: 'Tạo bản đồ thế giới giả tưởng', u: 'https://azgaar.github.io/Fantasy-Map-Generator/' },
    { n: 'Medieval City Generator', d: 'Bấm một cái ra một thành phố trung cổ', u: 'https://watabou.github.io/city-generator/' },
    { n: 'One Page Dungeon', d: 'Hầm ngục ngẫu nhiên vừa một trang giấy', u: 'https://watabou.github.io/one-page-dungeon/' },
    { n: 'donjon', d: 'Công cụ tung xúc xắc, tạo hầm ngục cho D&D', u: 'https://donjon.bin.sh/' },
    { n: 'Fallen London', d: 'Truyện phiêu lưu ở London chìm dưới lòng đất', u: 'https://www.fallenlondon.com/' },
    { n: 'Zork', d: 'Game chữ huyền thoại: trời tối đen, coi chừng con grue', u: 'https://www.web-adventures.org/cgi-bin/webfrotz?s=ZorkDungeon' },
    { n: 'Tabletop Audio', d: 'Nhạc nền cho quán rượu, hầm ngục, rừng sâu', u: 'https://tabletopaudio.com/' },
    { n: 'Ambient Mixer', d: 'Trộn âm thanh thư viện cổ, lâu đài, mưa đêm', u: 'https://www.ambient-mixer.com/' },
    { n: 'Dungeon Scrawl', d: 'Vẽ bản đồ hầm ngục bằng bút mực', u: 'https://www.dungeonscrawl.com/' },
    { n: 'Inkarnate', d: 'Vẽ bản đồ giả tưởng đẹp như sách', u: 'https://inkarnate.com/' },
    { n: 'HeroForge', d: 'Tự thiết kế nhân vật anh hùng 3D', u: 'https://www.heroforge.com/' },
    { n: 'AI Dungeon', d: 'Phiêu lưu bằng chữ cùng AI kể chuyện', u: 'https://aidungeon.com/' },
    { n: 'Dragon Cave', d: 'Nhặt trứng rồng về ấp và nuôi lớn', u: 'https://dragcave.net/' },
    { n: 'Kittens Game', d: 'Xây làng mèo từ một cánh đồng bạc hà mèo', u: 'https://kittensgame.com/web/' },
    { n: 'Kingdom of Loathing', d: 'RPG người que hài hước', u: 'https://www.kingdomofloathing.com/' },
    { n: 'Chaotic Shiny', d: 'Hàng trăm máy tạo ngẫu nhiên cho thế giới giả tưởng', u: 'https://chaoticshiny.com/' },
  ];
  /* ============================================================= */

  let seed = 47; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const L = (i, x, y, s, inner) => `<g transform="translate(${x} ${y}) scale(${s})"><a class="lk" data-i="${i}"><g>${inner}</g></a></g>`;
  const candle = (x, y, h = 40, c = '') => `<g transform="translate(${x} ${y})"><circle cy="${-h - 10}" r="22" fill="url(#cGlow)" class="flick ${c}"/><rect x="-6" y="${-h}" width="12" height="${h}" fill="#efe0bd"/><path d="M-6 ${-h}q3 8 0 14" stroke="#d9c8a0" stroke-width="3" fill="none"/><path class="flame ${c}" d="M0 ${-h - 22}Q7 ${-h - 10} 0 ${-h - 2}Q-7 ${-h - 10} 0 ${-h - 22}Z" fill="#ffcf5a"/><path d="M0 ${-h - 2}V${-h + 2}" stroke="#2a1a0a" stroke-width="2"/></g>`;
  const GW = 'M690 430V170Q690 90 800 40Q910 90 910 170V430Z';

  let svg = `<defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16101f"/><stop offset="1" stop-color="#2a2034"/></linearGradient>
    <linearGradient id="flr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#231a2a"/><stop offset="1" stop-color="#0d0a12"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1030"/><stop offset="1" stop-color="#3a2a6a"/></linearGradient>
    <linearGradient id="wood" x1="0" x2="1"><stop offset="0" stop-color="#3a2216"/><stop offset=".5" stop-color="#5a3a26"/><stop offset="1" stop-color="#3a2216"/></linearGradient>
    <linearGradient id="parch" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1e2c0"/><stop offset="1" stop-color="#cfb58a"/></linearGradient>
    <linearGradient id="steel" x1="0" x2="1"><stop offset="0" stop-color="#5a6070"/><stop offset=".5" stop-color="#c9d0dc"/><stop offset="1" stop-color="#4a5060"/></linearGradient>
    <radialGradient id="cGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb347" stop-opacity=".55"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
    <radialGradient id="fireG" cx=".5" cy=".8" r=".7"><stop offset="0" stop-color="#ff8a2a" stop-opacity=".55"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient>
    <radialGradient id="moon" cx=".4" cy=".4" r=".6"><stop offset="0" stop-color="#fffbe8"/><stop offset="1" stop-color="#e8dcb8"/></radialGradient>
    <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5"><stop offset=".3" stop-color="#d8d0ff" stop-opacity=".45"/><stop offset="1" stop-color="#d8d0ff" stop-opacity="0"/></radialGradient>
    <radialGradient id="ball" cx=".38" cy=".32" r=".7"><stop offset="0" stop-color="#f0e6ff"/><stop offset=".3" stop-color="#9a5cff" stop-opacity=".85"/><stop offset="1" stop-color="#2a0a5a"/></radialGradient>
    <radialGradient id="brew" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#b8ff5a"/><stop offset="1" stop-color="#3a9a2a"/></radialGradient>
    <radialGradient id="egg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#9af0d0"/><stop offset=".6" stop-color="#2a8a7a"/><stop offset="1" stop-color="#0a3a3a"/></radialGradient>
    <radialGradient id="circleG" cx=".5" cy=".5" r=".5"><stop offset=".6" stop-color="#9a5cff" stop-opacity=".0"/><stop offset=".9" stop-color="#9a5cff" stop-opacity=".35"/><stop offset="1" stop-color="#9a5cff" stop-opacity="0"/></radialGradient>
    <clipPath id="gw"><path d="${GW}"/></clipPath>
    <clipPath id="ballC"><circle cy="-70" r="46"/></clipPath>
  </defs>
  <rect width="1600" height="900" fill="url(#wall)"/>`;
  // tường đá
  for (let r = 0; r < 14; r++){ const y = r * 46, off = r % 2 ? 0 : -50; for (let x = off; x < 1600; x += 100){ const sh = 30 + rnd() * 18; svg += `<rect x="${x + 2}" y="${y + 2}" width="96" height="42" rx="5" fill="rgb(${sh + 10},${sh},${sh + 18})" opacity=".55"/>`; } }
  // cột gỗ & xà trần
  svg += `<rect x="0" y="0" width="1600" height="34" fill="#1a0f0a"/>${[0, 400, 1200, 1600].map(x => `<rect x="${x - 18}" y="0" width="36" height="650" fill="url(#wood)"/>`).join('')}`;
  // cửa sổ gothic + trăng + dơi
  svg += `<g clip-path="url(#gw)"><rect x="680" y="30" width="240" height="410" fill="url(#night)"/>`;
  for (let k = 0; k < 40; k++) svg += `<circle cx="${(690 + rnd() * 220).toFixed(0)}" cy="${(50 + rnd() * 300).toFixed(0)}" r="${(.6 + rnd()).toFixed(1)}" fill="#fff" opacity="${(.4 + rnd() * .6).toFixed(2)}"/>`;
  svg += `</g>`;
  // 12 — khung cửa sổ trăng (Fallen London)
  svg += L(12, 800, 430, 1, `<g clip-path="url(#gw)" transform="translate(-800 -430)"><circle cx="800" cy="170" r="110" fill="url(#moonGlow)"/><circle cx="800" cy="170" r="54" fill="url(#moon)"/><circle cx="784" cy="156" r="9" fill="#e0d2a8"/><circle cx="816" cy="186" r="12" fill="#e0d2a8"/><path d="M680 440V350L720 310 760 340 800 290 840 330 880 300 920 340V440Z" fill="#120a1c"/><path d="M748 300V250L764 236 780 250V300M820 330V270L840 250 860 270V330" fill="#120a1c"/><rect x="756" y="262" width="6" height="10" fill="#ffcf5a" class="glow"/><rect x="836" y="282" width="6" height="10" fill="#ffcf5a" class="glow"/>${['', 'b', 'c'].map((c, k) => `<g class="bat ${c}"><g transform="translate(${800} ${110 + k * 50}) scale(${.8 - k * .15})"><path class="wing" d="M0 0Q-10 -10 -26 -6Q-18 -2 -20 6Q-10 2 0 6Q10 2 20 6Q18 -2 26 -6Q10 -10 0 0Z" fill="#05030a"/></g></g>`).join('')}</g><path d="M-110 0V-260Q-110 -340 0 -390Q110 -340 110 -260V0" fill="none" stroke="#3a2e44" stroke-width="22"/><path d="M0 -386V0M-110 -200H110" stroke="#3a2e44" stroke-width="8"/><path d="M-110 0V-260Q-110 -340 0 -390Q110 -340 110 -260V0" fill="none" stroke="#c9a24a" stroke-width="2" opacity=".6"/><rect x="-130" y="0" width="260" height="22" fill="#3a2e44"/>`);
  // 15 — quạ đậu trên bậu cửa sổ
  svg += L(15, 900, 432, 1, `<path d="M-6 0-2 -12M6 0 2 -12" stroke="#c9a24a" stroke-width="3"/><path class="breathe" d="M-26 -14Q-30 -50 -6 -60Q14 -64 20 -48L34 -44 20 -38Q22 -20 6 -14Z" fill="#0a0812"/><path d="M-26 -14-46 -2-30 -24Z" fill="#0a0812"/><circle cx="10" cy="-50" r="3" fill="#ffcf5a"/><path d="M-20 -40Q-6 -30 6 -36" stroke="#2a2440" stroke-width="3" fill="none"/>`);
  // tấm thảm trên sàn + vòng phép
  svg += `<path d="M0 640H1600V900H0Z" fill="url(#flr)"/><path d="M0 640H1600" stroke="#3a2e44" stroke-width="6"/>`;
  for (let k = -8; k <= 8; k++) svg += `<path d="M${800 + k * 100} 640L${800 + k * 210} 900" stroke="#0a0710" stroke-width="3" opacity=".7"/>`;
  [680, 740, 820].forEach(y => { svg += `<path d="M0 ${y}H1600" stroke="#0a0710" stroke-width="3" opacity=".6"/>`; });
  svg += `<g transform="translate(800 820) scale(1 .3)"><circle r="300" fill="url(#circleG)"/><g class="rune"><circle r="250" fill="none" stroke="#9a5cff" stroke-width="5" opacity=".7"/><circle r="214" fill="none" stroke="#9a5cff" stroke-width="2" opacity=".6"/><path d="M0 -250 216 125-216 125Z M0 250-216 -125 216 -125Z" fill="none" stroke="#9a5cff" stroke-width="3" opacity=".55"/>${Array.from({ length: 12 }, (_, k) => { const a = k * Math.PI / 6; return `<text x="${(Math.cos(a) * 232).toFixed(0)}" y="${(Math.sin(a) * 232 + 8).toFixed(0)}" font-size="26" fill="#c9a8ff" text-anchor="middle" opacity=".8">${'ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃ'[k]}</text>`; }).join('')}</g></g>`;

  /* ---------- ĐỒ VẬT CÓ LINK ---------- */
  // giá sách lớn bên trái (trang trí) + đồ trên kệ
  svg += `<rect x="40" y="110" width="320" height="530" fill="#2a1810" stroke="#1a0f0a" stroke-width="8"/>`;
  [210, 330, 450, 570].forEach(y => { svg += `<rect x="40" y="${y}" width="320" height="12" fill="#4a2e1e"/>`; });
  [[120, 210], [330, 330]].forEach(([y0, y1], r) => { let x = 52; while (x < 340){ const w = 12 + rnd() * 16, h = 54 + rnd() * 36; if (r === 0 && x > 170 && x < 300){ x = 300; continue; } svg += `<rect x="${x.toFixed(0)}" y="${(y1 - h).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" fill="${['#5a1a2a', '#1a3a4a', '#3a4a1a', '#4a2a5a', '#6a4a1a'][Math.floor(rnd() * 5)]}" stroke="#0a0608"/><path d="M${(x + 2).toFixed(0)} ${(y1 - h + 10).toFixed(0)}h${(w - 4).toFixed(0)}" stroke="#c9a24a" stroke-width="2"/>`; x += w + 2; } });
  [[452, 570]].forEach(([y0, y1]) => { let x = 52; while (x < 200){ const w = 14 + rnd() * 14, h = 60 + rnd() * 34; svg += `<rect x="${x.toFixed(0)}" y="${(y1 - h).toFixed(0)}" width="${w.toFixed(0)}" height="${h.toFixed(0)}" fill="${['#5a1a2a', '#1a3a4a', '#3a4a1a', '#4a2a5a'][Math.floor(rnd() * 4)]}" stroke="#0a0608"/>`; x += w + 2; } });
  svg += `<g transform="translate(280 570) rotate(-20)"><rect x="-10" y="-90" width="22" height="90" fill="#4a2a5a" stroke="#0a0608"/></g>`;
  // 4 — bốn cục bông hát opera trên kệ
