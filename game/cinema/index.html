  svg += L(5, 1500, 884, 1, `<ellipse cy="-4" rx="70" ry="10" fill="#000" opacity=".5"/><rect x="-40" y="-96" width="80" height="96" fill="#2a2c33" stroke="url(#silver)" stroke-width="3"/><rect x="-50" y="-106" width="100" height="12" fill="url(#silver)"/><path d="M-26 -106Q-30 -128 -18 -134H18Q30 -128 26 -106Z" fill="url(#metal)"/><path d="M-50 -170Q-52 -246 0 -250Q52 -246 50 -170Q48 -136 0 -132Q-48 -136 -50 -170Z" fill="url(#metal)" stroke="#4a505a" stroke-width="3"/><path d="M-50 -176Q-30 -184 -8 -176V-138Q-36 -140 -48 -158Z" fill="#14161c"/>${[[-40, -170], [-28, -160], [-20, -150]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3" fill="#ffcf6b"/>`).join('')}<path d="M-44 -168H-30V-156H-18M-36 -150V-142" stroke="#5ff4ff" stroke-width="1.5" fill="none" opacity=".8"/><g class="eye"><circle cx="-20" cy="-196" r="12" fill="url(#cyanG)"/><circle cx="-20" cy="-196" r="5" fill="#5ff4ff"/><circle cx="22" cy="-196" r="12" fill="url(#cyanG)"/><circle cx="22" cy="-196" r="5" fill="#5ff4ff"/></g><path d="M4 -180L96 -166L4 -170Z" fill="#c98a4a" stroke="#6a4420" stroke-width="2"/><path d="M60 -172q6 -10 14 -8" stroke="#4a8a2a" stroke-width="2" fill="none"/><ellipse cx="76" cy="-182" rx="7" ry="3" fill="#5bbf4a" transform="rotate(-20 76 -182)"/><path d="M-14 -150Q0 -144 14 -150" stroke="#14161c" stroke-width="3" fill="none"/><path d="M-30 -136Q-40 -110 -30 -96M30 -136Q44 -116 34 -96M10 -134Q14 -116 6 -100" stroke="#e8202e" stroke-width="2.5" fill="none"/><path d="M-6 -134Q-12 -118 -4 -100" stroke="#5ff4ff" stroke-width="2.5" fill="none"/>`);

  // hàng ghế nhung phía trước (trang trí)
  for (let k = 0; k < 5; k++){ const x = 640 + k * 84; svg += `<g transform="translate(${x} 900)"><path d="M-36 0V-56Q-36 -78 0 -80Q36 -78 36 -56V0Z" fill="url(#velvet)" stroke="#2a0408" stroke-width="3"/><path d="M-26 -14V-52Q-26 -66 0 -68Q26 -66 26 -52V-14" stroke="#c8203a" stroke-width="2" fill="none" opacity=".6"/><circle cy="-70" r="3" fill="url(#gold)"/></g>`; }

  document.getElementById('scene').innerHTML = svg;

  // bụi lấp lánh trong chùm sáng máy chiếu
  const dust = Array.from({ length: 46 }, () => ({ t: Math.random(), u: Math.random(), v: .01 + Math.random() * .025, w: Math.random() * 6 }));
  window.ROOM = {
    title: 'Midnight Reel', music: 'PaFHwTjy1yE', links: LINKS, noun: 'phim & đĩa nhạc', openHint: 'bấm để mở (phim mở trên YouTube)',
    fx(g, t, dt, W, H, S){
      for (const d of dust){
        d.t += d.v * dt; if (d.t > 1){ d.t = 0; d.u = Math.random(); }
        const y = d.t * 432, half = 40 + (270 - 40) * d.t, x = 800 + (d.u - .5) * 2 * half + Math.sin(t * .8 + d.w) * 6;
        const [sx, sy, k] = S(x, y); const a = .25 + .35 * Math.sin(t * 2 + d.w) ** 2;
        g.fillStyle = `rgba(255,246,220,${a.toFixed(2)})`; g.beginPath(); g.arc(sx, sy, 1.4 * k + .5, 0, 7); g.fill();
      }
    }
  };
})();
