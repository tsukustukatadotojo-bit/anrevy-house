  for (let k = 0; k < 230; k++){ const x = 380 + rnd() * 840, y = 70 + rnd() * 460, r = rnd() < .9 ? .6 + rnd() * .9 : 1.6 + rnd(); svg += `<circle class="${rnd() < .3 ? 'tw ' + 'abc'[k % 3] : ''}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" fill="${rnd() < .15 ? '#ffd9a8' : rnd() < .2 ? '#bff6ff' : '#fff'}"/>`; }

  svg += L(7, 820, 210, 1, `<circle r="46" fill="url(#neb3)" opacity=".8"/>${[[0, 0, 5], [-22, 12, 2.5], [18, -14, 3], [26, 18, 2], [-14, -22, 2]].map(([x, y, r], k) => `<g transform="translate(${x} ${y})" class="tw ${'abc'[k % 3]}"><path d="M0 ${-r * 5}L${r * .5} 0 0 ${r * 5} ${-r * .5} 0Z M${-r * 5} 0 0 ${r * .5} ${r * 5} 0 0 ${-r * .5}Z" fill="#fff"/><circle r="${r}" fill="#fff"/></g>`).join('')}`);
