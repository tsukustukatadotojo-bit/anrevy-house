  svg += `<rect x="0" y="600" width="1600" height="300" fill="url(#carpet)"/><rect x="0" y="600" width="1600" height="300" fill="#0b0520" opacity=".42"/><rect x="0" y="596" width="1600" height="8" fill="#0b0520"/>`;

  /* ---------- Áp phích trên tường ---------- */

  // 21 — hộp giải đố
  svg += L(21, 380, 214, 1, `<rect x="-70" y="-150" width="140" height="150" rx="10" fill="#2bff88" stroke="#0b0520" stroke-width="4"/>${[0, 1, 2].map(r => [0, 1, 2].map(c => `<rect x="${-56 + c * 38}" y="${-136 + r * 40}" width="34" height="36" rx="4" fill="${(r + c) % 2 ? '#0b0520' : '#fff6d6'}"/>`).join('')).join('')}${px('?', 0, -64, 24, '#ff2a6d')}${px('PUZZLES', 0, -158, 10, '#2bff88')}`);

  svg += L(23, 1430, 214, 1, `<rect x="-76" y="-160" width="152" height="160" fill="#fff6d6" stroke="#ff2a6d" stroke-width="5"/><path d="M-10 -40c-44 2-50-46-22-58-6-26 26-40 40-26 16-16 50-4 44 22 26 12 18 58-24 62z" fill="#ff8ab0" stroke="#2c1660" stroke-width="4"/><path d="M2 -118v76M-30 -88q16 8 30 0M8 -70q18 8 34-4" stroke="#2c1660" stroke-width="3" fill="none"/>${px('IQ?', 0, -14, 14, '#2c1660')}`);
