<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>⌈ＴＲＡＶＩＳ　ＲＯＯＭ⌋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
  :root{--rust:#ff7a1a;--ember:#ff4d12;--sand:#e8cfa6;--ink:#fff3e6;--dim:#c9a98a;--bg:#140b09}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;touch-action:none}
  body{background:var(--bg);color:var(--ink);font-family:'VT323',monospace;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  button{font:inherit;color:inherit}
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;outline:none}
  #scene.drag{cursor:grabbing}
  #scene.point{cursor:pointer}

  /* không có WebGL */
  .nogl{display:none;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:24px;
    background:radial-gradient(ellipse 70% 50% at 50% 35%, rgba(255,122,26,.35), transparent 70%), linear-gradient(180deg,#2a140c,#0c0605)}
  .nogl b{font:400 clamp(48px,12vw,120px)/.9 'Anton',sans-serif;letter-spacing:.02em;color:#fff1e0;text-shadow:0 0 30px rgba(255,122,26,.7)}
  .nogl p{font-size:20px;color:var(--dim);max-width:30em}
  body.no-gl .nogl{display:flex}
  body.no-gl #scene{display:none}

  /* HUD */
  .hud{position:fixed;z-index:30;font-size:18px;letter-spacing:.08em}
  .hud-tl{top:calc(16px + env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:8px}
  .hud a,.hud button{
    display:inline-block;color:var(--ink);text-decoration:none;padding:2px 12px;border-radius:999px;cursor:pointer;
    background:rgba(20,10,6,.78);border:1.5px solid var(--rust);box-shadow:0 0 12px rgba(255,122,26,.35);
  }
  .hud a:hover,.hud a:focus-visible,.hud button:hover,.hud button:focus-visible{background:var(--rust);color:#1a0a04;outline:none}

  .intro{position:fixed;z-index:20;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;transition:opacity 1.4s,transform 1.4s}
  .intro b{display:block;font:400 clamp(54px,11vw,150px)/.88 'Anton',sans-serif;letter-spacing:.015em;color:#fff4e8;
    text-shadow:0 0 .05em #fff,0 0 .25em rgba(255,122,26,.9),0 0 .7em rgba(255,77,18,.6)}
  .intro span{display:block;margin-top:.4em;font-size:clamp(18px,2.6vw,26px);letter-spacing:.5em;padding-left:.5em;color:var(--sand)}
  .intro.out{opacity:0;transform:translate(-50%,-58%)}

  .tag{position:fixed;z-index:25;left:0;top:0;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .15s;
    font:400 15px 'Anton',sans-serif;letter-spacing:.08em;color:#1a0a04;background:var(--rust);padding:3px 10px;border-radius:3px;box-shadow:0 0 14px rgba(255,122,26,.7)}
  .tag.on{opacity:1}
  .hint{position:fixed;z-index:20;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
    font-size:18px;letter-spacing:.1em;color:var(--dim);white-space:nowrap;text-shadow:0 0 8px #000;opacity:0;transition:opacity 1s;pointer-events:none}
  .hint.on{opacity:1}
  .ride-note{position:fixed;z-index:22;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:none;
    font:400 20px 'Anton',sans-serif;letter-spacing:.12em;color:#fff;text-shadow:0 0 10px var(--ember)}
  body.riding .ride-note{display:block}
  body.riding .hint,body.riding .tag{opacity:0}

  /* ===== MÀN HÌNH NHẠC ===== */
  .tv{
    --tvw:clamp(180px,18vw,260px);
    position:fixed;z-index:35;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));
    width:var(--tvw);overflow:hidden;border-radius:8px;background:rgba(20,10,6,.92);border:1.5px solid var(--rust);box-shadow:0 0 14px rgba(255,122,26,.4);
  }
  .tv-bar{display:flex;align-items:center;gap:4px;padding:3px 4px 3px 9px;font-size:15px;line-height:1;letter-spacing:.06em}
  .tv-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tv-t i{font-style:normal;display:inline-block;width:1.1em;color:var(--rust)}
  .tv.on .tv-t i{animation:note 1.2s ease-in-out infinite alternate}
  @keyframes note{to{transform:translateY(-3px)}}
  .tv-bar button{font-size:14px;line-height:1.1;padding:1px 7px;border-radius:999px;cursor:pointer;background:rgba(255,255,255,.07);border:1px solid rgba(255,122,26,.6);color:var(--ink)}
  .tv-bar button:hover,.tv-bar button:focus-visible{background:var(--rust);color:#1a0a04;outline:none}
  .tv-scr{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden}
  .tv-scr iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .tv-msg{position:absolute;z-index:1;left:0;right:0;bottom:0;padding:3px 6px;text-align:center;font-size:14px;letter-spacing:.06em;background:rgba(20,10,6,.8)}
  .tv-msg small{display:block;font-size:12px;color:var(--dim)}
  .tv.on .tv-msg{display:none}
  .tv.dead .tv-msg{display:flex;flex-direction:column;justify-content:center;top:0;background:rgba(20,10,6,.92)}
  .tv.min{width:auto;max-width:calc(100vw - 28px)}
  .tv.min .tv-t{max-width:150px}
  .tv.min .tv-scr{position:absolute;top:100%;left:0;width:var(--tvw);opacity:0;pointer-events:none}

  /* ===== DANH SÁCH BÀI (đĩa trên tường) ===== */
  .panel{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
  .panel.open{display:flex}
  .p-bg{position:absolute;inset:0;background:rgba(12,6,4,.8);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .p-box{position:relative;width:min(560px,100%);max-height:min(84vh,760px);display:flex;flex-direction:column;border-radius:10px;overflow:hidden;
    background:linear-gradient(180deg,#2a150c,#130a07);border:2px solid var(--rust);box-shadow:0 0 0 6px #1a0c06,0 0 40px rgba(255,122,26,.35)}
  .p-head{padding:16px 54px 12px 18px;border-bottom:1px solid rgba(255,122,26,.35)}
  .p-head h2{font:400 34px/1 'Anton',sans-serif;letter-spacing:.03em;color:#fff1e0;text-shadow:0 0 14px rgba(255,122,26,.6)}
  .p-head p{font-size:17px;color:var(--dim);letter-spacing:.06em;margin-top:4px}
  .p-close{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;background:#1a0c06;border:1.5px solid var(--rust);color:var(--rust)}
  .p-close:hover,.p-close:focus-visible{background:var(--rust);color:#1a0a04;outline:none}
  .p-list{list-style:none;overflow:auto;overscroll-behavior:contain;padding:6px 0 10px}
  .p-list button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;background:none;border:0;padding:8px 18px;font-size:19px;letter-spacing:.04em}
  .p-list button:hover,.p-list button:focus-visible{background:rgba(255,122,26,.16);outline:none}
  .p-list .n{flex:none;width:2.2em;color:var(--rust)}
  .p-list .t{flex:1;min-width:0}
  .p-list .t b{font:400 18px 'Anton',sans-serif;letter-spacing:.05em;color:#fff1e0}
  .p-list .t small{display:block;font-size:15px;color:var(--dim)}
  .p-list .vinyl{flex:none;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,var(--c) 0 26%,#0b0b0b 28% 31%,transparent 32%),repeating-radial-gradient(circle,#141414 0 1.5px,#242424 1.5px 3px)}
  .p-list button[aria-current="true"] .vinyl{animation:spin 1.6s linear infinite}
  .p-list button[aria-current="true"] .t b{color:var(--rust)}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:640px){
    .hud{font-size:15px}
    .hint{font-size:15px;white-space:normal;width:90%;text-align:center;bottom:auto;top:calc(56px + env(safe-area-inset-top,0px))}
    .tv{--tvw:168px}
    .tv-bar{font-size:13px;gap:3px;padding:2px 3px 2px 7px}
    .tv-bar button{font-size:12px;padding:0 6px}
    .tv-msg{font-size:12px}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition-duration:.01s!important}
  }
</style>
</head>
<body>
  <canvas id="scene" tabindex="0" aria-label="Phòng Travis Scott 3D. Kéo để nhìn quanh, bấm xuống sàn để đi tới, bấm vào đồ vật để tương tác."></canvas>
  <div class="nogl"><b>TRAVIS SCOTT</b><p>Trình duyệt này không mở được không gian 3D. Nhạc vẫn phát ở màn hình nhỏ góc phải, bấm ≡ để chọn bài.</p></div>

  <nav class="hud hud-tl" aria-label="Lối ra">
    <a href="../jazz/">← JAZZ CLUB</a>
    <a href="../home.html">⌂ ANREVY HOUSE</a>
  </nav>

  <div class="intro" id="intro" aria-hidden="true"><b>TRAVIS SCOTT</b><span>FAN ROOM</span></div>
  <div class="tag" id="tag" aria-hidden="true"></div>
  <div class="hint" id="hint"></div>
  <div class="ride-note" id="rideNote">RIDING · chạm để xuống</div>

  <!-- MÀN HÌNH NHẠC -->
  <div class="tv" id="tv">
    <div class="tv-bar">
      <span class="tv-t" id="now"><i aria-hidden="true">♪</i>travis.fm</span>
      <button id="snd" aria-pressed="false" aria-label="Bật hoặc tắt tiếng nhạc">off</button>
      <button id="shuffle" aria-label="Bài ngẫu nhiên khác">⤨</button>
      <button id="listBtn" aria-label="Mở danh sách bài" aria-haspopup="dialog">≡</button>
      <button id="tvMin" aria-expanded="true" aria-controls="tvScr" aria-label="Thu nhỏ màn hình">–</button>
    </div>
    <div class="tv-scr" id="tvScr"><div id="yt"></div><span class="tv-msg" id="tvMsg">tap anywhere for sound</span></div>
  </div>

  <!-- DANH SÁCH BÀI -->
  <div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle">
    <div class="p-bg" id="pBg"></div>
    <div class="p-box">
      <div class="p-head"><h2 id="pTitle">RECORD WALL</h2><p id="pSub"></p></div>
      <ul class="p-list" id="pList"></ul>
      <button class="p-close" id="pClose" aria-label="Đóng danh sách">✕</button>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  /* ======= CÀI ĐẶT ======= */
  // BÀI HÁT phát ngẫu nhiên (mã video YouTube trên kênh chính thức TravisScottVEVO)
  const TRACKS = [
    { id: '6ONRf7h3Mdk', t: 'SICKO MODE', s: 'ft. Drake · ASTROWORLD' },
    { id: 'Dst9gZkq1a8', t: 'goosebumps', s: 'ft. Kendrick Lamar · Birds in the Trap Sing McKnight' },
    { id: 'tfSS1e3kYeo', t: 'HIGHEST IN THE ROOM', s: 'single · 2019' },
    { id: '_EyZUTDAH0U', t: 'BUTTERFLY EFFECT', s: 'ASTROWORLD' },
    { id: 'KnZ8h3MRuYg', t: 'Antidote', s: 'Rodeo' },
    { id: 'B9synWjqBn8', t: 'FE!N', s: 'ft. Playboi Carti · UTOPIA' },
    { id: '2a8PgqWrc_4', t: 'STARGAZING', s: 'ASTROWORLD' },
    { id: 'YqvCptqhHfs', t: 'STOP TRYING TO BE GOD', s: 'ASTROWORLD' },
    { id: 'BuNBLjJzRoo', t: '90210', s: 'ft. Kacy Hill · Rodeo' },
    { id: 'pildU9lK6vM', t: 'MY EYES', s: 'UTOPIA' },
    { id: 'xl5LunV-OkU', t: 'TELEKINESIS', s: 'ft. SZA, Future · UTOPIA' },
    { id: 'X7aF3nZOS98', t: 'I KNOW ?', s: 'UTOPIA' },
    { id: 'mZDinQ92OZQ', t: 'Pick Up the Phone', s: 'Young Thug & Travis Scott ft. Quavo' },
    { id: '8oaW16lGNxE', t: 'THE SCOTTS', s: 'with Kid Cudi · 2020' },
    { id: '_VRyoaNF9sk', t: 'FRANCHISE', s: 'ft. Young Thug & M.I.A. · 2020' },
    { id: 'LkIS4DpRPHY', t: '4X4', s: 'single · 2025' },
    { id: 'qe-gnV-lvfE', t: 'CAROUSEL', s: 'ASTROWORLD' },
    { id: 'PJWHAiDARMQ', t: 'YOSEMITE', s: 'ASTROWORLD' },
    { id: 'qAlF70MdfwU', t: 'OUT WEST', s: 'JACKBOYS & Travis Scott ft. Young Thug' },
    { id: 'OhXVLFpAAKY', t: 'NO BYSTANDERS', s: 'ASTROWORLD' },
    { id: 'RH9kl6XZixo', t: 'Mamacita', s: 'Days Before Rodeo' },
  ];
  /* ======================= */

  const $ = s => document.querySelector(s);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touch = matchMedia('(hover: none)').matches;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

  /* ================= NHẠC (YouTube, ngẫu nhiên) ================= */
  const tv = $('#tv'), tvMsg = $('#tvMsg'), snd = $('#snd'), tvMin = $('#tvMin'), now = $('#now');
  let yt = null, ytReady = false, ytDead = false, soundOn = false, userMuted = false, gestured = false;
  let bag = [], cur = -1, errStreak = 0;
  const pickNext = () => {
    if (!bag.length){ bag = TRACKS.map((_, i) => i).filter(i => i !== cur); for (let i = bag.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; } }
    return bag.pop();
  };
  function nowUI(){
    const tr = TRACKS[cur];
    now.innerHTML = '<i aria-hidden="true">♪</i>' + (tr ? esc(tr.t) : 'travis.fm');
    now.title = tr ? tr.t + ' — ' + tr.s : '';
    document.querySelectorAll('#pList button').forEach(b => b.setAttribute('aria-current', String(+b.dataset.i === cur)));
  }
  function sndUI(){ snd.textContent = soundOn ? 'on' : 'off'; snd.setAttribute('aria-pressed', soundOn); tv.classList.toggle('on', soundOn); }
  function noSignal(txt){ ytDead = true; soundOn = false; tv.classList.add('dead'); tvMsg.innerHTML = 'no signal<small>' + txt + '</small>'; sndUI(); }
  function soundUp(){ if (!ytReady || ytDead) return; yt.unMute(); yt.setVolume(80); yt.playVideo(); soundOn = true; sndUI(); }
  function soundDown(){ if (ytReady) yt.mute(); soundOn = false; sndUI(); }
  function play(i){
    cur = i; nowUI();
    if (ytReady) yt.loadVideoById(TRACKS[i].id);
    if (gestured && !userMuted) { soundUp(); }
  }
  const playNext = () => play(pickNext());
  cur = pickNext();
  if (location.protocol === 'file:') noSignal('chỉ chạy khi mở qua web');
  else {
    window.onYouTubeIframeAPIReady = () => {
      yt = new YT.Player('yt', {
        videoId: TRACKS[cur].id,
        playerVars: { autoplay: 1, mute: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, modestbranding: 1, playsinline: 1, rel: 0, origin: location.origin },
        events: {
          onReady: e => { ytReady = true; e.target.getIframe().setAttribute('title', 'Nhạc Travis Scott'); e.target.mute(); e.target.playVideo(); if (gestured && !userMuted) soundUp(); },
          onStateChange: e => { if (e.data === YT.PlayerState.PLAYING) errStreak = 0; if (e.data === YT.PlayerState.ENDED) playNext(); },
          onError: () => { if (++errStreak > 4) noSignal('không phát được video'); else setTimeout(playNext, 600); }
        }
      });
    };
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = () => noSignal('không tải được YouTube');
    document.head.appendChild(tag);
    setTimeout(() => { if (!ytReady && !ytDead) noSignal('không tải được YouTube'); }, 15000);
  }
  nowUI();
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, e => {
    if (e.target.closest && e.target.closest('#snd')) return;
    gestured = true;
    if (!userMuted && !soundOn) soundUp();
  }, true));
  snd.addEventListener('click', () => { gestured = true; if (soundOn){ userMuted = true; soundDown(); } else { userMuted = false; soundUp(); } });
  $('#shuffle').addEventListener('click', () => { userMuted = false; playNext(); });
  function setMin(m){
    tv.classList.toggle('min', m);
    tvMin.textContent = m ? '▢' : '–';
    tvMin.setAttribute('aria-expanded', !m);
    tvMin.setAttribute('aria-label', m ? 'Mở lại màn hình' : 'Thu nhỏ màn hình');
    try { localStorage.setItem('travis-tv-min', m ? '1' : '0'); } catch (e) {}
  }
  let startMin = false; try { startMin = localStorage.getItem('travis-tv-min') === '1'; } catch (e) {}
  setMin(startMin);
  tvMin.addEventListener('click', () => setMin(!tv.classList.contains('min')));

  /* danh sách bài */
  const LABELS = ['#ff7a1a', '#e8cfa6', '#c0392b', '#7a4a2a', '#d9a441', '#8a5cff', '#4f7a3a'];
  $('#pList').innerHTML = TRACKS.map((tr, i) => `<li><button data-i="${i}" aria-current="false"><span class="n">${String(i + 1).padStart(2, '0')}</span><span class="vinyl" style="--c:${LABELS[i % LABELS.length]}"></span><span class="t"><b>${esc(tr.t)}</b><small>${esc(tr.s)}</small></span></button></li>`).join('');
  $('#pSub').textContent = TRACKS.length + ' bài · bấm một bài để phát · còn lại phát ngẫu nhiên';
  const panel = $('#panel');
  let panelOpen = false, panelReturn = null;
  function openPanel(){ if (panelOpen) return; panelOpen = true; panelReturn = document.activeElement; panel.classList.add('open'); nowUI(); const c = panel.querySelector('[aria-current="true"]') || panel.querySelector('button[data-i]'); c && c.focus({ preventScroll: true }); c && c.scrollIntoView({ block: 'center' }); }
  function closePanel(){ if (!panelOpen) return; panelOpen = false; panel.classList.remove('open'); if (panelReturn && panelReturn.focus) panelReturn.focus({ preventScroll: true }); }
  $('#listBtn').addEventListener('click', openPanel);
  $('#pClose').addEventListener('click', closePanel);
  $('#pBg').addEventListener('click', closePanel);
  $('#pList').addEventListener('click', e => { const b = e.target.closest('button[data-i]'); if (!b) return; userMuted = false; gestured = true; play(+b.dataset.i); closePanel(); });
  addEventListener('keydown', e => { if (e.key === 'Escape' && panelOpen) closePanel(); });

  /* gợi ý */
  const hint = $('#hint');
  hint.textContent = touch ? 'kéo để nhìn quanh · chạm sàn để đi · chạm đồ vật' : 'kéo để nhìn quanh · bấm sàn để đi tới · bấm vào đồ vật';
  setTimeout(() => { $('#intro').classList.add('out'); hint.classList.add('on'); setTimeout(() => hint.classList.remove('on'), 9000); }, reduce ? 600 : 2600);

  /* ================= CẢNH 3D ================= */
  const canvas = $('#scene');
  let renderer = null;
  try {
    if (!window.THREE) throw new Error('no three');
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  } catch (e) { document.body.classList.add('no-gl'); return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));

  const T = THREE;
  const scene = new T.Scene();
  const FOG = new T.Color('#160c0a');
  scene.background = FOG;
  scene.fog = new T.FogExp2(FOG, 0.03);
  const camera = new T.PerspectiveCamera(70, 1, 0.05, 140);
  camera.rotation.order = 'YXZ';

  // kích thước phòng
  const XW = 8, ZF = -14, ZB = 6, H = 7, EYE = 1.65;
  const STAGE_Z = -8.2, STAGE_H = 1.0;
  const WALK = { x0: -6.6, x1: 6.6, z0: -7.4, z1: 5.0 };

  /* ---------- tiện ích vẽ texture ---------- */
  function cTex(w, h, draw, rep){
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); draw(g, w, h);
    const t = new T.CanvasTexture(c); t.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
    if (rep){ t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
    t._draw = () => { g.clearRect(0, 0, w, h); draw(g, w, h); t.needsUpdate = true; };
    return t;
  }
  const texts = [];   // texture có chữ: vẽ lại khi font Anton tải xong
  const fit = (g, text, maxW, px, fam) => { let f = px; do { g.font = `${f}px ${fam}`; f -= 2; } while (f > 8 && g.measureText(text).width > maxW); };
  const ANTON = 'Anton, Impact, sans-serif';

  EMIT.forEach(x => add(new T.BoxGeometry(.42, .3, .42), M.black, x, STAGE_H + .15, STAGE_Z - .5, stage));
  const NP = 380, parts = [], jets = [];
  const flameMat = () => new T.SpriteMaterial({ map: glowTex, color: '#ffb050', transparent: true, blending: T.AdditiveBlending, depthWrite: false, fog: false });
  for (let i = 0; i < NP; i++){ const s = new T.Sprite(flameMat()); s.visible = false; scene.add(s); parts.push({ s, life: 0, max: 1, v: new T.Vector3() }); }
  let pi = 0;
  function spark(x, power){
    const p = parts[pi = (pi + 1) % NP];
    p.life = p.max = .4 + Math.random() * .38;
    p.s.position.set(x + (Math.random() - .5) * .16, STAGE_H + .32, STAGE_Z - .5 + (Math.random() - .5) * .16);
    p.v.set((Math.random() - .5) * .6, 6.2 + Math.random() * 2.4 * power, (Math.random() - .5) * .6);
    p.s.visible = true;
  }
  function fire(x, power){ jets.push({ x, power, until: performance.now() / 1000 + .55 * power }); }
  let flash = 0;
  function burst(){ EMIT.forEach((x, i) => setTimeout(() => fire(x, 1.2), i * 90)); flash = 1; }
  hot(stageBox, 'STAGE · bắn lửa 🔥', burst);
  const smokes = [];
  for (let i = 0; i < 12; i++){
    const s = new T.Sprite(new T.SpriteMaterial({ map: smokeTex, color: '#c9a08a', transparent: true, opacity: .32, depthWrite: false }));
    s.scale.set(5, 3, 1); s.position.set(-6 + Math.random() * 12, STAGE_H + .4 + Math.random() * 1.2, -12 + Math.random() * 3.6);
    scene.add(s); smokes.push({ s, sp: .1 + Math.random() * .2, ph: Math.random() * 6 });
  }

  /* ================= ĐIỀU KHIỂN ================= */
  const view = { x: 0, z: 4.4, yaw: 0, pitch: .05 };
  let tween = null, ride = null;
  function glide(to, dur){
    const from = { x: view.x, z: view.z, yaw: view.yaw, pitch: view.pitch };
    let dy = to.yaw - from.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
    tween = { from, to: Object.assign({}, to, { yaw: from.yaw + dy }), t0: performance.now(), dur: reduce ? 1 : dur };
  }
  function walkTo(x, z){
    x = clamp(x, WALK.x0, WALK.x1); z = clamp(z, WALK.z0, WALK.z1);
    const d = Math.hypot(x - view.x, z - view.z);
    glide({ x, z, yaw: view.yaw, pitch: view.pitch }, clamp(d * 260, 500, 2200));
  }
  function focusOn(x, z, yaw, pitch){ glide({ x: clamp(x, WALK.x0, WALK.x1), z: clamp(z, WALK.z0, WALK.z1), yaw, pitch }, 1300); }

  // xoay hướng nhìn bằng kéo, đi bằng bấm sàn / con lăn / phím
  const ray = new T.Raycaster(), ndc = new T.Vector2();
  const tag = $('#tag');
  let down = null, hoverObj = null;
  function pick(cx, cy){
    ndc.set(cx / innerWidth * 2 - 1, -(cy / innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hits = ray.intersectObjects(interactive.concat([floor, rug]), false);
    return hits[0] || null;
  }
  canvas.addEventListener('pointerdown', e => {
    if (ride){ endRide(); return; }
    down = { x: e.clientX, y: e.clientY, yaw: view.yaw, pitch: view.pitch, moved: false, id: e.pointerId };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    if (down && e.pointerId === down.id){
      const dx = e.clientX - down.x, dy = e.clientY - down.y;
      if (!down.moved && Math.hypot(dx, dy) > 6){ down.moved = true; canvas.classList.add('drag'); tween = null; tag.classList.remove('on'); }
      if (down.moved){
        const k = (touch ? 2.6 : 3.2) / innerWidth * (camera.fov / 70);
        view.yaw = down.yaw + dx * k;
        view.pitch = clamp(down.pitch + dy * k * .8, -.55, .7);
      }
      return;
    }
    if (e.pointerType !== 'mouse' || ride) return;
    const h = pick(e.clientX, e.clientY);
    const o = h && h.object.userData.tag ? h.object : null;
    hoverObj = o;
    canvas.classList.toggle('point', !!o);
    if (o){ tag.textContent = o.userData.tag; tag.style.transform = `translate(${e.clientX + 14}px, ${e.clientY + 16}px)`; tag.classList.add('on'); }
    else tag.classList.remove('on');
  });
  const endDrag = e => {
    if (!down || e.pointerId !== down.id) return;
    const wasMoved = down.moved; down = null; canvas.classList.remove('drag');
    if (wasMoved || e.type === 'pointercancel') return;
    const h = pick(e.clientX, e.clientY);
    if (!h) return;
    if (h.object.userData.act){ h.object.userData.act(h); if (touch){ tag.textContent = h.object.userData.tag; tag.style.transform = `translate(${clamp(e.clientX - 60, 8, innerWidth - 200)}px, ${e.clientY - 46}px)`; tag.classList.add('on'); clearTimeout(tag._t); tag._t = setTimeout(() => tag.classList.remove('on'), 1600); } }
    else walkTo(h.point.x, h.point.z);
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('wheel', e => {
    e.preventDefault(); if (ride) return; tween = null;
    const s = clamp(-e.deltaY * .006, -.9, .9);
    view.x = clamp(view.x - Math.sin(view.yaw) * s, WALK.x0, WALK.x1);
    view.z = clamp(view.z - Math.cos(view.yaw) * s, WALK.z0, WALK.z1);
  }, { passive: false });
  const keys = new Set();
  addEventListener('keydown', e => { if (panelOpen || e.target.closest && e.target.closest('button,a')) return; if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd', 'W', 'A', 'S', 'D'].includes(e.key)){ keys.add(e.key.toLowerCase()); e.preventDefault(); if (ride) endRide(); } });
  addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
  addEventListener('blur', () => keys.clear());

  // đi tàu lượn: camera chạy hết một vòng
  const rideNote = $('#rideNote');
  function startRide(){
    if (ride) return;
    tween = null; tag.classList.remove('on');
    ride = { t0: performance.now(), u0: trainU, back: { x: view.x, z: view.z, yaw: view.yaw, pitch: view.pitch } };
    document.body.classList.add('riding');
  }
  function endRide(){
    if (!ride) return;
    const b = ride.back; ride = null; document.body.classList.remove('riding');
    camera.up.set(0, 1, 0);
    view.x = b.x; view.z = b.z; view.yaw = b.yaw; view.pitch = b.pitch;
  }
  addEventListener('keydown', e => { if (e.key === 'Escape' && ride) endRide(); });

  /* ================= VÒNG LẶP ================= */
  function resize(){
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.fov = w / h < 1 ? 82 : 70; camera.updateProjectionMatrix();
  }
  resize(); addEventListener('resize', resize);
  if (document.fonts && document.fonts.load){
    Promise.all([document.fonts.load('64px Anton'), document.fonts.load('22px VT323')]).then(() => texts.forEach(t => t._draw())).catch(() => {});
  }

  let last = performance.now(), nextFire = 4, ledAcc = 0;
  const tmpQ = new T.Quaternion();
  function frame(now){
    requestAnimationFrame(frame);
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const t = now / 1000, speed = reduce ? .25 : 1;

    // camera
    if (keys.size && !ride){
      tween = null;
      const f = (keys.has('arrowup') || keys.has('w') ? 1 : 0) - (keys.has('arrowdown') || keys.has('s') ? 1 : 0);
      const r = (keys.has('arrowright') || keys.has('d') ? 1 : 0) - (keys.has('arrowleft') || keys.has('a') ? 1 : 0);
      view.yaw -= r * dt * 1.6;
      view.x = clamp(view.x - Math.sin(view.yaw) * f * dt * 3.2, WALK.x0, WALK.x1);
      view.z = clamp(view.z - Math.cos(view.yaw) * f * dt * 3.2, WALK.z0, WALK.z1);
    }
    if (tween){
      const k = clamp((now - tween.t0) / tween.dur, 0, 1), e = ease(k);
      view.x = lerp(tween.from.x, tween.to.x, e); view.z = lerp(tween.from.z, tween.to.z, e);
      view.yaw = lerp(tween.from.yaw, tween.to.yaw, e); view.pitch = lerp(tween.from.pitch, tween.to.pitch, e);
      if (k >= 1) tween = null;
    }

    // tàu lượn
    const trainSpeed = .045 * speed;
    if (ride){
      const k = (now - ride.t0) / 1000;
      const u = ride.u0 + k * .06;
      trainU = u;
      if (k * .06 >= 1) endRide();
    } else trainU += dt * trainSpeed * (1 + .6 * (1 - clamp(frameAt(trainU).p.y / H, 0, 1)));
    train.forEach((car, k) => placeCar(car, trainU - k * (1.0 / TL)));

    if (ride){
      const f = frameAt(trainU + .4 / TL);
      camera.position.copy(f.p).add(f.n.clone().multiplyScalar(.75));
      camera.up.copy(f.n);
      camera.lookAt(f.p.clone().add(f.t.clone().multiplyScalar(3)).add(f.n.clone().multiplyScalar(.55)));
    } else {
      camera.position.set(view.x, EYE, view.z);
      camera.rotation.set(-view.pitch, view.yaw, 0, 'YXZ');
    }

    // đèn moving head
    heads.forEach((h, i) => {
      h.pivot.rotation.z = Math.sin(t * .7 * speed + h.ph) * .45;
      h.pivot.rotation.x = Math.sin(t * .53 * speed + h.ph * 1.7) * .3 - .15;
      h.cone.material.uniforms.uI.value = .38 + .2 * Math.max(0, Math.sin(t * 2.2 * speed + i));
    });

    // lửa
    if (!reduce && t > nextFire){ const i = Math.floor(Math.random() * EMIT.length); fire(EMIT[i], 1); if (Math.random() < .5) fire(EMIT[(i + 2) % 4], 1); if (Math.random() < .2) burst(); nextFire = t + 5 + Math.random() * 6; }
    for (let j = jets.length - 1; j >= 0; j--){
      const jt = jets[j];
      if (t > jt.until){ jets.splice(j, 1); continue; }
      const n = Math.max(1, Math.round(dt * 120));
      for (let k = 0; k < n; k++) spark(jt.x, jt.power);
    }
    parts.forEach(p => {
      if (p.life <= 0) return;
      p.life -= dt;
      if (p.life <= 0){ p.s.visible = false; return; }
      const a = p.life / p.max;
      p.v.y -= dt * 3; p.v.x *= .98; p.s.position.addScaledVector(p.v, dt);
      const sc = .2 + (1 - a) * .85; p.s.scale.set(sc, sc * 1.35, 1);
      p.s.material.color.setRGB(1, .25 + .7 * a * a, .05 + .35 * a * a * a);
      p.s.material.opacity = Math.min(1, a * 1.8) * .9;
    });
    flash = Math.max(0, flash - dt * 1.5);
    stageWash.intensity = 2.6 + flash * 6 + (jets.length ? 2.2 : 0);

    smokes.forEach(s => { s.s.position.x += Math.sin(t * s.sp + s.ph) * dt * .15; s.s.material.opacity = .22 + .1 * Math.sin(t * .4 + s.ph); });

    // áo đung đưa, giày xoay, mâm đĩa quay
    shirts.forEach(s => { s.v += (-s.a * 9 - s.v * 1.6) * dt; s.a += s.v * dt; s.piv.rotation.x = s.a * .35; });
    shoes.forEach(s => { if (s.spin > 0){ s.spin = Math.max(0, s.spin - dt * .6); s.piv.rotation.y = (1 - s.spin) * Math.PI * 2 * ease(1 - s.spin); if (!s.spin) s.piv.rotation.y = 0; } });
    plat.forEach(v => { v.rotation.y -= dt * 3.4 * (soundOn ? 1 : .2); });
    trophies.forEach((g, i) => { g.rotation.y = Math.sin(t * .5 + i) * .4; });

    // màn LED (≈30 khung hình/giây)
    ledAcc += dt; if (ledAcc > 1 / 30){ ledAcc = 0; drawLED(t * speed); }

    renderer.render(scene, camera);
  }
  drawLED(0);
  requestAnimationFrame(frame);
  window.__travis = { startRide, endRide, burst, view, playNext, openPanel, closePanel, get cur(){ return cur; } };
})();
</script>
</body>
</html>
