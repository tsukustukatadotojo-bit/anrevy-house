<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>⌈ＲＥＤ　ＲＯＯＭ⌋</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Patrick+Hand&amp;family=VT323&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../engine.css">
<style>
  :root{--gold:#f2a65a;--cream:#ffe9d6;--dim:#e0b99a;--panel:rgba(44,20,14,.94)}
  body{background:#120806}
  .hud a{background:rgba(30,12,8,.82);box-shadow:0 0 12px rgba(242,166,90,.3)}
  .card{box-shadow:0 0 0 6px rgba(40,16,10,.8),0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(242,120,70,.18)}
  .card h1{color:#ffe2cc;text-shadow:0 0 16px rgba(255,120,80,.6)}

  /* ===== SỔ GHI CHÚ trên bàn làm việc ===== */
  [hidden]{display:none!important}
  .nb{position:fixed;inset:0;z-index:75;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(18,8,4,.66)}
  .nb.open{display:flex}
  .paper{position:relative;width:min(560px,100%);max-height:min(88vh,820px);display:flex;flex-direction:column;border-radius:6px 14px 14px 6px;overflow:hidden;
    background:#fbf3e4;color:#3a2418;box-shadow:-10px 0 0 #b5532e,-14px 0 0 #8a3a1e,0 24px 60px rgba(0,0,0,.6);font-family:'Patrick Hand','Fredoka',cursive}
  .paper::before{content:'';position:absolute;left:42px;top:0;bottom:0;width:2px;background:rgba(220,90,80,.45);pointer-events:none}
  .pg-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px 58px;border-bottom:2px dashed rgba(181,83,46,.35)}
  .pg-head h2{flex:1;font:400 28px/1 'Patrick Hand',cursive;color:#8a3a1e}
  .pg-head small{display:block;font-size:15px;color:#9a6a4a;margin-top:2px}
  .x{width:36px;height:36px;border-radius:50%;cursor:pointer;border:2px solid #b5532e;background:#fff7ec;color:#b5532e;font:700 16px Fredoka,sans-serif}
  .x:hover,.x:focus-visible{background:#b5532e;color:#fff;outline:none}
  .pg-body{flex:1;overflow:auto;overscroll-behavior:contain;padding:8px 18px 18px 58px;
    background:repeating-linear-gradient(180deg,transparent 0 31px,rgba(80,120,190,.18) 31px 32px)}
  .lockv{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 0 10px;text-align:center}
  .lockv .pad{font-size:48px;line-height:1}
  .lockv p{font-size:20px;color:#6a4028}
  .dots{display:flex;gap:12px;margin:2px 0 4px}
  .dots i{width:16px;height:16px;border-radius:50%;border:2px solid #8a3a1e}
  .dots i.on{background:#8a3a1e}
  .keys{display:grid;grid-template-columns:repeat(3,62px);gap:10px}
  .keys button{height:52px;border-radius:12px;cursor:pointer;border:2px solid #d9a07a;background:#fff;color:#5a2c18;font:400 26px 'Patrick Hand',cursive}
  .keys button:hover,.keys button:focus-visible{background:#ffe6cf;outline:none;border-color:#b5532e}
  .pin-err{min-height:22px;color:#c0392b;font-size:18px}
  .shake{animation:shake .4s}
  .note-item{position:relative;padding:12px 0 14px;border-bottom:1px dashed rgba(181,83,46,.35)}
  .note-item p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:21px;line-height:32px}
  .note-item .sig{display:block;text-align:right;font-size:21px;color:#8a3a1e}
  .note-item .meta{display:block;text-align:right;font:400 13px Fredoka,sans-serif;color:#a07a5a}
  .note-item .del{position:absolute;right:0;top:10px;border:0;background:none;cursor:pointer;color:#c0392b;font:600 13px Fredoka,sans-serif}
  .empty{padding:18px 0;font-size:21px;color:#9a6a4a}
  .write{padding:12px 18px 14px 58px;border-top:2px dashed rgba(181,83,46,.35);background:#f6e8d2}
  .write label{display:block;font-size:19px;color:#8a3a1e;margin-bottom:4px}
  .write textarea{width:100%;min-height:96px;max-height:40vh;resize:vertical;padding:6px 10px;border-radius:8px;border:2px solid #d9a07a;background:#fffdf8;color:#3a2418;font:400 21px/28px 'Patrick Hand',cursive;outline:none}
  .write input{width:100%;height:44px;padding:0 12px;border-radius:8px;border:2px solid #d9a07a;background:#fffdf8;color:#3a2418;font:400 22px 'Patrick Hand',cursive;outline:none}
  .write textarea:focus,.write input:focus{border-color:#b5532e}
  .wrow{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;align-items:center}
  .wrow small{flex:1;font:400 13px Fredoka,sans-serif;color:#a07a5a}
  .wbtn{height:42px;padding:0 18px;border-radius:10px;cursor:pointer;border:0;background:#b5532e;color:#fff;font:600 16px Fredoka,sans-serif}
  .wbtn.alt{background:#fff;color:#8a3a1e;border:2px solid #d9a07a}
  .wbtn:hover,.wbtn:focus-visible{filter:brightness(1.08);outline:2px solid #8a3a1e;outline-offset:2px}
  .wbtn[disabled]{opacity:.6}
  .werr{color:#c0392b;font:500 14px Fredoka,sans-serif;min-height:18px;margin-top:4px}
  @media (max-width:520px){ .paper::before{left:22px} .pg-head,.pg-body,.write{padding-left:34px} .keys{grid-template-columns:repeat(3,56px)} }
</style>
</head>
<body>
  <!-- SỔ GHI CHÚ -->
  <div class="nb" id="nb" role="dialog" aria-modal="true" aria-labelledby="nbTitle">
    <div class="paper" id="paper">
      <div class="pg-head"><h2 id="nbTitle">Sổ ghi chú<small id="nbSub">luôn khoá · ghi chú tự xoá sau 2 ngày</small></h2><button class="x" id="nbClose" aria-label="Đóng sổ">✕</button></div>
      <div class="pg-body" id="nbBody">
        <div class="lockv" id="nbLock">
          <div class="pad" aria-hidden="true">🔒</div>
          <p>Sổ đang khoá. Nhập mật khẩu 4 số.</p>
          <div class="dots" id="pinDots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <input id="pinIn" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Mật khẩu sổ ghi chú" style="position:absolute;opacity:0;width:1px;height:1px">
          <div class="keys" id="pinKeys"></div>
          <div class="pin-err" id="pinErr" role="alert"></div>
        </div>
        <div id="nbList" hidden></div>
      </div>
      <form class="write" id="nbWrite" hidden autocomplete="off">
        <div id="wStep1">
          <label for="nbText">Viết ghi chú mới</label>
          <textarea id="nbText" placeholder="Viết gì cũng được, dài bao nhiêu cũng được…"></textarea>
          <div class="wrow"><small>Ghi chú tự xoá sau 2 ngày.</small><button class="wbtn" type="button" id="wDone">Viết xong</button></div>
        </div>
        <div id="wStep2" hidden>
          <label for="nbName">Để lại tên của bạn</label>
          <input id="nbName" maxlength="40" placeholder="Tên người viết">
          <div class="wrow"><button class="wbtn alt" type="button" id="wBack">← Sửa lại</button><button class="wbtn" type="submit" id="wSave">Ký tên &amp; lưu</button></div>
        </div>
        <div class="werr" id="wErr" role="alert"></div>
      </form>
    </div>
  </div>
<script>
/* ===== PHÒNG SAU BỨC TRANH ĐỎ — phòng ngủ ấm áp + phòng tắm bên phải (phần chung nằm ở ../engine.js) ===== */
(() => {
  const W = 1800, H = 900;
  const FL = { x0: 40, y0: 170, x1: 1060, y1: 860 };            // sàn phòng ngủ
  const BF = { x0: 1110, y0: 170, x1: 1760, y1: 860 };          // sàn phòng tắm
  const GAP = { y0: 490, y1: 610 };                             // cửa thông giữa phòng ngủ và phòng tắm
  const DOOR = { x0: 150, x1: 270 };
  const BED = { x0: 440, y0: 170, x1: 680, y1: 470 };
  const LAMP = { x: 393, y: 192 };
  const PLAYER = { x: 1020, y: 410 };
  const WIN = { x: 110, y: 18, w: 190, h: 104 };                // cửa sổ có trăng
  const CHAIRS = [168, 268];                                    // 2 ghế ngắm trăng dưới cửa sổ
  const SINKS = [{ x: 1230, y: 208, ax: 1230, ay: 304 }, { x: 1330, y: 208, ax: 1330, ay: 304 }, { x: 1154, y: 352, ax: 1244, ay: 352, side: true }];
  const STALL = { x0: 1404, x1: 1536, y1: 338, door: 210 };     // buồng vệ sinh
  const TUB = { x0: 1556, x1: 1752, y0: 176, y1: 318 };         // bồn tắm
  const WASH = { x0: 1664, x1: 1752, y0: 636, y1: 770 };        // máy giặt
  // dây đèn nháy trên tường
  const BULBS = Array.from({ length: 24 }, (_, i) => { const x = 60 + i * 42; return { x, y: 26 + Math.sin(i * 1.1) * 3 + (i % 2) * 14, c: ['#ffd27a', '#ff9a6a', '#ffe9b0', '#ffb3c7'][i % 4], ph: i * 1.7 }; });
  const STARS = Array.from({ length: 30 }, (_, i) => ({ x: WIN.x + 4 + ((i * 73) % 182), y: WIN.y + 4 + ((i * 37) % 66), r: .7 + (i % 3) * .45, ph: i * 1.3 }));

  /* ================= NỀN TĨNH ================= */
  function drawBG(g, K, S){
    const rr = K.rr; g.setTransform(S, 0, 0, S, 0, 0);
    g.fillStyle = '#140806'; g.fillRect(0, 0, W, H);
    // sàn gỗ màu mật ong (phòng ngủ + bậc cửa thông)
    g.save(); g.beginPath(); g.rect(FL.x0, FL.y0, FL.x1 - FL.x0, FL.y1 - FL.y0); g.rect(FL.x1, GAP.y0, BF.x0 - FL.x1, GAP.y1 - GAP.y0); g.clip();
    const tones = ['#c98a54', '#bf7f4a', '#cf9560', '#c4864f'];
    for (let r = 0, y = FL.y0; y < FL.y1; r++, y += 30){
      let x = FL.x0 - (r % 3) * 70;
      for (let k = 0; x < BF.x0; k++){ const w = 150 + ((r * 7 + k * 13) % 5) * 22; g.fillStyle = tones[(r + k) % 4]; g.fillRect(x, y, w, 30); g.fillStyle = 'rgba(90,40,14,.45)'; g.fillRect(x + w - 2, y, 2, 30); x += w; }
      g.fillStyle = 'rgba(90,40,14,.5)'; g.fillRect(FL.x0, y + 28, BF.x0 - FL.x0, 2);
    }
    for (let i = 0; i < 2600; i++){ g.fillStyle = Math.random() < .5 ? 'rgba(90,40,14,.08)' : 'rgba(255,230,200,.06)'; g.fillRect(FL.x0 + Math.random() * (FL.x1 - FL.x0), FL.y0 + Math.random() * (FL.y1 - FL.y0), 3, 1.5); }
    const sh = g.createLinearGradient(0, FL.y0, 0, FL.y0 + 70); sh.addColorStop(0, 'rgba(40,10,0,.45)'); sh.addColorStop(1, 'rgba(40,10,0,0)'); g.fillStyle = sh; g.fillRect(FL.x0, FL.y0, FL.x1 - FL.x0, 70);
    g.restore();
    // thảm tròn hồng kem
    g.fillStyle = 'rgba(60,20,10,.25)'; g.beginPath(); g.ellipse(566, 632, 236, 142, 0, 0, 7); g.fill();
    g.fillStyle = '#e8b8a0'; g.beginPath(); g.ellipse(560, 624, 236, 142, 0, 0, 7); g.fill();
    g.fillStyle = '#f3d6c2'; g.beginPath(); g.ellipse(560, 624, 206, 118, 0, 0, 7); g.fill();
    g.strokeStyle = '#c9785a'; g.lineWidth = 4; g.setLineDash([10, 9]); g.beginPath(); g.ellipse(560, 624, 190, 106, 0, 0, 7); g.stroke(); g.setLineDash([]);
    for (let i = 0; i < 12; i++){ const a = i / 12 * Math.PI * 2; g.fillStyle = i % 2 ? '#d98a6a' : '#e8a87a'; g.beginPath(); g.ellipse(560 + Math.cos(a) * 120, 624 + Math.sin(a) * 66, 14, 8, a, 0, 7); g.fill(); }
    g.fillStyle = '#d98a6a'; g.beginPath(); g.ellipse(560, 624, 30, 18, 0, 0, 7); g.fill();
    // tường trên: giấy dán tường hoa nhỏ
    const wg = g.createLinearGradient(0, 0, 0, FL.y0); wg.addColorStop(0, '#7a3a26'); wg.addColorStop(1, '#93492e');
    g.fillStyle = wg; g.fillRect(FL.x0, 0, FL.x1 - FL.x0, FL.y0);
    for (let y = 8; y < FL.y0 - 40; y += 22) for (let x = FL.x0 + ((y / 22) % 2) * 14; x < FL.x1; x += 28){ g.fillStyle = 'rgba(255,220,180,.13)'; g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill(); g.fillStyle = 'rgba(255,240,210,.18)'; g.beginPath(); g.arc(x, y, 1.3, 0, 7); g.fill(); }
    g.fillStyle = '#5a2c1a'; g.fillRect(FL.x0, FL.y0 - 40, FL.x1 - FL.x0, 40);
    for (let x = FL.x0 + 10; x < FL.x1 - 40; x += 70){ g.strokeStyle = 'rgba(255,200,150,.18)'; g.lineWidth = 2; g.strokeRect(x, FL.y0 - 34, 58, 26); }
    g.fillStyle = '#7a4228'; g.fillRect(FL.x0, FL.y0 - 42, FL.x1 - FL.x0, 5);
    // tranh nhỏ + cây treo bên phải
    [[790, 36, 64, 50, '#e8a87a'], [866, 24, 48, 64, '#6a8a6a'], [930, 44, 72, 44, '#f3c8a8']].forEach(([x, y, w, h, c]) => { g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(x + 3, y + 4, w, h); g.fillStyle = '#e8d2b0'; g.fillRect(x, y, w, h); g.fillStyle = c; g.fillRect(x + 5, y + 5, w - 10, h - 10); g.fillStyle = 'rgba(255,255,255,.18)'; g.beginPath(); g.arc(x + w / 2, y + h / 2, Math.min(w, h) / 4, 0, 7); g.fill(); });

    drawBathBG(g, K);

    // tường bao + tường ngăn giữa hai phòng (chừa cửa thông)
    g.fillStyle = '#0e0605';
    g.fillRect(0, 0, FL.x0, H); g.fillRect(BF.x1, 0, W - BF.x1, H); g.fillRect(0, FL.y1, W, H - FL.y1);
    g.fillStyle = '#2a1610'; g.fillRect(FL.x1, 0, BF.x0 - FL.x1, GAP.y0); g.fillRect(FL.x1, GAP.y1, BF.x0 - FL.x1, H - GAP.y1);
    g.fillStyle = 'rgba(255,200,150,.07)'; for (let y = 10; y < H; y += 26){ if (y > GAP.y0 - 12 && y < GAP.y1) continue; g.fillRect(FL.x1 + 10, y, BF.x0 - FL.x1 - 20, 2); }
    g.fillStyle = '#3a1e16';
    g.fillRect(FL.x0 - 8, 0, 8, H); g.fillRect(BF.x1, 0, 8, H); g.fillRect(0, FL.y1, W, 8);
    g.fillRect(FL.x1, 0, 8, GAP.y0); g.fillRect(FL.x1, GAP.y1, 8, H - GAP.y1);
    g.fillRect(BF.x0 - 8, 0, 8, GAP.y0); g.fillRect(BF.x0 - 8, GAP.y1, 8, H - GAP.y1);
    // khung cửa thông (bậc gỗ + 2 trụ) và cánh cửa mở áp vào tường phòng tắm
    g.fillStyle = '#7a4228'; g.fillRect(FL.x1 - 2, GAP.y0 - 10, BF.x0 - FL.x1 + 4, 10); g.fillRect(FL.x1 - 2, GAP.y1, BF.x0 - FL.x1 + 4, 10);
    g.fillStyle = '#c98a4a'; g.fillRect(FL.x1, GAP.y0 - 3, BF.x0 - FL.x1, 3); g.fillRect(FL.x1, GAP.y1, BF.x0 - FL.x1, 3);
    g.fillStyle = 'rgba(90,40,14,.35)'; g.fillRect(FL.x1 + 4, GAP.y0, 3, GAP.y1 - GAP.y0); g.fillRect(BF.x0 - 7, GAP.y0, 3, GAP.y1 - GAP.y0);
    g.fillStyle = 'rgba(0,0,0,.3)'; rr(g, BF.x0 + 2, GAP.y1 + 12, 16, 122, 4); g.fill();
    g.fillStyle = '#9a5a32'; rr(g, BF.x0, GAP.y1 + 8, 14, 122, 4); g.fill();
    g.fillStyle = '#b8743e'; rr(g, BF.x0 + 3, GAP.y1 + 14, 8, 110, 3); g.fill();
    g.fillStyle = '#ffd27a'; g.beginPath(); g.arc(BF.x0 + 7, GAP.y1 + 116, 3.4, 0, 7); g.fill();
    // biển nhỏ "phòng tắm" trên trụ cửa
    g.fillStyle = '#f3e2c8'; rr(g, FL.x1 - 6, GAP.y0 - 42, 62, 26, 6); g.fill(); g.strokeStyle = '#b5532e'; g.lineWidth = 2; rr(g, FL.x1 - 6, GAP.y0 - 42, 62, 26, 6); g.stroke();
    g.fillStyle = '#8a3a1e'; g.font = '600 14px Fredoka, sans-serif'; g.textAlign = 'center'; g.fillText('🛁 tắm', FL.x1 + 25, GAP.y0 - 24);
    // khung cửa ra
    g.fillStyle = '#4a2a1a'; g.fillRect(DOOR.x0 - 10, FL.y1 - 4, DOOR.x1 - DOOR.x0 + 20, 48);
    g.fillStyle = '#1a0c06'; g.fillRect(DOOR.x0, FL.y1, DOOR.x1 - DOOR.x0, 40);
    g.fillStyle = '#c98a4a'; g.fillRect(DOOR.x0, FL.y1 - 2, DOOR.x1 - DOOR.x0, 4);
    // đầu giường bọc nệm
    g.fillStyle = 'rgba(0,0,0,.3)'; rr(g, 436, 118, 260, 84, 26); g.fill();
    g.fillStyle = '#c98a3a'; rr(g, 430, 110, 260, 84, 26); g.fill();
    g.fillStyle = '#b07428'; rr(g, 442, 120, 236, 62, 20); g.fill();
    g.fillStyle = '#e0a854'; for (let r = 0; r < 2; r++) for (let c = 0; c < 6; c++){ g.beginPath(); g.arc(468 + c * 37 + (r % 2) * 18, 138 + r * 24, 3.4, 0, 7); g.fill(); }
    // nệm + gối
    g.fillStyle = 'rgba(40,10,0,.3)'; rr(g, 446, 178, 244, 300, 18); g.fill();
    g.fillStyle = '#f6eadb'; rr(g, BED.x0, BED.y0, BED.x1 - BED.x0, BED.y1 - BED.y0, 18); g.fill();
    [[455, 184], [565, 184]].forEach(([x, y]) => { g.fillStyle = 'rgba(120,60,30,.18)'; rr(g, x + 2, y + 4, 100, 54, 18); g.fill(); g.fillStyle = '#fff7ee'; rr(g, x, y, 100, 54, 18); g.fill(); g.strokeStyle = 'rgba(160,100,60,.35)'; g.lineWidth = 2; rr(g, x + 6, y + 6, 88, 42, 14); g.stroke(); });
    // tủ quần áo bên trái
    g.fillStyle = 'rgba(0,0,0,.3)'; rr(g, 46, 256, 92, 244, 8); g.fill();
    g.fillStyle = '#6a3a22'; rr(g, 40, 250, 92, 244, 8); g.fill();
    g.fillStyle = '#7e4a2c'; rr(g, 50, 258, 72, 110, 6); g.fill(); rr(g, 50, 376, 72, 110, 6); g.fill();
    g.fillStyle = '#e0b060'; g.fillRect(112, 350, 4, 30); g.fillRect(112, 384, 4, 30);
    // kệ sách thấp bên trái
    g.fillStyle = 'rgba(0,0,0,.3)'; rr(g, 46, 566, 74, 206, 6); g.fill();
    g.fillStyle = '#7a4428'; rr(g, 40, 560, 74, 206, 6); g.fill();
    const bk = ['#c0392b', '#e8a87a', '#4a6a8a', '#f3d27a', '#6a8a5a', '#8a5a9a', '#e8d2b0'];
    for (let r = 0; r < 3; r++){ g.fillStyle = '#3a1c10'; g.fillRect(48, 570 + r * 66, 58, 58); let y = 574 + r * 66; for (let k = 0; k < 5; k++){ const h = 8 + (k * 3 + r) % 5; g.fillStyle = bk[(k + r * 2) % bk.length]; g.fillRect(52, y, 50, h); y += h + 2; } }
    // bàn trang điểm + gương bên phải
    g.fillStyle = 'rgba(0,0,0,.3)'; rr(g, 978, 266, 80, 206, 8); g.fill();
    g.fillStyle = '#7a4428'; rr(g, 984, 256, 76, 206, 8); g.fill();
    g.fillStyle = '#8e5434'; rr(g, 992, 264, 60, 190, 6); g.fill();
    g.fillStyle = '#c9a07a'; g.beginPath(); g.ellipse(1050, 330, 8, 50, 0, 0, 7); g.fill();
    g.fillStyle = '#bcd8e8'; g.beginPath(); g.ellipse(1050, 330, 5, 44, 0, 0, 7); g.fill();
    [[1004, 290, '#ffb3c7'], [1016, 300, '#f3d27a'], [1006, 438, '#e8a87a']].forEach(([x, y, c]) => { g.fillStyle = c; rr(g, x, y, 10, 14, 3); g.fill(); });
  }

  /* ----- phòng tắm: sàn gạch kem có hoa văn đất nung, tường gạch đào, ống đồng ----- */
  function drawBathBG(g, K){
    const rr = K.rr;
    // sàn gạch
    g.save(); g.beginPath(); g.rect(BF.x0, BF.y0, BF.x1 - BF.x0, BF.y1 - BF.y0); g.clip();

  const PIN_HASH = '731bd7910a649ca290a025307ab8a670a161c844dca64e4abc0744804944c1eb';   // sha256('anrevy-notes:' + mật khẩu)
  const $ = s => document.querySelector(s);
  const b64 = u => { let s = ''; for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode(...u.subarray(i, i + 8192)); return btoa(s); };
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const notes = new Map();       // mã ghi chú -> { at, exp, iv, ct, name?, text? }
  let nbKey = null, KK = null, pin = '';
  const mine = (() => { try { return new Set(JSON.parse(localStorage.getItem('red-notes-mine') || '[]')); } catch (e) { return new Set(); } })();
  const saveMine = () => { try { localStorage.setItem('red-notes-mine', JSON.stringify([...mine].slice(-200))); } catch (e) {} };
  async function sha(s){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b), x => x.toString(16).padStart(2, '0')).join(''); }
  async function deriveKey(p){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(p), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: new TextEncoder().encode('anrevy-red-notes-v1'), iterations: 150000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  function onNote(id, d, K){
    KK = K;
    if (!/^[a-z0-9-]{6,40}$/.test(id)) return;
    if (!d){ notes.delete(id); renderList(); return; }
    const at = +d.at || 0, exp = Math.min(+d.exp || 0, at + NOTE_TTL);
    if (!exp || Date.now() > exp){ notes.delete(id); if (at) K.publish('notes/' + id, null, true); renderList(); return; }   // quá 2 ngày: dọn khỏi máy chủ
    if (typeof d.iv !== 'string' || typeof d.ct !== 'string') return;
    notes.set(id, { at, exp, iv: d.iv, ct: d.ct });
    if (nbKey) decryptAll().then(renderList);
  }
  async function decryptAll(){
    for (const n of notes.values()){
      if (n.text != null || n.bad) continue;
      try { const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(n.iv) }, nbKey, unb64(n.ct)); const o = JSON.parse(new TextDecoder().decode(pt)); n.name = String(o.name || '').slice(0, 40); n.text = String(o.text || ''); }
      catch (e) { n.bad = true; }
    }
  }
  // xoá ghi chú hết hạn kể cả khi không ai mở sổ
  setInterval(() => { const now = Date.now(); for (const [id, n] of notes) if (now > n.exp){ notes.delete(id); if (KK) KK.publish('notes/' + id, null, true); } if (nbKey) renderList(); }, 60000);

  const nb = $('#nb'), nbLock = $('#nbLock'), nbList = $('#nbList'), nbWrite = $('#nbWrite');
  let returnFocus = null;
  $('#pinKeys').innerHTML = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', '✓'].map(k => `<button type="button" data-k="${k}" aria-label="${k === '⌫' ? 'xoá' : k === '✓' ? 'mở' : k}">${k}</button>`).join('');
  function pinUI(){ $('#pinDots').querySelectorAll('i').forEach((el, i) => el.classList.toggle('on', i < pin.length)); }
  async function tryPin(){
    if (pin.length < 4) return;
    if (await sha('anrevy-notes:' + pin) !== PIN_HASH){
      $('#pinErr').textContent = 'Sai mật khẩu rồi.'; pin = ''; pinUI();
      $('#paper').classList.remove('shake'); void $('#paper').offsetWidth; $('#paper').classList.add('shake'); return;
    }
    $('#pinErr').textContent = 'Đang mở sổ…';
    nbKey = await deriveKey(pin); pin = '';
    await decryptAll();
    nbLock.hidden = true; nbList.hidden = false; nbWrite.hidden = false; showStep(1);
    $('#nbSub').textContent = 'mỗi ghi chú tự xoá sau 2 ngày';
    renderList(); setTimeout(() => $('#nbText').focus(), 30);
  }
  $('#pinKeys').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; const k = b.dataset.k; $('#pinErr').textContent = '';
    if (k === '⌫') pin = pin.slice(0, -1); else if (k === '✓') return tryPin(); else if (pin.length < 4) pin += k;
    pinUI(); if (pin.length === 4) tryPin(); });
  $('#pinIn').addEventListener('input', e => { pin = e.target.value.replace(/\D/g, '').slice(0, 4); e.target.value = pin; pinUI(); if (pin.length === 4){ e.target.value = ''; tryPin(); } });
  nb.addEventListener('keydown', e => {
    if (!nbLock.hidden && /^[0-9]$/.test(e.key)){ e.preventDefault(); if (pin.length < 4){ pin += e.key; pinUI(); if (pin.length === 4) tryPin(); } }
    else if (!nbLock.hidden && e.key === 'Backspace'){ e.preventDefault(); pin = pin.slice(0, -1); pinUI(); }
    if (e.key === 'Escape'){ e.preventDefault(); closeNotebook(); }
  });
  function fmtLeft(ms){ const h = Math.max(0, Math.floor(ms / 3600000)); return h >= 24 ? Math.floor(h / 24) + ' ngày ' + (h % 24) + ' giờ' : h ? h + ' giờ' : Math.max(1, Math.ceil(ms / 60000)) + ' phút'; }
  function renderList(){
    if (!nbKey) return;
    const list = [...notes.entries()].filter(([, n]) => n.text != null && Date.now() < n.exp).sort((a, b) => b[1].at - a[1].at);
    nbList.textContent = '';
    if (!list.length){ const p = document.createElement('p'); p.className = 'empty'; p.textContent = 'Chưa có ghi chú nào. Bạn viết dòng đầu tiên nhé.'; nbList.appendChild(p); return; }
    list.forEach(([id, n]) => {
      const div = document.createElement('div'); div.className = 'note-item';
      const p = document.createElement('p'); p.textContent = n.text;
      const sig = document.createElement('span'); sig.className = 'sig'; sig.textContent = '— ' + (n.name || 'ẩn danh');
      const d = new Date(n.at), meta = document.createElement('span'); meta.className = 'meta';
      meta.textContent = 'viết lúc ' + d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' · ' + d.toLocaleDateString('vi-VN') + ' · tự xoá sau ' + fmtLeft(n.exp - Date.now());
      div.append(p, sig, meta);
      if (mine.has(id)){ const x = document.createElement('button'); x.type = 'button'; x.className = 'del'; x.textContent = 'xoá ghi chú của tôi'; x.addEventListener('click', () => { notes.delete(id); mine.delete(id); saveMine(); if (KK) KK.publish('notes/' + id, null, true); renderList(); }); div.appendChild(x); }
      nbList.appendChild(div);
    });
  }
  function showStep(n){ $('#wStep1').hidden = n !== 1; $('#wStep2').hidden = n !== 2; $('#wErr').textContent = ''; }
  $('#wDone').addEventListener('click', () => {
    if (!$('#nbText').value.trim()){ $('#wErr').textContent = 'Viết gì đó trước đã nhé.'; $('#nbText').focus(); return; }
    showStep(2); const nm = $('#nbName'); if (!nm.value && KK) nm.value = KK.profileName || ''; nm.focus(); nm.select();
  });
  $('#wBack').addEventListener('click', () => { showStep(1); $('#nbText').focus(); });
  nbWrite.addEventListener('submit', async e => {
    e.preventDefault();
    const text = $('#nbText').value.replace(/\s+$/, ''), name = $('#nbName').value.replace(/[\u0000-\u001f]/g, '').trim().slice(0, 40);
    if (!name){ $('#wErr').textContent = 'Ghi chú cần có tên người viết.'; $('#nbName').focus(); return; }
    if (!text.trim()){ showStep(1); return; }
    if (!KK){ $('#wErr').textContent = 'Chưa kết nối được máy chủ, thử lại sau nhé.'; return; }
    $('#wSave').disabled = true;
    try {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, nbKey, new TextEncoder().encode(JSON.stringify({ name, text }))));
      const at = Date.now(), id = at.toString(36) + '-' + KK.rid(6);
      KK.publish('notes/' + id, { at, exp: at + NOTE_TTL, iv: b64(iv), ct: b64(ct) }, true);
      notes.set(id, { at, exp: at + NOTE_TTL, iv: b64(iv), ct: b64(ct), name, text });
      mine.add(id); saveMine();
      $('#nbText').value = ''; showStep(1); renderList(); nbList.parentNode.scrollTop = 0;
      KK.toast('Đã lưu ghi chú. Nó sẽ tự xoá sau 2 ngày.');
    } catch (err){ $('#wErr').textContent = 'Không lưu được, thử lại nhé.'; }
    $('#wSave').disabled = false;
  });
  function openNotebook(K){
    KK = K; returnFocus = document.activeElement;
    nbKey = null; pin = ''; pinUI(); $('#pinErr').textContent = '';   // sổ luôn khoá: lần nào mở cũng hỏi mật khẩu
    notes.forEach(n => { delete n.text; delete n.name; delete n.bad; });
    nbLock.hidden = false; nbList.hidden = true; nbWrite.hidden = true;
    $('#nbSub').textContent = 'luôn khoá · ghi chú tự xoá sau 2 ngày';
    nb.classList.add('open'); setTimeout(() => $('#pinIn').focus({ preventScroll: true }), 30);
  }
  function closeNotebook(){
    nb.classList.remove('open'); nbKey = null; pin = '';
    notes.forEach(n => { delete n.text; delete n.name; });
    const r = document.getElementById('room'); if (r) r.focus({ preventScroll: true }); else if (returnFocus) returnFocus.focus();
  }
  $('#nbClose').addEventListener('click', closeNotebook);
  nb.addEventListener('click', e => { if (e.target === nb) closeNotebook(); });
  // tờ giấy nhỏ trên bàn để gợi ý có thể bấm
  window.__notes = { notes, openNotebook: () => openNotebook(KK) };
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="../engine.js"></script>
</body>
