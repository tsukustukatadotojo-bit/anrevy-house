<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Cure · ⌈ＴＨＥ　ＰＯＯＬ⌋</title>
<link rel="icon" href="../../icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="manifest" href="../../site.webmanifest">
<script src="../../desk-check.js" defer></script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anrevy House">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('../../sw.js').catch(function(){})})</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;family=Cormorant+Garamond:ital,wght@1,500&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
  /* THE CURE · THE POOL — một tờ giấy trắng: viết ra, thả xuống nước, để nước cuốn đi. Không có gì được lưu lại.
     Âm thanh chỉ có tiếng sóng và một đoạn piano buồn lặp đi lặp lại. */
  :root{--water:#7fd8e0;--deep:#3e9aa6;--tile:#eef5f4;--grout:#bcd3d2;--ink:#2f5a60;--ink-soft:#5f8d92;--paper:#ffffff;--pen:#22324a}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{background:#0e3b44;color:var(--ink);font-family:'VT323',monospace;-webkit-tap-highlight-color:transparent}
  button,select{font:inherit;color:inherit}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* mặt hồ: gạch men dưới nước + vân sáng (caustics) trôi chậm + gợn mưa vẽ trên canvas */
  .pool{position:fixed;inset:0;overflow:hidden;transition:filter 1.2s ease}
  .pool .tiles{position:absolute;inset:-4%;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.35), transparent 60%),
      linear-gradient(180deg, rgba(127,216,224,.55), rgba(62,154,166,.85)),
      repeating-linear-gradient(0deg, var(--grout) 0 2px, transparent 2px 46px),
      repeating-linear-gradient(90deg, var(--grout) 0 2px, transparent 2px 46px),
      var(--tile);
    animation:sway 14s ease-in-out infinite}
  @keyframes sway{50%{transform:translate(-1.2%,.8%) scale(1.01)}}
  .pool .caus{position:absolute;inset:0;mix-blend-mode:screen;opacity:.55;background-size:420px 420px;animation:causA 22s linear infinite}
  .pool .caus.b{opacity:.4;background-size:560px 560px;animation:causB 31s linear infinite}
  @keyframes causA{to{background-position:420px 840px}}
  @keyframes causB{to{background-position:-1120px 560px}}
  #rain{position:absolute;inset:0;width:100%;height:100%}
  .pool .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center, transparent 50%, rgba(8,40,48,.55) 100%)}
  body.wet .pool{filter:blur(7px) saturate(1.15)}

  /* trang giấy nổi trên mặt nước */
  .stage{position:fixed;inset:0;display:grid;place-items:center;padding:64px 16px 120px;pointer-events:none}
  .paperwrap{position:relative;width:min(560px,92vw);height:min(66vh,620px);pointer-events:auto;animation:bob 6s ease-in-out infinite;transform-origin:50% 60%}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-6px) rotate(.5deg)}}
  .shadow{position:absolute;left:6%;right:6%;bottom:-26px;height:40px;border-radius:50%;background:radial-gradient(ellipse at center, rgba(10,50,60,.45), transparent 70%);filter:blur(6px);transition:opacity .8s}
  .paper{position:absolute;inset:0;background:var(--paper);border-radius:3px;box-shadow:0 2px 0 rgba(0,0,0,.05),0 18px 40px rgba(8,48,58,.35);
    transition:transform 1.1s cubic-bezier(.5,0,.2,1),opacity 1.4s ease,filter 1.6s ease;transform-origin:50% 50%}
  .paper textarea{position:absolute;inset:0;width:100%;height:100%;padding:22px 26px;border:0;outline:0;resize:none;background:transparent;
    font:23px/38px 'Patrick Hand','Cormorant Garamond',cursive;color:var(--pen);transition:color 1.4s ease,filter 1.4s ease,text-shadow 1.4s ease;scrollbar-width:thin;scrollbar-color:#dde9ec transparent}
  .paper .fold{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;background:linear-gradient(180deg, transparent 49.6%, rgba(40,80,90,.18) 50%, transparent 50.4%),linear-gradient(90deg, transparent 49.6%, rgba(40,80,90,.14) 50%, transparent 50.4%)}
  /* chữ nhoè mực rồi tan */
  body.bleed .paper textarea{color:rgba(40,80,140,.35);filter:blur(2.6px);text-shadow:0 0 10px rgba(40,90,160,.55)}
  body.fold .paper .fold{opacity:1}
  body.fold .paper{transform:perspective(900px) rotateX(58deg) scale(.6,.42)}
  body.fold2 .paper{transform:perspective(900px) rotateX(64deg) rotateZ(-8deg) scale(.26,.2)}
  body.drift .paperwrap{animation:none;transition:transform 4s cubic-bezier(.4,.05,.5,1),opacity 4s ease,filter 4s ease;transform:translate(var(--dx,6vw),-40vh) scale(.35) rotate(var(--rot,12deg));opacity:0;filter:blur(3px)}
  body.drift .shadow{opacity:0}
  body.hidepaper .paperwrap{opacity:0;transition:none}
  body.calm .paperwrap{transition:opacity 1.6s ease}

  /* thanh dưới: chép cho Claude · thả xuống nước */
  .acts{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;flex-wrap:wrap;gap:10px;padding:0 16px;transition:opacity .6s}
  .acts button{padding:9px 16px;border:1px solid rgba(255,255,255,.85);border-radius:999px;background:rgba(255,255,255,.72);color:var(--ink);font-size:20px;line-height:1;letter-spacing:.04em;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .acts button:hover,.acts button:focus-visible{background:#fff;outline:none;box-shadow:0 0 16px rgba(255,255,255,.9)}
  .acts .drop{background:rgba(20,80,92,.82);color:#f4feff;border-color:rgba(244,254,255,.7)}
  .acts .drop:hover,.acts .drop:focus-visible{background:#0f5664}
  body.busy .acts,body.busy .hud{opacity:0;pointer-events:none}

  .hud{position:fixed;z-index:5;display:flex;gap:8px;align-items:center;font-size:18px;transition:opacity .6s}
  .hud-tl{top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px))}
  .hud-tr{top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap;justify-content:flex-end}
  .hud a,.hud button,.hud label{padding:4px 12px;border:1px solid rgba(255,255,255,.85);border-radius:999px;background:rgba(255,255,255,.62);color:var(--ink);text-decoration:none;letter-spacing:.06em;cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  .hud a:hover,.hud button:hover,.hud label:hover,.hud a:focus-visible,.hud button:focus-visible{background:#fff;outline:none}
  .hud select{border:0;background:transparent;font-size:18px;color:var(--ink);cursor:pointer}
  .title{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);color:#f4feff;font:italic 500 22px 'Cormorant Garamond',Georgia,serif;letter-spacing:.06em;text-shadow:0 1px 8px rgba(8,48,58,.6);white-space:nowrap;pointer-events:none;transition:opacity .6s}
  body.busy .title{opacity:0}
  .whisper{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#f4feff;font:italic 500 26px 'Cormorant Garamond',Georgia,serif;letter-spacing:.05em;text-shadow:0 1px 10px rgba(8,48,58,.7);opacity:0;transition:opacity 1.4s;pointer-events:none;text-align:center;padding:0 20px}
  .whisper.on{opacity:1}
  .toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:min(520px,90vw);padding:7px 14px;border-radius:12px;background:rgba(255,255,255,.88);color:var(--ink);font-size:18px;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none}
  .toast.on{opacity:1}

  /* gột rửa: sóng / thác đổ ập vào màn hình, rồi giọt nước bám trên kính */
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}

  @media (max-width:640px){
    .title{top:calc(58px + env(safe-area-inset-top,0px));font-size:19px}
    .stage{padding:96px 12px 120px}
    .paper textarea{font-size:20px;padding:18px 20px}
    .hud{font-size:16px}
    .hud select{font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){
    .pool .tiles,.pool .caus,.paperwrap{animation:none}
  }
</style>
</head>
<body>
  <div class="pool" id="pool" aria-hidden="true">
    <div class="tiles"></div><div class="caus" id="causA"></div><div class="caus b" id="causB"></div>
    <canvas id="rain"></canvas><div class="vig"></div>
  </div>

  <div class="hud hud-tl"><a href="../">← the pool</a></div>
  <div class="hud hud-tr">
    <button type="button" id="mute" aria-pressed="false">♪ âm thanh: bật</button>
    <label for="mode">gột rửa: <select id="mode"><option value="random">ngẫu nhiên</option><option value="wave">sóng</option><option value="fall">thác</option></select></label>
  </div>
  <p class="title" aria-hidden="true">The Cure</p>

  <main class="stage">
    <div class="paperwrap" id="wrap">
      <div class="shadow"></div>
      <div class="paper" id="paper">
        <label class="sr" for="letter">Bức thư</label>
        <textarea id="letter" spellcheck="false" autocomplete="off"></textarea>
        <div class="fold"></div>
      </div>
    </div>
  </main>

  <div class="acts">
    <button type="button" id="ask">✦ chép &amp; nói chuyện với Claude</button>
    <button type="button" class="drop" id="drop">thả xuống nước ↓</button>
  </div>
  <p class="whisper" id="whisper" aria-live="polite"></p>
  <p class="toast" id="toast" role="status" aria-live="polite"></p>
  <canvas id="fx" aria-hidden="true"></canvas>

<script>
(() => {
  /* Không lưu gì: không nháp, không bộ nhớ trình duyệt, không gửi lên đâu. Đóng trang là mất. */
  const $ = s => document.querySelector(s);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const letter = $('#letter'), body = document.body;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let toastT = 0;
  const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3200); };

  /* ---------- vân sáng dưới nước (vẽ một lần, lặp liền mạch) ---------- */
  function caustic(n, a, b){
    const c = document.createElement('canvas'); c.width = c.height = n; const g = c.getContext('2d'); const im = g.createImageData(n, n);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++){
      const u = x / n * Math.PI * 2, w = y / n * Math.PI * 2;
      const f1 = Math.sin(a * u + 2 * Math.sin(b * w + u)) + Math.sin(b * w + 1.7 * Math.sin(a * u - w));
      const f2 = Math.sin((a + 1) * u - 2 * Math.sin(w)) + Math.sin((b + 2) * w + 1.3 * Math.sin(2 * u));
      const v = Math.exp(-Math.abs(f1) * 3.2) * .8 + Math.exp(-Math.abs(f2) * 4) * .55;
      const i = (y * n + x) * 4, k = Math.min(255, v * 255);
      im.data[i] = 235; im.data[i + 1] = 255; im.data[i + 2] = 255; im.data[i + 3] = k;
    }
    g.putImageData(im, 0, 0); return c.toDataURL();
  }
  $('#causA').style.backgroundImage = `url(${caustic(160, 3, 2)})`;
  $('#causB').style.backgroundImage = `url(${caustic(160, 2, 3)})`;

  /* ---------- vòng gợn trên mặt nước (chỉ khi trang giấy chạm nước) ---------- */
  const rc = $('#rain'), rg = rc.getContext('2d'); let RW = 0, RH = 0, dpr = 1;
  const ripples = [];
  function size(){ dpr = Math.min(devicePixelRatio || 1, 2); RW = innerWidth; RH = innerHeight; [rc, $('#fx')].forEach(c => { c.width = RW * dpr; c.height = RH * dpr; c.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0); }); }
  addEventListener('resize', size); size();
  let last = performance.now();
  function rainLoop(now){
    requestAnimationFrame(rainLoop);
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    rg.clearRect(0, 0, RW, RH);
    for (let i = ripples.length - 1; i >= 0; i--){
      const p = ripples[i]; p.r += p.s * dt; p.a -= (p.big ? .28 : .42) * dt;
      if (p.a <= 0){ ripples.splice(i, 1); continue; }
      rg.strokeStyle = `rgba(244,254,255,${p.a.toFixed(3)})`; rg.lineWidth = p.big ? 2.4 : 1.2;
      rg.beginPath(); rg.ellipse(p.x, p.y, p.r, p.r * .55, 0, 0, 7); rg.stroke();
      if (p.r > 8){ rg.strokeStyle = `rgba(244,254,255,${(p.a * .5).toFixed(3)})`; rg.beginPath(); rg.ellipse(p.x, p.y, p.r * .6, p.r * .33, 0, 0, 7); rg.stroke(); }
    }
  }
  requestAnimationFrame(rainLoop);
  const splash = (x, y, n = 4) => { for (let k = 0; k < n; k++) ripples.push({ x: x + (Math.random() - .5) * 40, y: y + (Math.random() - .5) * 14, r: 4 + k * 6, a: .9, s: 60 + k * 18, big: true }); };

  /* ---------- âm thanh tự tạo (Web Audio): chỉ có tiếng sóng và một đoạn piano buồn lặp đi lặp lại ---------- */
  let AC = null, master = null, waveG = null, pianoBus = null, muted = false;
  function noiseBuf(sec, brown){
    const b = AC.createBuffer(1, AC.sampleRate * sec, AC.sampleRate), d = b.getChannelData(0); let l = 0;
    for (let i = 0; i < d.length; i++){ const w = Math.random() * 2 - 1; if (brown){ l = (l + .02 * w) / 1.02; d[i] = l * 3.5; } else d[i] = w; }
    return b;
  }
  function loop(buf){ const s = AC.createBufferSource(); s.buffer = buf; s.loop = true; return s; }
  function reverb(sec){
    const n = Math.round(AC.sampleRate * sec), b = AC.createBuffer(2, n, AC.sampleRate);
    for (let c = 0; c < 2; c++){ const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.6); }
    const v = AC.createConvolver(); v.buffer = b; return v;
  }
  // sóng: hai lớp ồn nâu dâng lên rút xuống theo nhịp riêng (khoảng 8 và 13 giây) + chút bọt trắng theo lớp đầu
  function waves(){
    waveG = AC.createGain(); waveG.gain.value = 1; waveG.connect(master);
    [[8.4, 420, .11, 0], [13.1, 680, .07, 3.2]].forEach(([per, fc, amp, delay]) => {
      const src = loop(noiseBuf(6, true)), f = AC.createBiquadFilter(), g = AC.createGain();
      f.type = 'lowpass'; f.frequency.value = fc; g.gain.value = amp * .55;
      const lfo = AC.createOscillator(), lg = AC.createGain(), lf = AC.createGain();
      lfo.frequency.value = 1 / per; lg.gain.value = amp * .45; lf.gain.value = fc * .55;
      lfo.connect(lg).connect(g.gain); lfo.connect(lf).connect(f.frequency);
      src.connect(f).connect(g).connect(waveG); src.start(); lfo.start(AC.currentTime + delay);
      if (!delay){                                             // bọt sóng: tiếng xèo nhẹ khi sóng lên cao
        const fo = loop(noiseBuf(3, false)), bp = AC.createBiquadFilter(), fg2 = AC.createGain(), fl = AC.createGain();
        bp.type = 'bandpass'; bp.frequency.value = 2600; bp.Q.value = .7; fg2.gain.value = .006; fl.gain.value = .006;
        lfo.connect(fl).connect(fg2.gain); fo.connect(bp).connect(fg2).connect(waveG); fo.start();
      }
    });
  }
  // piano: La thứ, chậm (54 nhịp/phút), tay trái rải hợp âm, tay phải một giai điệu đi xuống; 8 ô nhịp lặp mãi
  const BEAT = 60 / 54, BAR = BEAT * 4;
  const CH = [[45, 52, 57, 60], [41, 48, 53, 57], [48, 55, 60, 64], [40, 47, 52, 56], [45, 52, 57, 60], [38, 45, 50, 53], [41, 48, 53, 57], [40, 47, 52, 56]];   // Am F C E Am Dm F E
  const MEL = [
    [[0, 76, 2], [2, 74, 1], [3, 72, 1]], [[0, 72, 2], [2, 71, 1], [3, 69, 1]], [[0, 67, 3], [3, 64, 1]], [[0, 68, 2], [2, 69, 1], [3, 71, 1]],
    [[0, 72, 1.5], [1.5, 71, .5], [2, 69, 1], [3, 64, 1]], [[0, 65, 2], [2, 64, 1], [3, 62, 1]], [[0, 72, 1], [1, 69, 1], [2, 65, 1], [3, 64, 1]], [[0, 68, 3], [3, 71, 1]]
  ];
  const ARP = [0, 1, 2, 3, 2, 1, 2, 1];
  function key(t, m, dur, vel, parts){
    const f = 440 * Math.pow(2, (m - 69) / 12), out = AC.createGain(), lp = AC.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = Math.min(5200, f * 6 + 500); out.gain.value = vel;
    out.connect(lp).connect(pianoBus);
    const tau = 1.6 * Math.pow(262 / f, .5);
    for (let n = 1; n <= parts; n++){
      const fn = f * n * Math.sqrt(1 + .0004 * n * n); if (fn > 7500) break;
      const o = AC.createOscillator(), g = AC.createGain();
      o.frequency.value = fn; o.detune.value = (Math.random() - .5) * 5;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1 / Math.pow(n, 1.45), t + .006);
      g.gain.setTargetAtTime(0, t + .006, tau / Math.pow(n, .6));    // tiếng đàn tắt dần
      g.gain.setTargetAtTime(0, t + dur, .3);                        // nhả pedal
      o.connect(g).connect(out); o.start(t); o.stop(t + dur + 1.8);
    }
  }
  let barIdx = 0, barAt = 0;
  function bar(i, t0){
    const c = CH[i], j0 = (Math.random() - .5) * .01;
    ARP.forEach((k, j) => key(t0 + j * BEAT / 2 + j0 + (Math.random() - .5) * .014, c[k], BAR - j * BEAT / 2 + .25, (j ? .085 : .12) + Math.random() * .02, 4));
    MEL[i].forEach(([b, m, d]) => key(t0 + b * BEAT + (Math.random() - .5) * .025, m, d * BEAT + .4, .2 + Math.random() * .035, 6));
  }
  function pianoTick(){
    if (!AC || muted || AC.state !== 'running') return;
    if (barAt < AC.currentTime) barAt = AC.currentTime + .2;
    while (barAt < AC.currentTime + 1.2){ bar(barIdx % 8, barAt); barIdx++; barAt += BAR; }
  }
  function audioStart(){
    if (AC || muted) { if (AC && AC.state === 'suspended' && !document.hidden) AC.resume(); return; }
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3; comp.connect(AC.destination);
    master = AC.createGain(); master.gain.value = 0; master.connect(comp);
    master.gain.linearRampToValueAtTime(.9, AC.currentTime + 2.5);
    waves();
    pianoBus = AC.createGain(); pianoBus.gain.value = .75;
    const dry = AC.createGain(), wet = AC.createGain(), rv = reverb(3.4);
    dry.gain.value = .7; wet.gain.value = .55;
    pianoBus.connect(dry).connect(master); pianoBus.connect(rv).connect(wet).connect(master);
    barAt = AC.currentTime + 1.2; pianoTick();
    setInterval(pianoTick, 200);
  }
  document.addEventListener('visibilitychange', () => { if (!AC) return; if (document.hidden) AC.suspend(); else if (!muted) AC.resume(); });
  function burst(sec, peak, freq0, freq1, attack){            // sóng ập / thác: một luồng ồn lớn rồi tắt dần
    if (!AC || muted) return;
    const t = AC.currentTime, s = AC.createBufferSource(); s.buffer = noiseBuf(sec + .5, true);
    const w = AC.createBufferSource(); w.buffer = noiseBuf(sec + .5, false);
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(freq0, t); f.frequency.exponentialRampToValueAtTime(freq1, t + sec);
    const g = AC.createGain(), wg = AC.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + sec);
    wg.gain.value = .18; s.connect(f); w.connect(wg).connect(f); f.connect(g).connect(master); s.start(t); w.start(t); s.stop(t + sec + .4); w.stop(t + sec + .4);
  }
  function lap(sec){ if (waveG && !muted){ const t = AC.currentTime; waveG.gain.cancelScheduledValues(t); waveG.gain.setValueAtTime(waveG.gain.value, t); waveG.gain.linearRampToValueAtTime(2.2, t + .8); waveG.gain.linearRampToValueAtTime(1, t + sec); } }
  ['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, audioStart, { passive: true }));
  $('#mute').addEventListener('click', () => {
    muted = !muted; $('#mute').setAttribute('aria-pressed', String(muted)); $('#mute').textContent = muted ? '♪ âm thanh: tắt' : '♪ âm thanh: bật';
    if (AC){ if (!muted && AC.state === 'suspended') AC.resume(); master.gain.cancelScheduledValues(AC.currentTime); master.gain.setTargetAtTime(muted ? 0 : .9, AC.currentTime, .15); }
    else if (!muted) audioStart();
  });

  /* ---------- nói chuyện với Claude: chỉ chép vào bộ nhớ tạm và mở Claude ở thẻ mới ---------- */
  $('#ask').addEventListener('click', async () => {
    const v = letter.value.trim(); if (!v){ letter.focus(); toast('viết gì đó trước đã'); return; }
    let ok = false; try { await navigator.clipboard.writeText(v); ok = true; } catch (e) {}
    window.open('https://claude.ai/new' + (v.length < 1800 ? '?q=' + encodeURIComponent(v) : ''), '_blank', 'noopener');
    toast(ok ? 'đã chép bức thư — dán vào Claude nếu ô chat còn trống' : 'đã mở Claude');
  });

  /* ---------- thả xuống nước → trôi đi → gột rửa → yên lặng ---------- */
  const fx = $('#fx'), fg = fx.getContext('2d');
  function anim(ms, draw){ return new Promise(res => { const t0 = performance.now(); (function f(now){ const k = Math.min(1, (now - t0) / ms); draw(k, now); if (k < 1) requestAnimationFrame(f); else res(); })(t0); }); }
  async function wave(){
    burst(3.2, 1.1, 2200, 260, .7);
    await anim(1500, k => {                                   // tường nước dâng từ dưới lên, ngọn sóng bạc đầu
      fg.clearRect(0, 0, RW, RH);
      const e = k * k * (3 - 2 * k), top = RH * (1.15 - e * 1.45);
      const gr = fg.createLinearGradient(0, top, 0, RH); gr.addColorStop(0, 'rgba(210,250,252,.95)'); gr.addColorStop(.12, 'rgba(90,190,204,.96)'); gr.addColorStop(1, 'rgba(20,90,108,.98)');
      fg.fillStyle = gr; fg.beginPath(); fg.moveTo(0, RH);
      for (let x = 0; x <= RW + 20; x += 20) fg.lineTo(x, top + Math.sin(x / 70 + k * 9) * 18 + Math.sin(x / 23 + k * 17) * 6);
      fg.lineTo(RW, RH); fg.closePath(); fg.fill();
      fg.fillStyle = 'rgba(255,255,255,.85)';
      for (let x = 0; x < RW; x += 9) { const y = top + Math.sin(x / 70 + k * 9) * 18 + Math.sin(x / 23 + k * 17) * 6; fg.beginPath(); fg.arc(x + Math.random() * 6, y - Math.random() * 10, 2 + Math.random() * 5, 0, 7); fg.fill(); }
    });
  }
  async function fall(){
    burst(3.6, .95, 3400, 500, .35);
    const cols = Array.from({ length: Math.ceil(RW / 14) + 2 }, (_, i) => ({ x: i * 14 - 10, d: Math.random() * .35, w: 10 + Math.random() * 14 }));
    await anim(1600, k => {                                   // những dòng thác đổ ập từ trên xuống, phủ kín màn hình
      fg.clearRect(0, 0, RW, RH);
      cols.forEach(c => {
        const kk = Math.max(0, Math.min(1, (k - c.d) / (1 - c.d) * 1.25)); if (!kk) return;
        const h = RH * kk * 1.1, gr = fg.createLinearGradient(0, 0, 0, h);
        gr.addColorStop(0, 'rgba(230,252,255,.92)'); gr.addColorStop(.7, 'rgba(120,205,216,.9)'); gr.addColorStop(1, 'rgba(255,255,255,.95)');
        fg.fillStyle = gr; fg.fillRect(c.x, 0, c.w, h);
      });
      if (k > .55){ fg.fillStyle = `rgba(150,220,228,${((k - .55) / .45 * .92).toFixed(3)})`; fg.fillRect(0, 0, RW, RH); }
    });
  }
  async function wetLens(){                                   // ống kính bị bắn ướt: giọt bám trên kính, chảy xuống, mờ dần
    body.classList.add('wet');
    const drops = Array.from({ length: Math.round(RW * RH / 9000) + 40 }, () => ({ x: Math.random() * RW, y: Math.random() * RH, r: 3 + Math.random() * Math.random() * 22, v: 0, run: Math.random() < .35, trail: [] }));
    await anim(3600, (k, now) => {
      fg.clearRect(0, 0, RW, RH);
      if (k < .25){ fg.fillStyle = `rgba(150,220,228,${(.92 * (1 - k / .25)).toFixed(3)})`; fg.fillRect(0, 0, RW, RH); }
      const fade = k < .6 ? 1 : 1 - (k - .6) / .4;
      drops.forEach(d => {
        if (d.run){ d.v += .06; d.y += d.v; d.trail.push([d.x, d.y]); if (d.trail.length > 26) d.trail.shift(); d.x += Math.sin(d.y / 30) * .25; }
        if (d.trail.length > 2){ fg.strokeStyle = `rgba(230,250,252,${(.22 * fade).toFixed(3)})`; fg.lineWidth = d.r * .55; fg.lineCap = 'round'; fg.beginPath(); d.trail.forEach(([x, y], i) => i ? fg.lineTo(x, y) : fg.moveTo(x, y)); fg.stroke(); }
        const g = fg.createRadialGradient(d.x - d.r * .3, d.y - d.r * .35, d.r * .1, d.x, d.y, d.r);
        g.addColorStop(0, `rgba(255,255,255,${(.85 * fade).toFixed(3)})`); g.addColorStop(.35, `rgba(200,240,245,${(.25 * fade).toFixed(3)})`); g.addColorStop(.85, `rgba(30,90,105,${(.35 * fade).toFixed(3)})`); g.addColorStop(1, 'rgba(30,90,105,0)');
        fg.fillStyle = g; fg.beginPath(); fg.ellipse(d.x, d.y, d.r, d.r * 1.08, 0, 0, 7); fg.fill();
      });
      if (k > .3) body.classList.remove('wet');
    });
    fg.clearRect(0, 0, RW, RH);
  }
  async function release(){
    if (body.classList.contains('busy')) return;
    if (!letter.value.trim()){ letter.focus(); toast('trang giấy còn trống'); return; }
    audioStart(); letter.blur(); letter.readOnly = true; body.classList.add('busy');
    const r = $('#paper').getBoundingClientRect();
    $('#wrap').style.setProperty('--dx', ((Math.random() - .5) * 30).toFixed(1) + 'vw'); $('#wrap').style.setProperty('--rot', ((Math.random() - .5) * 50).toFixed(0) + 'deg');
    if (reduce){
      body.classList.add('bleed'); await sleep(900);
      $('#wrap').style.transition = 'opacity 1.2s'; $('#wrap').style.opacity = '0'; await sleep(1300);
    } else {
      splash(r.left + r.width / 2, r.bottom - 6, 5); burst(1.2, .25, 1800, 400, .03);   // chạm mặt nước
      body.classList.add('bleed'); await sleep(1400);                                    // chữ nhoè mực
      body.classList.add('fold'); await sleep(1100);                                     // gấp đôi
      body.classList.add('fold2'); await sleep(900);                                     // gấp nhỏ lại
      lap(4.5); body.classList.add('drift'); await sleep(1200); splash(r.left + r.width / 2, r.top + r.height * .2, 3); await sleep(2900);   // trôi xa dần
    }
    letter.value = '';                                                                  // không giữ lại gì
    body.classList.add('hidepaper');
    if (!reduce){
      const m = $('#mode').value, pick = m === 'random' ? (Math.random() < .5 ? 'wave' : 'fall') : m;
      await (pick === 'wave' ? wave() : fall());
      await wetLens();
    } else await sleep(600);
    // yên lặng: mặt hồ phẳng lặng, trang giấy mới
    ['bleed', 'fold', 'fold2', 'drift'].forEach(c => body.classList.remove(c));
    const w = $('#wrap'); w.style.transition = ''; w.style.opacity = '';
    const wh = $('#whisper'); wh.textContent = 'nước đã cuốn đi rồi.'; wh.classList.add('on');
    await sleep(1800);
    body.classList.remove('hidepaper'); body.classList.add('calm'); wh.classList.remove('on');
    await sleep(1600); body.classList.remove('calm', 'busy'); letter.readOnly = false;
  }
  $('#drop').addEventListener('click', release);
  letter.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') release(); });
})();
</script>
</body>
