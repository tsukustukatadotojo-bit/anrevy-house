<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>vy@studio:~$ → đã chuyển nhà</title>
<link rel="canonical" href="https://tsukustukatadotojo-bit.github.io/anvy-studio/">
<link rel="icon" href="/anvy-studio/icons/favicon.ico" sizes="any">
<meta http-equiv="refresh" content="1;url=/anvy-studio/">
<style>
  html,body{height:100%;margin:0;background:#000;color:#39ff6a;font:16px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  main{min-height:100%;display:grid;place-content:center;gap:10px;padding:24px;text-align:center}
  a{color:#b6ffc8}
</style>
<!-- Studio đã chuyển sang địa chỉ riêng để cài được thành app tách biệt với Anrevy House.
     Trang này chỉ chuyển hướng (giữ nguyên ?… và #…) và gỡ service worker cũ của Studio ở đây. -->
<script>
(function(){
  var to = '/anvy-studio/' + location.search + location.hash;
  try {
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(rs){
      rs.forEach(function(r){ if (/\/anrevy-house\/studio\/$/.test(r.scope)) r.unregister(); });
    }).catch(function(){});
  } catch (e) {}
  location.replace(to);
})();
</script>
</head>
<body>
<main>
  <p>Studio đã chuyển sang địa chỉ mới.</p>
  <p><a href="/anvy-studio/">→ mở Studio</a></p>
</main>
</body>
</html>
